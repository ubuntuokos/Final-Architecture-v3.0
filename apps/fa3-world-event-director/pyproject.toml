[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fa3-world-event-director"
version = "0.1.0"
description = "FA3 CPU-only World & Environment creative preview"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
qt = ["PySide6>=6.6,<7"]
screenshot = ["Pillow>=10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fa3_world*"]

[tool.setuptools.package-data]
fa3_world = ["qml/*.qml"]
