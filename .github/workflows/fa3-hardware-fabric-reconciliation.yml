name: FA3 Hardware Fabric Reconciliation

on:
  push:
    branches:
      - main
      - "fa3-hardware-fabric-reconciliation-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardware-fabric-reconciliation:
    name: hardware-fabric-reconciliation / fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          python -m py_compile \
            src/fa3_hardware_fabric_reconciliation.py \
            tests/test_hardware_fabric_reconciliation.py
      - name: Cross-layer semantic regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_hardware_fabric_reconciliation -v
      - name: Execute repository hardware semantic reconciliation gate
        env:
          PYTHONPATH: src
        run: python src/fa3_hardware_fabric_reconciliation.py --root .
      - name: Upload reconciliation report
        uses: actions/upload-artifact@v4
        with:
          name: hardware-fabric-reconciliation-report
          path: reports/hardware-fabric-reconciliation-report.json
