name: FA3 Motion Video Current-Host E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/fa3_motion_video_provider_adapter.py'
      - 'src/fa3_motion_video_current_host_gate.py'
      - 'src/fa3_video_model_router.py'
      - 'evidence/collect-motion-video-current-host.py'
      - 'tests/test_motion_video_provider_adapter.py'
      - 'tests/test_motion_video_current_host_gate.py'
      - 'tests/test_video_model_router.py'
      - 'tests/test_wan22_gate.py'
      - 'src/fa3_wan22_gate.py'
      - 'bin/fa3-motion-video-current-host.sh'
      - 'bin/fa3-video-route-select'
      - 'bin/fa3-wan22-provider-exec.py'
      - 'bin/fa3-wan22-current-host-admit.py'
      - 'bin/fa3-wan22-build-motion-video-manifest.py'
      - 'canonical/FA3-MOTION-VIDEO-RUNTIME-ADMISSION-001.json'
      - 'canonical/FA3-MOTION-VIDEO-CURRENT-HOST-CONFORMANCE-001.json'
      - 'canonical/FA3-GATE-MOTION-VIDEO-CURRENT-HOST-001.json'
      - 'canonical/contracts/FA3-MOTION-VIDEO-EXECUTION-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-VIDEO-MODEL-ROUTER-PROJECTION-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-WAN22-RUNTIME-CONFIG-001.schema.json'
      - 'canonical/providers/FA3-PROVIDER-WAN22-001.json'
      - 'canonical/motion-video-runtime-enforcement.json'
      - 'canonical/h3-replacement-enforcement.json'
      - 'canonical/profiles/FA3-VIDEO-001.json'
      - 'canonical/video-enforcement.json'
      - 'bin/fa3-enforce'
      - '.github/workflows/fa3-motion-video-current-host.yml'
  workflow_dispatch:
    inputs:
      execute_current_host:
        description: 'Execute real admitted motion/video provider E2E'
        required: true
        default: false
        type: boolean
      route_request:
        description: 'Provider-neutral motion/video route request'
        required: false
        default: '.fa3-current-host/input/motion-video-route-request.json'
        type: string
      candidate_manifest_list:
        description: 'List of already admitted provider execution manifests'
        required: false
        default: '.fa3-current-host/input/motion-video-candidate-manifests.json'
        type: string
      video_ir:
        description: 'Canonical VideoGenerationIR input'
        required: false
        default: '.fa3-current-host/input/motion-video-generation-ir.json'
        type: string
      hrb_receipt:
        description: 'Canonical CURRENT_HOST_ADMISSION evidence; required for local accelerator execution'
        required: false
        default: ''
        type: string
      acknowledge_billable_execution:
        description: 'Explicitly acknowledge billing if the routed provider is BILLABLE_REMOTE'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  regression:
    name: motion-video / contract-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: |
          python -m py_compile             src/fa3_motion_video_provider_adapter.py             src/fa3_motion_video_current_host_gate.py             src/fa3_video_model_router.py             src/fa3_wan22_gate.py             evidence/collect-motion-video-current-host.py             bin/fa3-wan22-provider-exec.py             bin/fa3-wan22-current-host-admit.py             bin/fa3-wan22-build-motion-video-manifest.py             tests/test_motion_video_provider_adapter.py             tests/test_motion_video_current_host_gate.py             tests/test_video_model_router.py             tests/test_wan22_gate.py             src/fa3_h3_replacement_gate.py
          bash -n bin/fa3-motion-video-current-host.sh bin/fa3-video-route-select bin/fa3-enforce
      - name: Replacement, router, adapter and Wan regression
        env:
          PYTHONPATH: src
        run: |
          python -m unittest             tests.test_h3_replacement_policy             tests.test_motion_video_provider_adapter             tests.test_motion_video_current_host_gate             tests.test_video_model_router             tests.test_wan22_gate -v
          ./bin/fa3-enforce h3-replacement
          ./bin/fa3-enforce wan22-video
      - name: Missing physical evidence fails closed
        run: |
          set +e
          ./bin/fa3-enforce motion-video-current-host
          rc=$?
          set -e
          test "$rc" -ne 0

  current-host:
    name: motion-video / real-provider-e2e
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_current_host }}
    needs: regression
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pre-admitted inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test -f "${{ inputs.route_request }}"
          test -f "${{ inputs.candidate_manifest_list }}"
          test -f "${{ inputs.video_ir }}"
          if [[ -n "${{ inputs.hrb_receipt }}" ]]; then test -f "${{ inputs.hrb_receipt }}"; fi
      - name: Route through FA3 Model Router authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/runtime/motion-video-current-host
          chmod +x bin/fa3-video-route-select
          bin/fa3-video-route-select             --request "${{ inputs.route_request }}"             --manifest-list "${{ inputs.candidate_manifest_list }}"             --output evidence/runtime/motion-video-current-host/selection.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/runtime/motion-video-current-host/selection.json").read_text())
          Path("evidence/runtime/motion-video-current-host/selected-manifest-path").write_text(r["provider_manifest_path"])
          PY
      - name: Execute provider-neutral real E2E
        shell: bash
        env:
          FA3_VIDEO_BILLABLE_E2E_ACK: ${{ inputs.acknowledge_billable_execution && 'I_ACKNOWLEDGE_BILLABLE_FA3_VIDEO_E2E' || '' }}
        run: |
          set -euo pipefail
          chmod +x bin/fa3-motion-video-current-host.sh bin/fa3-enforce
          manifest="$(cat evidence/runtime/motion-video-current-host/selected-manifest-path)"
          args=("evidence/runtime/motion-video-current-host/selection.json" "$manifest" "${{ inputs.video_ir }}")
          if [[ -n "${{ inputs.hrb_receipt }}" ]]; then args+=("${{ inputs.hrb_receipt }}"); fi
          bin/fa3-motion-video-current-host.sh "${args[@]}"
          ./bin/fa3-enforce motion-video-current-host
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-motion-video-current-host-evidence
          if-no-files-found: warn
          path: |
            evidence/receipts/motion-video-current-host.json
            evidence/runtime/motion-video-current-host/**
            reports/motion-video-current-host-gate-report.json
