name: FA3 Motion Video Current-Host E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/fa3_motion_video_provider_adapter.py'
      - 'src/fa3_motion_video_current_host_gate.py'
      - 'evidence/collect-motion-video-current-host.py'
      - 'tests/test_motion_video_provider_adapter.py'
      - 'tests/test_motion_video_current_host_gate.py'
      - 'bin/fa3-motion-video-current-host.sh'
      - 'canonical/FA3-MOTION-VIDEO-RUNTIME-ADMISSION-001.json'
      - 'canonical/FA3-MOTION-VIDEO-CURRENT-HOST-CONFORMANCE-001.json'
      - 'canonical/FA3-GATE-MOTION-VIDEO-CURRENT-HOST-001.json'
      - 'canonical/contracts/FA3-MOTION-VIDEO-EXECUTION-CONTRACTS-001.json'
      - 'canonical/motion-video-runtime-enforcement.json'
      - 'canonical/h3-replacement-enforcement.json'
      - 'canonical/profiles/FA3-VIDEO-001.json'
      - 'canonical/video-enforcement.json'
      - 'bin/fa3-enforce'
      - '.github/workflows/fa3-motion-video-current-host.yml'
  workflow_dispatch:
    inputs:
      execute_current_host:
        description: 'Execute real admitted motion/video provider E2E'
        required: true
        default: false
        type: boolean
      selection_receipt:
        description: 'Model Router motion/video selection receipt on current-host runner'
        required: false
        default: '.fa3-current-host/input/motion-video-selection.json'
        type: string
      provider_manifest:
        description: 'Admitted provider execution manifest'
        required: false
        default: '.fa3-current-host/input/motion-video-provider-manifest.json'
        type: string
      video_ir:
        description: 'Canonical VideoGenerationIR input'
        required: false
        default: '.fa3-current-host/input/motion-video-generation-ir.json'
        type: string
      hrb_receipt:
        description: 'HRB receipt; required only for local accelerator execution'
        required: false
        default: ''
        type: string
      acknowledge_billable_execution:
        description: 'Explicitly acknowledge billing if selected provider manifest is BILLABLE_REMOTE'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  regression:
    name: motion-video / contract-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: |
          python -m py_compile             src/fa3_motion_video_provider_adapter.py             src/fa3_motion_video_current_host_gate.py             evidence/collect-motion-video-current-host.py             tests/test_motion_video_provider_adapter.py             tests/test_motion_video_current_host_gate.py             src/fa3_h3_replacement_gate.py
          bash -n bin/fa3-motion-video-current-host.sh
      - name: Replacement and adapter regression
        env:
          PYTHONPATH: src
        run: |
          python -m unittest             tests.test_h3_replacement_policy             tests.test_motion_video_provider_adapter             tests.test_motion_video_current_host_gate -v
          ./bin/fa3-enforce h3-replacement
      - name: Missing physical evidence fails closed
        run: |
          set +e
          ./bin/fa3-enforce motion-video-current-host
          rc=$?
          set -e
          test "$rc" -ne 0

  current-host:
    name: motion-video / real-provider-e2e
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_current_host }}
    needs: regression
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pre-admitted inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test -f "${{ inputs.selection_receipt }}"
          test -f "${{ inputs.provider_manifest }}"
          test -f "${{ inputs.video_ir }}"
          if [[ -n "${{ inputs.hrb_receipt }}" ]]; then test -f "${{ inputs.hrb_receipt }}"; fi
      - name: Execute provider-neutral real E2E
        shell: bash
        env:
          FA3_VIDEO_BILLABLE_E2E_ACK: ${{ inputs.acknowledge_billable_execution && 'I_ACKNOWLEDGE_BILLABLE_FA3_VIDEO_E2E' || '' }}
        run: |
          set -euo pipefail
          chmod +x bin/fa3-motion-video-current-host.sh bin/fa3-enforce
          args=("${{ inputs.selection_receipt }}" "${{ inputs.provider_manifest }}" "${{ inputs.video_ir }}")
          if [[ -n "${{ inputs.hrb_receipt }}" ]]; then args+=("${{ inputs.hrb_receipt }}"); fi
          bin/fa3-motion-video-current-host.sh "${args[@]}"
          ./bin/fa3-enforce motion-video-current-host
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-motion-video-current-host-evidence
          if-no-files-found: warn
          path: |
            evidence/receipts/motion-video-current-host.json
            evidence/runtime/motion-video-current-host/**
            reports/motion-video-current-host-gate-report.json
