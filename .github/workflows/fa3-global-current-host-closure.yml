name: FA3 Global Current-Host Evidence Closure

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/current-host-capability-test-executors.json'
      - 'canonical/current-host-capability-test-qualifications.json'
      - 'canonical/current-host-capability-qualification-constituent-producers.json'
      - 'src/fa3_current_host_evidence_audit.py'
      - 'src/fa3_current_host_capability_handoff.py'
      - 'src/fa3_current_host_capability_attest.py'
      - 'src/fa3_current_host_capability_test_bundle.py'
      - 'src/fa3_current_host_capability_test_qualification_audit.py'
      - 'src/fa3_current_host_capability_test_qualifier.py'
      - 'src/fa3_current_host_capability_qualification_constituent_producer_audit.py'
      - 'src/fa3_current_host_capability_qualification_constituent_orchestrator.py'
      - 'src/fa3_current_host_capability_test_executor_audit.py'
      - 'src/fa3_current_host_capability_test_orchestrator.py'
      - 'src/fa3_cap075_contract_registry_current_host.py'
      - 'src/fa3_cap076_acceptance_resilience_current_host.py'
      - 'src/fa3_cap054_external_asset_inventory_current_host.py'
      - 'tests/test_current_host_evidence_audit.py'
      - 'tests/test_current_host_capability_handoff.py'
      - 'tests/test_current_host_capability_attest.py'
      - 'tests/test_current_host_capability_test_bundle.py'
      - 'tests/test_current_host_capability_test_qualification_audit.py'
      - 'tests/test_current_host_capability_test_qualifier.py'
      - 'tests/test_current_host_capability_qualification_constituent_producer_audit.py'
      - 'tests/test_current_host_capability_qualification_constituent_orchestrator.py'
      - 'tests/test_current_host_capability_test_executor_audit.py'
      - 'tests/test_current_host_capability_test_orchestrator.py'
      - 'tests/test_cap075_contract_registry_current_host.py'
      - 'tests/test_cap076_acceptance_resilience_current_host.py'
      - 'tests/test_cap054_external_asset_inventory_current_host.py'
      - 'evidence/reference/current-host-143-audit-*.json'
      - '.github/workflows/fa3-global-current-host-closure.yml'
  workflow_dispatch:
    inputs:
      execute_current_host:
        description: 'Execute the fail-closed 143-capability closure on the real FA3 current-host runner'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fa3-global-current-host-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closure-regression:
    name: current-host-closure / regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify executor inventory, orchestrator, bundle assembler, producer, handoff and auditor syntax
        run: |
          chmod +x bin/fa3-current-host bin/fa3-enforce
          python -m py_compile \
            src/fa3_current_host_capability_test_qualification_audit.py \
            src/fa3_current_host_capability_test_qualifier.py \
            src/fa3_current_host_capability_qualification_constituent_producer_audit.py \
            src/fa3_current_host_capability_qualification_constituent_orchestrator.py \
            src/fa3_current_host_capability_test_executor_audit.py \
            src/fa3_current_host_capability_test_orchestrator.py \
            src/fa3_cap075_contract_registry_current_host.py \
            src/fa3_cap076_acceptance_resilience_current_host.py \
            src/fa3_cap054_external_asset_inventory_current_host.py \
            src/fa3_current_host_capability_test_bundle.py \
            src/fa3_current_host_capability_attest.py \
            src/fa3_current_host_capability_handoff.py \
            src/fa3_current_host_evidence_audit.py \
            tests/test_current_host_capability_test_qualification_audit.py \
            tests/test_current_host_capability_test_qualifier.py \
            tests/test_current_host_capability_qualification_constituent_producer_audit.py \
            tests/test_current_host_capability_qualification_constituent_orchestrator.py \
            tests/test_current_host_capability_test_executor_audit.py \
            tests/test_current_host_capability_test_orchestrator.py \
            tests/test_cap075_contract_registry_current_host.py \
            tests/test_cap076_acceptance_resilience_current_host.py \
            tests/test_cap054_external_asset_inventory_current_host.py \
            tests/test_current_host_capability_test_bundle.py \
            tests/test_current_host_capability_attest.py \
            tests/test_current_host_capability_handoff.py \
            tests/test_current_host_evidence_audit.py
          ./bin/fa3-current-host verify
      - name: Executor inventory, orchestrator, bundle assembler, producer, handoff and auditor regression tests
        run: |
          PYTHONPATH=src python -m unittest \
            tests.test_current_host_capability_test_qualification_audit \
            tests.test_current_host_capability_test_qualifier \
            tests.test_current_host_capability_qualification_constituent_producer_audit \
            tests.test_current_host_capability_qualification_constituent_orchestrator \
            tests.test_current_host_capability_test_executor_audit \
            tests.test_current_host_capability_test_orchestrator \
            tests.test_cap075_contract_registry_current_host \
            tests.test_cap076_acceptance_resilience_current_host \
            tests.test_cap054_external_asset_inventory_current_host \
            tests.test_current_host_capability_test_bundle \
            tests.test_current_host_capability_attest \
            tests.test_current_host_capability_handoff \
            tests.test_current_host_evidence_audit -v
      - name: Audit explicit capability-level qualification definitions
        run: |
          PYTHONPATH=src python src/fa3_current_host_capability_test_qualification_audit.py --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          qualification=json.loads(Path('reports/current-host-capability-test-qualification-audit.json').read_text())
          assert qualification['audit_integrity'] == 'PASS', qualification
          assert qualification['required_test_obligation_count'] == 429, qualification
          assert qualification['qualified_definition_count'] + qualification['pending_definition_count'] == 429, qualification
          assert qualification['provider_receipts_promoted'] == 0, qualification
          assert qualification['component_receipts_promoted'] == 0, qualification
          assert qualification['generic_host_evidence_promoted'] == 0, qualification
          assert qualification['global_promotion_claim'] is False, qualification
          cap075=[row for row in qualification['accepted_qualifications'] if row['subject_id']=='CAP-075']
          assert len(cap075) == 3, cap075
          assert {row['test_kind'] for row in cap075} == {'positive','negative','rollback'}, cap075
          cap076=[row for row in qualification['accepted_qualifications'] if row['subject_id']=='CAP-076']
          assert len(cap076) == 3, cap076
          assert {row['test_kind'] for row in cap076} == {'positive','negative','rollback'}, cap076
          cap054=[row for row in qualification['accepted_qualifications'] if row['subject_id']=='CAP-054']
          assert len(cap054) == 3, cap054
          assert {row['test_kind'] for row in cap054} == {'positive','negative','rollback'}, cap054
          PY
      - name: Audit explicit qualification constituent producer coverage
        run: |
          PYTHONPATH=src python src/fa3_current_host_capability_qualification_constituent_producer_audit.py --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          producer_audit=json.loads(Path('reports/current-host-capability-qualification-constituent-producer-audit.json').read_text())
          assert producer_audit['audit_integrity'] == 'PASS', producer_audit
          assert producer_audit['registered_producer_count'] + producer_audit['pending_producer_count'] == producer_audit['required_constituent_count'], producer_audit
          assert producer_audit['provider_receipts_promoted'] == 0, producer_audit
          assert producer_audit['component_receipts_promoted'] == 0, producer_audit
          assert producer_audit['generic_host_evidence_promoted'] == 0, producer_audit
          assert producer_audit['global_promotion_claim'] is False, producer_audit
          cap075=[row for row in producer_audit['accepted_producers'] if row['subject_id']=='CAP-075']
          assert len(cap075) == 3, cap075
          assert {row['test_kind'] for row in cap075} == {'positive','negative','rollback'}, cap075
          cap076=[row for row in producer_audit['accepted_producers'] if row['subject_id']=='CAP-076']
          assert len(cap076) == 3, cap076
          assert {row['test_kind'] for row in cap076} == {'positive','negative','rollback'}, cap076
          cap054=[row for row in producer_audit['accepted_producers'] if row['subject_id']=='CAP-054']
          assert len(cap054) == 3, cap054
          assert {row['test_kind'] for row in cap054} == {'positive','negative','rollback'}, cap054
          PY
      - name: Prove hosted CI cannot produce current-host qualification constituents
        run: |
          PYTHONPATH=src python src/fa3_current_host_capability_qualification_constituent_orchestrator.py --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          producer_orchestrator=json.loads(Path('reports/current-host-capability-qualification-constituent-orchestrator.json').read_text())
          assert producer_orchestrator['orchestrator_integrity'] == 'PASS', producer_orchestrator
          assert producer_orchestrator['execution_requested'] is False, producer_orchestrator
          assert producer_orchestrator['constituents_materialized'] == 0, producer_orchestrator
          assert producer_orchestrator['provider_receipts_promoted'] == 0, producer_orchestrator
          assert producer_orchestrator['component_receipts_promoted'] == 0, producer_orchestrator
          assert producer_orchestrator['global_promotion_claim'] is False, producer_orchestrator
          PY
      - name: Audit explicit current-host capability executor coverage
        run: |
          PYTHONPATH=src python src/fa3_current_host_capability_test_executor_audit.py --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          executor=json.loads(Path('reports/current-host-capability-test-executor-audit.json').read_text())
          assert executor['audit_integrity'] == 'PASS', executor
          assert executor['required_test_obligation_count'] == 429, executor
          assert executor['registered_executor_count'] + executor['pending_executor_count'] == 429, executor
          assert executor['provider_receipts_promoted'] == 0, executor
          assert executor['generic_host_evidence_promoted'] == 0, executor
          assert executor['global_promotion_claim'] is False, executor
          cap075=[row for row in executor['registered_obligations'] if row['subject_id']=='CAP-075']
          assert len(cap075) == 3, cap075
          assert {row['test_kind'] for row in cap075} == {'positive','negative','rollback'}, cap075
          cap076=[row for row in executor['registered_obligations'] if row['subject_id']=='CAP-076']
          assert len(cap076) == 3, cap076
          assert {row['test_kind'] for row in cap076} == {'positive','negative','rollback'}, cap076
          cap054=[row for row in executor['registered_obligations'] if row['subject_id']=='CAP-054']
          assert len(cap054) == 3, cap054
          assert {row['test_kind'] for row in cap054} == {'positive','negative','rollback'}, cap054
          PY
      - name: Prove hosted CI cannot execute current-host capability tests
        run: |
          PYTHONPATH=src python src/fa3_current_host_capability_test_orchestrator.py --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          orchestrator=json.loads(Path('reports/current-host-capability-test-orchestrator.json').read_text())
          assert orchestrator['orchestrator_integrity'] == 'PASS', orchestrator
          assert orchestrator['execution_requested'] is False, orchestrator
          assert orchestrator['results_materialized'] == 0, orchestrator
          assert orchestrator['provider_receipts_promoted'] == 0, orchestrator
          assert orchestrator['generic_host_evidence_promoted'] == 0, orchestrator
          assert orchestrator['global_promotion_claim'] is False, orchestrator
          PY
      - name: Prove empty workspace cannot fabricate capability PASS
        run: |
          rm -rf \
            .fa3-current-host/qualification-source-artifacts \
            .fa3-current-host/qualification-constituents \
            .fa3-current-host/test-results \
            .fa3-current-host/test-artifacts \
            .fa3-current-host/test-plan \
            .fa3-current-host/test-bundles \
            .fa3-current-host/attestations \
            evidence/receipts/capabilities
          PYTHONPATH=src python src/fa3_current_host_capability_test_bundle.py --root .
          PYTHONPATH=src python src/fa3_current_host_capability_attest.py --root .
          PYTHONPATH=src python src/fa3_current_host_capability_handoff.py --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          assembler=json.loads(Path('reports/current-host-capability-test-bundle-assembler.json').read_text())
          producer=json.loads(Path('reports/current-host-capability-attestation-producer.json').read_text())
          handoff=json.loads(Path('reports/current-host-capability-handoff.json').read_text())
          plan=json.loads(Path('.fa3-current-host/test-plan/capabilities.json').read_text())
          assert assembler['assembler_integrity'] == 'PASS', assembler
          assert assembler['materialization_status'] == 'PENDING_CURRENT_HOST_TEST_RESULTS', assembler
          assert assembler['bundles_materialized'] == 0, assembler
          assert assembler['pending_capability_count'] == 143, assembler
          assert assembler['provider_receipts_promoted'] == 0, assembler
          assert assembler['global_promotion_claim'] is False, assembler
          assert plan['capability_count'] == 143, plan
          assert len(plan['capabilities']) == 143, plan
          assert producer['producer_integrity'] == 'PASS', producer
          assert producer['materialization_status'] == 'PENDING_CAPABILITY_TEST_BUNDLES', producer
          assert producer['attestations_materialized'] == 0, producer
          assert producer['provider_receipts_promoted'] == 0, producer
          assert producer['global_promotion_claim'] is False, producer
          assert handoff['handoff_integrity'] == 'PASS', handoff
          assert handoff['materialization_status'] == 'PENDING_CURRENT_HOST_ATTESTATIONS', handoff
          assert handoff['receipts_materialized'] == 0, handoff
          assert handoff['provider_receipts_promoted'] == 0, handoff
          assert handoff['global_promotion_claim'] is False, handoff
          PY
      - name: Audit exact 143-capability registry
        run: PYTHONPATH=src python src/fa3_current_host_evidence_audit.py --root .
      - name: Reconcile 19-point acceptance without weakening fail-closed semantics
        shell: bash
        run: |
          set +e
          ./bin/fa3-enforce acceptance
          acceptance_rc=$?
          ./bin/fa3-enforce promote
          promotion_rc=$?
          set -e
          if [ "$acceptance_rc" -ne 0 ] && [ "$acceptance_rc" -ne 2 ]; then exit "$acceptance_rc"; fi
          if [ "$promotion_rc" -ne 0 ] && [ "$promotion_rc" -ne 2 ]; then exit "$promotion_rc"; fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          executor=json.loads(Path('reports/current-host-capability-test-executor-audit.json').read_text())
          orchestrator=json.loads(Path('reports/current-host-capability-test-orchestrator.json').read_text())
          audit=json.loads(Path('reports/current-host-evidence-audit.json').read_text())
          acceptance=json.loads(Path('acceptance/acceptance-report.json').read_text())
          promotion=json.loads(Path('promotion/runtime-status.json').read_text())
          assert executor['audit_integrity'] == 'PASS', executor
          assert executor['registered_executor_count'] + executor['pending_executor_count'] == 429, executor
          assert orchestrator['orchestrator_integrity'] == 'PASS', orchestrator
          assert orchestrator['execution_requested'] is False, orchestrator
          assert orchestrator['results_materialized'] == 0, orchestrator
          assert audit['audit_integrity'] == 'PASS', audit
          assert audit['registry_pass_count'] + audit['registry_pending_count'] == 143, audit
          assert acceptance['static_gate'] == 'PASS', acceptance
          assert acceptance['criteria_total'] == 19, acceptance
          if audit['runtime_closure'] == 'PASS':
              assert executor['coverage_status'] == 'COMPLETE_429_OF_429', executor
              assert executor['registered_executor_count'] == 429, executor
              assert acceptance['status'] == 'PASS', acceptance
              assert promotion['actual_state'] == 'PROMOTED', promotion
          else:
              assert acceptance['status'] == 'DENIED', acceptance
              assert promotion['actual_state'] == 'PROMOTION_BLOCKED', promotion
          print(json.dumps({
              'executor_coverage': executor['coverage_status'],
              'registered_executors': executor['registered_executor_count'],
              'pending_executors': executor['pending_executor_count'],
              'hosted_orchestrator_execution_requested': orchestrator['execution_requested'],
              'hosted_orchestrator_results_materialized': orchestrator['results_materialized'],
              'repository_head': audit.get('repository_head'),
              'registry_pass_count': audit['registry_pass_count'],
              'registry_pending_count': audit['registry_pending_count'],
              'qualified_current_host_receipt_count': audit['qualified_current_host_receipt_count'],
              'static_gate': acceptance['static_gate'],
              'acceptance': acceptance['status'],
              'criteria_passed': acceptance['criteria_passed'],
              'criteria_total': acceptance['criteria_total'],
              'promotion': promotion['actual_state'],
          }, indent=2))
          PY
      - name: Upload regression reconciliation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-global-current-host-closure-regression
          if-no-files-found: error
          path: |
            .fa3-current-host/test-plan/capabilities.json
            reports/current-host-capability-test-qualification-audit.json
            reports/current-host-capability-qualification-constituent-producer-audit.json
            reports/current-host-capability-qualification-constituent-orchestrator.json
            reports/current-host-capability-qualification-constituent-producer-audit.json
            reports/current-host-capability-qualification-constituent-orchestrator.json
            reports/current-host-capability-test-executor-audit.json
            reports/current-host-capability-test-orchestrator.json
            reports/current-host-capability-test-bundle-assembler.json
            reports/current-host-capability-attestation-producer.json
            reports/current-host-capability-handoff.json
            reports/current-host-evidence-audit.json
            reports/runtime-gate-report.json
            reports/terax-gate-report.json
            acceptance/acceptance-report.json
            promotion/runtime-status.json

  current-host-closure:
    name: current-host-closure / real-execution
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_current_host }}
    needs: closure-regression
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove runner control-plane identity
        shell: bash
        run: |
          test "$(id -u)" -ne 0
          command -v python3
          command -v git
          chmod +x bin/fa3-current-host-runner-doctor bin/fa3-current-host bin/fa3-enforce evidence/collect-current-host.sh
          ./bin/fa3-current-host-runner-doctor
      - name: Collect fresh read-only host evidence
        shell: bash
        run: |
          rm -rf \
            .fa3-current-host/global-closure \
            .fa3-current-host/qualification-source-artifacts \
            .fa3-current-host/qualification-constituents \
            .fa3-current-host/test-results \
            .fa3-current-host/test-artifacts \
            .fa3-current-host/test-plan \
            .fa3-current-host/test-bundles \
            .fa3-current-host/attestations \
            evidence/receipts/capabilities
          mkdir -p \
            .fa3-current-host/global-closure \
            .fa3-current-host/qualification-source-artifacts \
            .fa3-current-host/qualification-constituents \
            .fa3-current-host/test-results/capabilities \
            .fa3-current-host/test-artifacts/capabilities \
            .fa3-current-host/test-bundles/capabilities \
            .fa3-current-host/attestations/capabilities
          bash evidence/collect-current-host.sh .fa3-current-host/global-closure/host
          set +e
          python3 evidence/collect-terax-current-host.py
          terax_collect_rc=$?
          set -e
          echo "terax_collect_rc=$terax_collect_rc" > .fa3-current-host/global-closure/collector-status.txt
      - name: Audit explicit capability qualification coverage before execution
        shell: bash
        run: |
          PYTHONPATH=src python3 src/fa3_current_host_capability_test_qualification_audit.py --root .
      - name: Audit explicit qualification constituent producer coverage before execution
        shell: bash
        run: |
          PYTHONPATH=src python3 src/fa3_current_host_capability_qualification_constituent_producer_audit.py --root .
      - name: Execute registered qualification constituent producers on the real current host
        shell: bash
        run: |
          PYTHONPATH=src python3 src/fa3_current_host_capability_qualification_constituent_orchestrator.py --root . --execute
      - name: Audit explicit capability executor coverage before execution
        shell: bash
        run: |
          PYTHONPATH=src python3 src/fa3_current_host_capability_test_executor_audit.py --root .
      - name: Execute only registered capability tests on the real current host
        shell: bash
        run: |
          PYTHONPATH=src python3 src/fa3_current_host_capability_test_orchestrator.py --root . --execute
      - name: Assemble bundles only from explicit real current-host capability test results
        shell: bash
        run: |
          PYTHONPATH=src python3 src/fa3_current_host_capability_test_bundle.py --root .
      - name: Produce attestations only from explicit capability test bundles
        shell: bash
        run: |
          PYTHONPATH=src python3 src/fa3_current_host_capability_attest.py --root .
      - name: Materialize only explicitly attested capability receipts
        shell: bash
        run: |
          PYTHONPATH=src python3 src/fa3_current_host_capability_handoff.py --root .
      - name: Reconcile only qualified capability receipts
        shell: bash
        run: |
          PYTHONPATH=src python3 src/fa3_current_host_evidence_audit.py --root . --apply-reconciliation
      - name: Run 19-point Acceptance Gate and promotion reconciliation
        shell: bash
        run: |
          set +e
          ./bin/fa3-enforce acceptance
          acceptance_rc=$?
          ./bin/fa3-enforce promote
          promotion_rc=$?
          set -e
          if [ "$acceptance_rc" -ne 0 ] && [ "$acceptance_rc" -ne 2 ]; then exit "$acceptance_rc"; fi
          if [ "$promotion_rc" -ne 0 ] && [ "$promotion_rc" -ne 2 ]; then exit "$promotion_rc"; fi
      - name: Assert fail-closed closure semantics
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          producer_audit=json.loads(Path('reports/current-host-capability-qualification-constituent-producer-audit.json').read_text())
          producer_orchestrator=json.loads(Path('reports/current-host-capability-qualification-constituent-orchestrator.json').read_text())
          executor=json.loads(Path('reports/current-host-capability-test-executor-audit.json').read_text())
          orchestrator=json.loads(Path('reports/current-host-capability-test-orchestrator.json').read_text())
          assembler=json.loads(Path('reports/current-host-capability-test-bundle-assembler.json').read_text())
          producer=json.loads(Path('reports/current-host-capability-attestation-producer.json').read_text())
          handoff=json.loads(Path('reports/current-host-capability-handoff.json').read_text())
          audit=json.loads(Path('reports/current-host-evidence-audit.json').read_text())
          acceptance=json.loads(Path('acceptance/acceptance-report.json').read_text())
          promotion=json.loads(Path('promotion/runtime-status.json').read_text())
          assert producer_audit['audit_integrity'] == 'PASS', producer_audit
          assert producer_audit['registered_producer_count'] + producer_audit['pending_producer_count'] == producer_audit['required_constituent_count'], producer_audit
          assert producer_audit['global_promotion_claim'] is False, producer_audit
          assert producer_orchestrator['orchestrator_integrity'] == 'PASS', producer_orchestrator
          assert producer_orchestrator['execution_requested'] is True, producer_orchestrator
          assert producer_orchestrator['constituents_materialized'] == producer_audit['registered_producer_count'], (producer_orchestrator, producer_audit)
          assert producer_orchestrator['provider_receipts_promoted'] == 0, producer_orchestrator
          assert producer_orchestrator['component_receipts_promoted'] == 0, producer_orchestrator
          assert producer_orchestrator['global_promotion_claim'] is False, producer_orchestrator
          assert executor['audit_integrity'] == 'PASS', executor
          assert executor['required_test_obligation_count'] == 429, executor
