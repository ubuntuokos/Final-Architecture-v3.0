name: FA3 Global Current-Host Evidence Closure

on:
  workflow_dispatch:
  push:
    branches:
      - fa3/global-current-host-evidence-closure-2026-08-31
    paths:
      - canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json

concurrency:
  group: fa3-global-current-host-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  current-host-audit:
    name: current-host-audit / fail-closed
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify real current host
        shell: bash
        run: |
          test "$(id -u)" -ne 0
          command -v python3
          command -v git
          uname -a
      - name: Collect read-only host fingerprint
        shell: bash
        run: |
          bash evidence/collect-current-host.sh evidence/runtime/global-current-host
      - name: Collect disabled-provider Terax current-host evidence
        shell: bash
        run: |
          python3 evidence/collect-terax-current-host.py
      - name: Reconcile only cryptographically qualified capability receipts
        shell: bash
        run: |
          PYTHONPATH=src python3 src/fa3_current_host_evidence_audit.py --root . --apply-reconciliation
      - name: Run 19-point Acceptance Gate
        id: acceptance
        shell: bash
        run: |
          set +e
          ./bin/fa3-enforce acceptance
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
      - name: Run global promotion reconciliation
        id: promotion
        shell: bash
        run: |
          set +e
          ./bin/fa3-enforce promote
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
      - name: Verify fail-closed semantics
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("acceptance/acceptance-report.json").read_text())
          p=json.loads(Path("promotion/runtime-status.json").read_text())
          e=json.loads(Path("reports/current-host-evidence-audit.json").read_text())
          assert e["audit_integrity"] == "PASS", e
          if e["runtime_closure"] == "PASS":
              assert a["status"] == "PASS" and p["actual_state"] == "PROMOTED", (a,p)
          else:
              assert a["status"] == "DENIED" and p["actual_state"] == "PROMOTION_BLOCKED", (a,p)
          print(json.dumps({
              "audit_integrity": e["audit_integrity"],
              "runtime_closure": e["runtime_closure"],
              "registry_pass_count": e["registry_pass_count"],
              "acceptance": a["status"],
              "criteria_passed": a["criteria_passed"],
              "promotion": p["actual_state"],
          }, indent=2))
          PY
      - name: Upload closure evidence and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-global-current-host-closure
          path: |
            evidence/runtime/global-current-host/
            evidence/receipts/
            reports/current-host-evidence-audit.json
            reports/runtime-gate-report.json
            reports/terax-gate-report.json
            acceptance/acceptance-report.json
            promotion/runtime-status.json
