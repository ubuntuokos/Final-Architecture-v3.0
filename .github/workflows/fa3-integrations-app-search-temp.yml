name: FA3 temporary integrations and app-search patch

on:
  push:
    branches:
      - fa3-gui-integrations-fa3-app-search

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa3-gui-integrations-fa3-app-search
          fetch-depth: 0
          persist-credentials: true
      - name: Patch FA3 GUI and regenerate release projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('apps/fa3-control-center/qml/Main.qml')
          text = main_path.read_text(encoding='utf-8')

          marker = '    property var rtdProviderCategories: [\n'
          if marker not in text:
              raise SystemExit('rtdProviderCategories marker not found')

          app_surface = '''    // User-facing applications represented inside FA3. This catalog is deliberately\n    // independent from the host XDG/.desktop application inventory.\n    property var fa3ApplicationIndex: [\n        {title: "ComfyUI", detail: "FA3 image/video generation frontend · Shared Models", pageIndex: 20},\n        {title: "Automatic1111", detail: "FA3 Stable Diffusion frontend · Shared Models", pageIndex: 20},\n        {title: "Forge", detail: "FA3 Stable Diffusion Forge frontend · Shared Models", pageIndex: 20},\n        {title: "Fooocus", detail: "FA3 image generation frontend · Shared Models", pageIndex: 20},\n        {title: "Krita", detail: "FA3 creative editor integration", pageIndex: 14},\n        {title: "GIMP", detail: "FA3 creative editor integration", pageIndex: 14},\n        {title: "Kdenlive", detail: "FA3 video editor integration", pageIndex: 14},\n        {title: "Bforartist", detail: "FA3 3D/DCC integration", pageIndex: 14},\n        {title: "Blender", detail: "FA3 3D/DCC integration", pageIndex: 14},\n        {title: "Natron", detail: "FA3 compositing integration", pageIndex: 14},\n        {title: "Gaffer", detail: "FA3 compositing/look-dev integration", pageIndex: 14},\n        {title: "Goose", detail: "FA3 agent client integration", pageIndex: 14},\n        {title: "Open WebUI", detail: "FA3 local AI client integration", pageIndex: 14},\n        {title: "OpenYak", detail: "FA3 desktop agent workbench integration", pageIndex: 14},\n        {title: "n8n", detail: "FA3 workflow orchestration application", pageIndex: 4},\n        {title: "Temporal", detail: "FA3 durable workflow runtime", pageIndex: 4},\n        {title: "Ollama", detail: "FA3 local model runtime/provider", pageIndex: 5},\n        {title: "LM Studio", detail: "FA3 local model client/provider", pageIndex: 5}\n    ]\n\n    function searchFa3Applications(query) {\n        var needle = query.trim().toLowerCase()\n        var out = []\n        for (var i = 0; i < fa3ApplicationIndex.length; ++i) {\n            var app = fa3ApplicationIndex[i]\n            var haystack = (app.title + " " + app.detail).toLowerCase()\n            if (needle.length === 0 || haystack.indexOf(needle) >= 0) {\n                out.push({\n                    id: app.title,\n                    title: app.title,\n                    subtitle: app.detail,\n                    status: "FA3 APP",\n                    category: "APPLICATION",\n                    sourceType: "APPLICATION",\n                    pageIndex: app.pageIndex,\n                    path: ""\n                })\n            }\n        }\n        return out\n    }\n\n'''
          if 'property var fa3ApplicationIndex:' not in text:
              text = text.replace(marker, app_surface + marker, 1)

          old_search = '''        if (scope === "ALL" || scope === "APPLICATION") {\n            var apps = fa3Repository.searchInstalledApplications(needle)\n            for (i = 0; i < apps.length; ++i) out.push(apps[i])\n        }'''
          new_search = '''        if (scope === "ALL" || scope === "APPLICATION") {\n            var apps = searchFa3Applications(needle)\n            for (i = 0; i < apps.length; ++i) out.push(apps[i])\n        }'''
          if old_search not in text:
              raise SystemExit('old host application search block not found')
          text = text.replace(old_search, new_search, 1)

          # Make the scope wording explicit to operators when the current label exists.
          text = text.replace('{text: "Appok", value: "APPLICATION"}', '{text: "FA3 appok", value: "APPLICATION"}')
          text = text.replace('{ text: "Appok"; value: "APPLICATION" }', '{ text: "FA3 appok"; value: "APPLICATION" }')
          text = text.replace('text: "Appok"; value: "APPLICATION"', 'text: "FA3 appok"; value: "APPLICATION"')

          ai_studio = '                        NavButton { iconText: "✦"; label: "AI Studio"; pageIndex: 3 }\n'
          integration = '                        NavButton { iconText: "↔"; label: "Integrations"; pageIndex: 14 }\n'
          if ai_studio not in text or integration not in text:
              raise SystemExit('navigation markers not found')
          text = text.replace(integration, '', 1)
          text = text.replace(ai_studio, ai_studio + integration, 1)

          main_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_fa3_gui_gate.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '\n\nif __name__ == "__main__":\n'
          if anchor not in tests:
              raise SystemExit('test insertion anchor not found')
          test_method = '''\n    def test_integrations_follows_ai_studio_and_application_search_is_fa3_scoped(self):\n        main = (ROOT / "apps/fa3-control-center/qml/Main.qml").read_text(encoding="utf-8")\n\n        self.assertIn("property var fa3ApplicationIndex", main)\n        self.assertIn("function searchFa3Applications", main)\n        self.assertIn("var apps = searchFa3Applications(needle)", main)\n        self.assertNotIn("fa3Repository.searchInstalledApplications(needle)", main)\n        for app in ["ComfyUI", "Automatic1111", "Forge", "Fooocus", "Krita", "GIMP", "Kdenlive", "Open WebUI", "OpenYak", "Ollama", "LM Studio"]:\n            self.assertIn('title: "' + app + '"', main)\n\n        studio = 'NavButton { iconText: "✦"; label: "AI Studio"; pageIndex: 3 }'\n        integrations = 'NavButton { iconText: "↔"; label: "Integrations"; pageIndex: 14 }'\n        self.assertEqual(1, main.count(integrations))\n        self.assertIn(studio + "\\n                        " + integrations, main)\n'''
          if 'test_integrations_follows_ai_studio_and_application_search_is_fa3_scoped' not in tests:
              tests = tests.replace(anchor, test_method + anchor, 1)
              test_path.write_text(tests, encoding='utf-8')
          PY

          # The deterministic release projection must describe the permanent tree only.
          temp_workflow=".github/workflows/fa3-integrations-app-search-temp.yml"
          saved="/tmp/fa3-integrations-app-search-temp.yml"
          mv "$temp_workflow" "$saved"
          python src/fa3_release_projection_regenerate.py
          mv "$saved" "$temp_workflow"

          git config user.name "fa3-gui-integrations-app-search"
          git config user.email "fa3-gui-integrations-app-search@users.noreply.github.com"
          git add apps/fa3-control-center/qml/Main.qml tests/test_fa3_gui_gate.py canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          if git diff --cached --quiet; then
            echo "No patch required"
            exit 0
          fi
          git commit -m "FA3 GUI: move Integrations and scope app search to FA3"
          git push origin HEAD:fa3-gui-integrations-fa3-app-search
