name: FA3 Application Portfolio and Entitlements
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portfolio-entitlement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 -m py_compile src/fa3_application_portfolio.py
      - run: PYTHONPATH=. python3 -m unittest tests.test_application_portfolio -v
      - run: python3 src/fa3_application_portfolio.py --check
      - run: python3 src/fa3_application_portfolio.py --apps fa3.story-screenplay fa3.render-manager
