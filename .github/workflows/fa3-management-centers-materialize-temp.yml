name: FA3 temporary management centers materialization

on:
  push:
    branches:
      - fa3-gui-checkpoint-external-token-centers

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa3-gui-checkpoint-external-token-centers
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize GUI wiring
        run: python src/fa3_gui_materialize_management_centers_temp.py
      - name: Validate GUI contract
        run: python src/fa3_gui_gate.py
      - name: Regenerate release projection
        run: python src/fa3_release_projection_regenerate.py
      - name: Commit generated state
        run: |
          git config user.name "fa3-gui-materializer"
          git config user.email "fa3-gui-materializer@users.noreply.github.com"
          git add -A
          git commit -m "FA3 GUI: wire Checkpoint, External Provider and Token centers"
          git push origin HEAD:fa3-gui-checkpoint-external-token-centers
