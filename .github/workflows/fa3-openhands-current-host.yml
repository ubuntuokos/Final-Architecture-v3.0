name: FA3 OpenHands Current-Host Runtime E2E

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Evidence mode
        required: true
        default: isolated
        type: choice
        options:
          - isolated
          - production
      task_id:
        description: Pre-authorized production task identity
        required: false
        default: fa3-openhands-production-v1
        type: string
      tool_auth_receipt:
        description: Absolute runner path to external canonical tool authorization receipt
        required: false
        default: /run/user/1000/fa3-openhands/tool-auth.json
        type: string
      litellm_key_file:
        description: Absolute runner path to external LiteLLM key file
        required: false
        default: /run/user/1000/fa3-openhands/litellm-key
        type: string
      litellm_port:
        description: Host loopback LiteLLM port
        required: false
        default: "4000"
        type: string
      model_alias:
        description: Canonical model-router alias
        required: false
        default: developer-agent-primary
        type: string
  push:
    branches:
      - fa3/openhands-current-host-2026-09-03
    paths:
      - .github/workflows/fa3-openhands-current-host.yml
      - canonical/FA3-OPENHANDS-RUNTIME-CONFORMANCE-001.json
      - canonical/openhands-current-host-enforcement.json
      - canonical/openhands-runtime-admission.json
      - canonical/decisions/FA3-DEC-OPENHANDS-CURRENT-HOST-2026-09-03.json
      - src/fa3_openhands_adapter.py
      - src/fa3_openhands_router_bridge.py
      - src/fa3_openhands_current_host_worker.py
      - src/fa3_openhands_current_host_gate.py
      - evidence/collect-openhands-current-host.py
      - bin/fa3-openhands-bootstrap.sh
      - bin/fa3-openhands-current-host.sh
      - tests/test_openhands_current_host.py

permissions:
  contents: read

concurrency:
  group: fa3-openhands-current-host-${{ github.ref }}-${{ github.event.inputs.mode || 'isolated' }}
  cancel-in-progress: true

jobs:
  isolated:
    name: openhands-current-host / isolated-real-runtime
    if: github.event_name == 'push' || github.event.inputs.mode == 'isolated'
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 60
    env:
      FA3_CURRENT_HOST: "1"
      FA3_OPENHANDS_HOME: ${{ runner.temp }}/fa3-openhands
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Current-host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v git
          command -v python3
          command -v python3.12
          command -v bwrap
          test "${RUNNER_ENVIRONMENT:-}" = "self-hosted"
      - name: Static current-host adapter regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m unittest tests.test_openhands_current_host -v
      - name: Materialize pinned OpenHands runtime
        shell: bash
        run: |
          set -euo pipefail
          bash bin/fa3-openhands-bootstrap.sh --allow-network-bootstrap --base "$FA3_OPENHANDS_HOME"
      - name: Execute real isolated OpenHands runtime E2E
        shell: bash
        run: |
          set -euo pipefail
          bash bin/fa3-openhands-current-host.sh isolated
      - name: Upload isolated current-host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-openhands-current-host-isolated
          path: |
            evidence/receipts/openhands-current-host-isolated.json
            evidence/runtime/openhands-current-host/
            reports/openhands-current-host-gate-report.json

  production:
    name: openhands-current-host / production-e2e
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'production'
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 60
    env:
      FA3_CURRENT_HOST: "1"
      FA3_OPENHANDS_HOME: ${{ runner.temp }}/fa3-openhands
      FA3_OPENHANDS_TASK_ID: ${{ github.event.inputs.task_id }}
      FA3_OPENHANDS_TOOL_AUTH_RECEIPT: ${{ github.event.inputs.tool_auth_receipt }}
      FA3_OPENHANDS_LITELLM_KEY_FILE: ${{ github.event.inputs.litellm_key_file }}
      FA3_OPENHANDS_LITELLM_PORT: ${{ github.event.inputs.litellm_port }}
      FA3_OPENHANDS_MODEL_ALIAS: ${{ github.event.inputs.model_alias }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Current-host production prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "${RUNNER_ENVIRONMENT:-}" = "self-hosted"
          command -v git
          command -v python3
          command -v python3.12
          command -v bwrap
          test -f "$FA3_OPENHANDS_TOOL_AUTH_RECEIPT"
          test -f "$FA3_OPENHANDS_LITELLM_KEY_FILE"
          mode="$(stat -c '%a' "$FA3_OPENHANDS_LITELLM_KEY_FILE")"
          case "$mode" in
            600|400) ;;
            *) echo "LiteLLM key file must be 0600 or stricter" >&2; exit 2 ;;
          esac
      - name: Static current-host adapter regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m unittest tests.test_openhands_current_host -v
      - name: Materialize pinned OpenHands runtime
        shell: bash
        run: |
          set -euo pipefail
          bash bin/fa3-openhands-bootstrap.sh --allow-network-bootstrap --base "$FA3_OPENHANDS_HOME"
      - name: Execute real production OpenHands E2E
        shell: bash
        run: |
          set -euo pipefail
          bash bin/fa3-openhands-current-host.sh production
      - name: Upload production current-host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-openhands-current-host-production
          path: |
            evidence/receipts/openhands-current-host.json
            evidence/runtime/openhands-current-host/
            reports/openhands-current-host-gate-report.json
