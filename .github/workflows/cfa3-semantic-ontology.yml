name: CFA3 Semantic Ontology Static Conformance

on:
  push:
    branches:
      - cfa3/semantic-ontology-fabric-20261007
    paths:
      - 'canonical/profiles/FA3-SHARED-SEMANTIC-ONTOLOGY-001.json'
      - 'canonical/contracts/FA3-SHARED-SEMANTIC-ONTOLOGY-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-SDK-SEMANTIC-ONTOLOGY-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-SEMANTIC-STUDIO-GUI-CONTRACTS-001.json'
      - 'canonical/decisions/CFA3-DEC-SEMANTIC-ONTOLOGY-FABRIC-2026-10-07.json'
      - 'canonical/current-host-impact/CFA3-CH-IMPACT-SEMANTIC-ONTOLOGY-FABRIC-20261007.json'
      - 'src/fa3_shared_semantic_ontology.py'
      - 'tests/test_shared_semantic_ontology.py'
      - 'bin/fa3-shared-semantic-ontology'
      - 'docs/CFA3-SEMANTIC-ONTOLOGY-FABRIC-001.md'
      - 'docs/CFA3-SDK-SEMANTIC-ONTOLOGY-001.md'
      - 'docs/CFA3-SEMANTIC-STUDIO-GUI-001.md'
      - '.github/workflows/cfa3-semantic-ontology.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator and tests
        run: python3 -m py_compile src/fa3_shared_semantic_ontology.py tests/test_shared_semantic_ontology.py
      - name: Validate canonical contracts
        run: PYTHONPATH=src python3 src/fa3_shared_semantic_ontology.py --check
      - name: Run semantic ontology regressions
        run: PYTHONPATH=src python3 -m unittest tests.test_shared_semantic_ontology -v
      - name: Confirm static-only boundary
        run: |
          python3 - <<'PY'
          import json
          p='canonical/current-host-impact/CFA3-CH-IMPACT-SEMANTIC-ONTOLOGY-FABRIC-20261007.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['status']=='NO_RUNTIME_IMPACT', d
          assert d['capability_baseline']==175, d
          assert d['capability_delta']==0, d
          assert d['authority_delta']==0, d
          assert d['physical_current_host_pass_claimed'] is False, d
          PY
