name: FA3 Remote AI Global Reconciliation

on:
  push:
    branches:
      - fa3/remote-ai-hub-hf-spaces
    paths:
      - 'tools/fa3_remote_ai_exec_global_reconcile.py'
      - 'tests/test_remote_ai_exec_global_reconciliation.py'
      - '.github/workflows/fa3-remote-ai-exec-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fa3-remote-ai-global-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: remote-ai-global-reconciliation / P0
    if: github.ref_name == 'fa3/remote-ai-hub-hf-spaces'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fa3/remote-ai-hub-hf-spaces
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare global enforcement reconciliation
        run: python tools/fa3_remote_ai_exec_global_reconcile.py --prepare-only

      - name: Commit non-projection reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/enforcement-policy.json
          git diff --cached --quiet || git commit -m "FA3: reconcile Remote AI global enforcement policy"

      - name: Regenerate unified release projection from committed snapshot
        run: python tools/fa3_remote_ai_exec_global_reconcile.py --projection-only --snapshot-head HEAD

      - name: Commit unified projection
        run: |
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git diff --cached --quiet || git commit -m "FA3: reconcile Remote AI unified release projection [projection]"

      - name: Validate Remote AI and global release gates
        run: |
          PYTHONPATH=src python src/fa3_remote_ai_exec_gate.py
          PYTHONPATH=src python -m unittest tests.test_remote_ai_exec_gate tests.test_remote_ai_exec_global_reconciliation -v
          PYTHONPATH=src python -m unittest tests.test_release_projection -v
          ./bin/fa3-enforce release-projection

      - name: Push reconciled commits
        run: git push origin HEAD:fa3/remote-ai-hub-hf-spaces
