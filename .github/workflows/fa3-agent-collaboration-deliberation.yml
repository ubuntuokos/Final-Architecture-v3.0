name: FA3 Agent Collaboration & Deliberation

on:
  push:
    paths:
      - 'canonical/FA3-GATE-AGENT-COLLABORATION-DELIBERATION-001.json'
      - 'canonical/agent-collaboration-deliberation-enforcement.json'
      - 'canonical/profiles/FA3-AGENT-COLLABORATION-DELIBERATION-001.json'
      - 'canonical/contracts/FA3-AGENT-COLLABORATION-DELIBERATION-CONTRACTS-001.json'
      - 'canonical/decisions/FA3-DEC-AGENT-COLLABORATION-DELIBERATION-2026-09-27.json'
      - 'canonical/references/FA3-AGENT-ROOM-PATTERN-REFERENCE-2026-09-27.json'
      - 'canonical/intents/FA3-AGENT-COLLABORATION-DELIBERATION-APPLICATION-INTENT-001.json'
      - 'canonical/assessments/FA3-AGENT-COLLABORATION-DELIBERATION-*'
      - 'canonical/FA3-GATE-REGISTRY-001.json'
      - 'canonical/enforcement-policy.json'
      - 'canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json'
      - 'canonical/distribution-registry.json'
      - 'canonical/distribution-manifest.json'
      - 'src/fa3_agent_deliberation*.py'
      - 'evidence/collect-agent-deliberation-reference-e2e.py'
      - 'tests/test_agent_deliberation*.py'
      - 'bin/fa3-enforce'
      - '.github/workflows/fa3-agent-collaboration-deliberation.yml'
  pull_request:
    paths:
      - 'canonical/FA3-GATE-AGENT-COLLABORATION-DELIBERATION-001.json'
      - 'canonical/agent-collaboration-deliberation-enforcement.json'
      - 'canonical/profiles/FA3-AGENT-COLLABORATION-DELIBERATION-001.json'
      - 'canonical/contracts/FA3-AGENT-COLLABORATION-DELIBERATION-CONTRACTS-001.json'
      - 'canonical/decisions/FA3-DEC-AGENT-COLLABORATION-DELIBERATION-2026-09-27.json'
      - 'canonical/references/FA3-AGENT-ROOM-PATTERN-REFERENCE-2026-09-27.json'
      - 'canonical/intents/FA3-AGENT-COLLABORATION-DELIBERATION-APPLICATION-INTENT-001.json'
      - 'canonical/assessments/FA3-AGENT-COLLABORATION-DELIBERATION-*'
      - 'canonical/FA3-GATE-REGISTRY-001.json'
      - 'canonical/enforcement-policy.json'
      - 'canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json'
      - 'canonical/distribution-registry.json'
      - 'canonical/distribution-manifest.json'
      - 'src/fa3_agent_deliberation*.py'
      - 'evidence/collect-agent-deliberation-reference-e2e.py'
      - 'tests/test_agent_deliberation*.py'
      - 'bin/fa3-enforce'
      - '.github/workflows/fa3-agent-collaboration-deliberation.yml'
  workflow_dispatch:

jobs:
  agent-collaboration-deliberation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile src/fa3_agent_deliberation.py src/fa3_agent_deliberation_runtime.py src/fa3_agent_deliberation_gate.py evidence/collect-agent-deliberation-reference-e2e.py
      - name: Focused regression tests
        run: bash bin/fa3-test -q tests/test_agent_deliberation.py tests/test_agent_deliberation_runtime.py
      - name: Reference-runtime loopback E2E
        run: ./bin/fa3-enforce agent-deliberation-reference-e2e
      - name: Canonical gate
        run: ./bin/fa3-enforce agent-deliberation
      - name: Gate registry
        run: ./bin/fa3-enforce gate-registry
      - name: Distribution compliance
        run: ./bin/fa3-enforce distribution-compliance
      - name: Release projection
        run: ./bin/fa3-enforce release-projection
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fa3-agent-collaboration-deliberation
          path: |
            reports/agent-collaboration-deliberation-gate-report.json
            reports/agent-deliberation-reference-e2e-report.json
            evidence/receipts/agent-deliberation-ci-reference-e2e.json
          if-no-files-found: warn
