name: FA3 Kdenlive Audio Conditioning Current Host Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'canonical/contracts/FA3-KDENLIVE-AUDIO-CONDITIONING-CONTRACTS-001.json'
      - 'canonical/providers/FA3-PROVIDER-SILERO-VAD-001.json'
      - 'canonical/kdenlive-audio-conditioning-enforcement.json'
      - 'src/fa3_silero_vad_provider.py'
      - 'src/fa3_kdenlive_audio_pipeline.py'
      - 'evidence/collect-kdenlive-audio-conditioning-current-host.py'
      - '.github/workflows/fa3-kdenlive-audio-conditioning-current-host.yml'

permissions:
  contents: read

jobs:
  current-host-readiness:
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect current-host readiness evidence
        shell: bash
        run: |
          mkdir -p reports
          python3 evidence/collect-kdenlive-audio-conditioning-current-host.py | tee reports/kdenlive-audio-conditioning-current-host-readiness.json
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kdenlive-audio-conditioning-current-host-readiness
          path: reports/kdenlive-audio-conditioning-current-host-readiness.json
