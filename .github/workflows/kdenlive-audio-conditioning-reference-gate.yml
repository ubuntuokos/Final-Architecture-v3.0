name: Kdenlive Audio Conditioning Reference Gate

on:
  pull_request:
    paths:
      - "canonical/contracts/FA3-KDENLIVE-AUDIO-CONDITIONING-CONTRACTS-001.json"
      - "canonical/providers/FA3-PROVIDER-SILERO-VAD-001.json"
      - "canonical/references/FA3-SILERO-VAD-UPSTREAM-REFERENCE-2026-09-10.json"
      - "canonical/FA3-SILERO-VAD-MODEL-ALLOWLIST-001.json"
      - "canonical/FA3-SILERO-VAD-RUNTIME-CONFORMANCE-001.json"
      - "canonical/decisions/FA3-DEC-KDENLIVE-AUDIO-CONDITIONING-2026-09-10.json"
      - "canonical/FA3-GATE-KDENLIVE-AUDIO-CONDITIONING-001.json"
      - "canonical/kdenlive-audio-conditioning-enforcement.json"
      - "src/fa3_silero_vad_provider.py"
      - "src/fa3_kdenlive_audio_conditioning.py"
      - "src/fa3_kdenlive_audio_conditioning_gate.py"
      - "tests/test_kdenlive_audio_conditioning.py"
      - ".github/workflows/kdenlive-audio-conditioning-reference-gate.yml"
  push:
    branches: [main]
    paths:
      - "canonical/contracts/FA3-KDENLIVE-AUDIO-CONDITIONING-CONTRACTS-001.json"
      - "canonical/providers/FA3-PROVIDER-SILERO-VAD-001.json"
      - "src/fa3_kdenlive_audio_conditioning_gate.py"
      - "tests/test_kdenlive_audio_conditioning.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile reference implementation
        run: |
          python -m py_compile \
            src/fa3_silero_vad_provider.py \
            src/fa3_kdenlive_audio_conditioning.py \
            src/fa3_kdenlive_audio_conditioning_gate.py \
            evidence/collect-kdenlive-audio-conditioning-current-host.py
      - name: Run unit and negative regressions
        run: python -m unittest tests.test_kdenlive_audio_conditioning -v
      - name: Run canonical fail-closed gate
        run: PYTHONPATH=src python src/fa3_kdenlive_audio_conditioning_gate.py
      - name: Assert no production runtime promotion claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          runtime=json.loads(Path("canonical/FA3-SILERO-VAD-RUNTIME-CONFORMANCE-001.json").read_text())
          assert runtime["status"] == "PENDING_CURRENT_HOST"
          assert runtime["production_admitted"] is False
          PY
