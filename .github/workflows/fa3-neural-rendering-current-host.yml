name: FA3 Neural Rendering Current Host
on:
  workflow_dispatch:
    inputs:
      provider_id:
        description: "Exact provider id to request; leave empty to validate the optional-provider negative path"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  current-host:
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 30
    env:
      FA3_NEURAL_RENDERING_REQUEST_PROVIDER: ${{ inputs.provider_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Static admission first
        run: |
          chmod +x bin/fa3-enforce
          ./bin/fa3-enforce neural-rendering
      - name: Current-host optional-provider or provider-E2E gate
        run: |
          ./bin/fa3-enforce neural-rendering-current-host --provider-id "$FA3_NEURAL_RENDERING_REQUEST_PROVIDER" --output reports/neural-rendering-current-host-report.json
      - name: Upload current-host report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fa3-neural-rendering-current-host
          path: reports/neural-rendering-current-host-report.json
