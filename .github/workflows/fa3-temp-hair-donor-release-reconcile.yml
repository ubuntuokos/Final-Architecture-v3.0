name: TEMP Reconcile Hair Donor Release Projection

on:
  push:
    branches:
      - fa3/donor-hair-groom-sources-20261003
    paths:
      - .github/workflows/fa3-temp-hair-donor-release-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact main and active intake branch
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "0a5641204c6f8caaf65e2e4bfc4af928b5579d54"
          test "$(git rev-parse HEAD:canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json)" = "fa8ce930d9582f31eb2fa75bec81a13bf8e40255"
      - name: Remove temporary workflow from projection snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fa3-temp-hair-donor-release-reconcile.yml
          git commit -m "chore: remove temporary release projection reconciler"
      - name: Regenerate unified release projection
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 src/fa3_release_projection_regenerate.py --snapshot-head "$(git rev-parse HEAD)"
      - name: Verify donor and projection regressions
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -c 'from tests.test_donor_deep_learning_memory_vision_hair_20261003 import test_deep_learning_memory_vision_hair_donor_intake as t; t()'
          PYTHONPATH=src python3 -m unittest \
            tests.test_donor_hair_groom_sources_20261003 \
            tests.test_release_projection -v
      - name: Commit reconciled projection
        run: |
          set -euo pipefail
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git diff --cached --check
          git commit -m "fix(release): reconcile hair donor intake projection"
          git push origin HEAD:fa3/donor-hair-groom-sources-20261003
