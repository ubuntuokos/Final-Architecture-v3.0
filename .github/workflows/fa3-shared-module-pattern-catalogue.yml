name: FA3 Shared Module Pattern Catalogue

on:
  pull_request:
    paths:
      - "canonical/FA3-SHARED-MODULE-PATTERN-CATALOGUE-001.json"
      - "canonical/schemas/FA3-SHARED-MODULE-PATTERN-CATALOGUE-SCHEMA-001.json"
      - "canonical/decisions/FA3-DEC-SHARED-MODULE-PATTERN-DONOR-CATALOGUE-2026-10-01.json"
      - "canonical/assessments/FA3-SHARED-MODULE-PATTERN-CATALOGUE-REUSE-ASSESSMENT-001.json"
      - "canonical/FA3-SHARED-MODULE-PATTERN-CATALOGUE-CURRENT-HOST-IMPACT-001.json"
      - "canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json"
      - "canonical/FA3-APPLICATION-DONOR-LINKS-001.json"
      - "canonical/FA3-REUSE-CATALOG-001.json"
      - "src/fa3_reuse_catalog.py"
      - "src/fa3_shared_module_pattern_catalogue.py"
      - "bin/fa3-shared-pattern-catalogue"
      - "tests/test_shared_module_pattern_catalogue.py"
      - "docs/shared-module-pattern-donor-catalogue.md"
      - "canonical/profiles/FA3-SHARED-AI-INTERACTION-001.json"
      - "canonical/contracts/FA3-SHARED-AI-INTERACTION-CONTRACTS-001.json"
      - "canonical/profiles/FA3-SHARED-KNOWLEDGE-RETRIEVAL-001.json"
      - "canonical/contracts/FA3-SHARED-KNOWLEDGE-RETRIEVAL-CONTRACTS-001.json"
      - "canonical/profiles/FA3-SHARED-MULTIMODAL-SOURCE-001.json"
      - "canonical/contracts/FA3-SHARED-MULTIMODAL-SOURCE-CONTRACTS-001.json"
      - "canonical/profiles/FA3-SHARED-CONVERSATION-SESSION-001.json"
      - "canonical/contracts/FA3-SHARED-CONVERSATION-SESSION-CONTRACTS-001.json"
      - "canonical/profiles/FA3-SHARED-TOOL-ACTION-MEDIATION-001.json"
      - "canonical/contracts/FA3-SHARED-TOOL-ACTION-MEDIATION-CONTRACTS-001.json"
      - "src/fa3_application_donor_index.py"
      - "tests/test_application_donor_index.py"
  push:
    branches: [main]
    paths:
      - "canonical/FA3-SHARED-MODULE-PATTERN-CATALOGUE-001.json"
      - "canonical/FA3-REUSE-CATALOG-001.json"
      - "src/fa3_reuse_catalog.py"
      - "src/fa3_shared_module_pattern_catalogue.py"
      - "tests/test_shared_module_pattern_catalogue.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate shared pattern catalogue
        run: python3 bin/fa3-shared-pattern-catalogue --check --summary
      - name: Syntax
        run: python3 -m py_compile src/fa3_shared_module_pattern_catalogue.py src/fa3_application_donor_index.py
      - name: Run pattern catalogue regressions
        run: python3 -m unittest tests.test_shared_module_pattern_catalogue -v
      - name: Validate shared capability consumer map
        run: python3 src/fa3_application_donor_index.py --check --summary
      - name: Run application/capability map regressions
        run: python3 -m unittest tests.test_application_donor_index -v
