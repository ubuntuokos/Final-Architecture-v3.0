name: FA3 Hardware Fabric Maintenance

on:
  push:
    branches:
      - fa3-hardware-fabric-reconciliation-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message || '', '[projection-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate deterministic hardware reconciliation patch
        run: python reports/fa3-hardware-fabric-maintenance.py all
      - name: Syntax check reconciled Python surfaces
        run: |
          python -m py_compile \
            src/fa3_closed_loop_agent_ops_reference.py \
            src/fa3_loop_engineering_gate.py \
            src/fa3_hardware_fabric_reconciliation.py \
            src/fa3_release_projection_gate.py \
            tests/test_loop_engineering_gate.py \
            tests/test_hardware_fabric_reconciliation.py \
            tests/test_release_projection.py
      - name: Targeted reconciliation tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_loop_engineering_gate tests.test_hardware_fabric_reconciliation tests.test_release_projection -v
      - name: Hardware semantic reconciliation gate
        env:
          PYTHONPATH: src
        run: python src/fa3_hardware_fabric_reconciliation.py --root .
      - name: Unified release projection gate
        env:
          PYTHONPATH: src
        run: python src/fa3_release_projection_gate.py --root .
      - name: Upload generated patch set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-fabric-generated-patch
          if-no-files-found: error
          include-hidden-files: true
          path: |
            canonical/enforcement-policy.json
            canonical/profiles/FA3-CLOSED-LOOP-AGENT-OPERATIONS-001.json
            canonical/FA3-HARDWARE-FABRIC-RECONCILIATION-001.json
            src/fa3_closed_loop_agent_ops_reference.py
            src/fa3_loop_engineering_gate.py
            tests/test_loop_engineering_gate.py
            canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
            reports/hardware-fabric-reconciliation-report.json
            reports/release-projection-gate-report.json
