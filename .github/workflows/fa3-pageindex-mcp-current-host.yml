name: FA3 PageIndex MCP Current-Host E2E

on:
  workflow_dispatch:
    inputs:
      source_root:
        description: 'Absolute pinned PageIndex MCP source-build root'
        required: true
        default: '/opt/fa3/providers/pageindex-mcp-bda946b4b6fffaaf6926aa8809bc62e0098f30e8'
        type: string
      oauth_home:
        description: 'Absolute ephemeral Secret-Broker home containing .pageindex-mcp/oauth-tokens.json'
        required: true
        type: string
      sample_pdf:
        description: 'Absolute path to an approved local PDF for real upload/retrieval E2E'
        required: true
        type: string

permissions:
  contents: read

jobs:
  pageindex-current-host:
    name: pageindex-mcp-current-host / authenticated-e2e
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify prerequisites
        shell: bash
        env:
          SOURCE_ROOT: ${{ inputs.source_root }}
          OAUTH_HOME: ${{ inputs.oauth_home }}
          SAMPLE_PDF: ${{ inputs.sample_pdf }}
        run: |
          command -v node
          command -v git
          test -d "$SOURCE_ROOT/.git"
          test -r "$SOURCE_ROOT/build/index.js"
          test -r "$OAUTH_HOME/.pageindex-mcp/oauth-tokens.json"
          test -r "$SAMPLE_PDF"
          mode="$(stat -c '%a' "$OAUTH_HOME/.pageindex-mcp/oauth-tokens.json")"
          test "$mode" -le 600
      - name: Run real Gateway to PageIndex index/retrieve E2E
        shell: bash
        env:
          SOURCE_ROOT: ${{ inputs.source_root }}
          OAUTH_HOME: ${{ inputs.oauth_home }}
          SAMPLE_PDF: ${{ inputs.sample_pdf }}
        run: |
          bash bin/fa3-pageindex-mcp-current-host.sh \
            --source-root "$SOURCE_ROOT" \
            --oauth-home "$OAUTH_HOME" \
            --sample-pdf "$SAMPLE_PDF"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fa3-pageindex-mcp-current-host-evidence
          path: |
            evidence/receipts/pageindex-mcp-current-host.json
            reports/pageindex-mcp-current-host-gate-report.json
