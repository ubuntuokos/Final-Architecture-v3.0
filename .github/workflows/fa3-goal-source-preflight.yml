name: FA3 Goal Source-Bound Preflight

on:
  pull_request:
    paths:
      - "src/fa3_goal_preflight.py"
      - "tests/test_goal_preflight.py"
      - "canonical/intents/FA3-GOAL-EXECUTION-APPLICATION-INTENT-2026-09-28.json"
      - "canonical/assessments/FA3-GOAL-EXECUTION-REUSE-ASSESSMENT-2026-09-28.json"
      - "docs/goal-driven-source-bound-preflight.md"
      - ".github/workflows/fa3-goal-source-preflight.yml"
  push:
    branches: [main]
    paths:
      - "src/fa3_goal_preflight.py"
      - "tests/test_goal_preflight.py"
      - "canonical/intents/FA3-GOAL-EXECUTION-APPLICATION-INTENT-2026-09-28.json"
      - "canonical/assessments/FA3-GOAL-EXECUTION-REUSE-ASSESSMENT-2026-09-28.json"
      - "docs/goal-driven-source-bound-preflight.md"
      - ".github/workflows/fa3-goal-source-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python syntax
        run: python3 -m py_compile src/fa3_goal_preflight.py tests/test_goal_preflight.py
      - name: Emit deterministic reuse assessment for new ApplicationIntent
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import json
          from pathlib import Path
          from fa3_reuse_assessment import assess_intent
          root=Path('.').resolve()
          path=root/'canonical/intents/FA3-GOAL-EXECUTION-APPLICATION-INTENT-2026-09-28.json'
          result=assess_intent(root,json.loads(path.read_text()))
          subset={key:result.get(key) for key in ('project_id','intent_id','result','implementation_readiness','gaps','mandatory_source_reviews','selected_reuse','blocking_findings')}
          print('GOAL_REUSE_ASSESSMENT='+json.dumps(subset,sort_keys=True))
          assert result['result']=='PASS'
          PY
      - name: Source-bound design and adversarial tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p "test_goal_preflight.py" -v
      - name: Original goal foundation compatibility
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p "test_goal_execution_foundation.py" -v
      - name: Application donor index gate
        run: PYTHONPATH=src python3 src/fa3_application_donor_index.py --check --summary
