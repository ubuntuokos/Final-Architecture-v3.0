name: FA3 Central MCP Gateway

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/profiles/FA3-MCP-GATEWAY-001.json'
      - 'canonical/contracts/FA3-MCP-GATEWAY-CONTRACTS-001.json'
      - 'canonical/decisions/FA3-DEC-CENTRAL-MCP-GATEWAY-2026-09-18.json'
      - 'canonical/references/FA3-MCP-GATEWAY-MICROSOFT-REFERENCE-2026-09-18.json'
      - 'canonical/FA3-GATE-MCP-GATEWAY-001.json'
      - 'canonical/FA3-MCP-GATEWAY-GUI-001.json'
      - 'canonical/mcp-gateway-enforcement.json'
      - 'src/fa3_mcp_gateway.py'
      - 'src/fa3_mcp_gateway_server.py'
      - 'src/fa3_mcp_gateway_gate.py'
      - 'tests/test_mcp_gateway_final.py'
      - 'apps/fa3-control-center/**'
      - '.github/workflows/fa3-mcp-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile src/fa3_mcp_gateway.py src/fa3_mcp_gateway_server.py src/fa3_mcp_gateway_gate.py
      - name: Canonical MCP Gateway regression
        run: PYTHONPATH=src python -m unittest tests.test_mcp_gateway_final -v
      - name: Canonical gate
        run: ./bin/fa3-enforce mcp-gateway
      - name: Current-host static non-regression
        run: ./bin/fa3-enforce mcp-current-host --static
      - name: GUI authority non-regression
        run: PYTHONPATH=src python src/fa3_gui_gate.py
