name: FA3 temporary ModulePage rendering fix

on:
  push:
    branches:
      - fa3-gui-ask-menu-anchor-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa3-gui-ask-menu-anchor-fix
          fetch-depth: 0
          persist-credentials: true
      - name: Make ModulePage references deterministic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main = Path('apps/fa3-control-center/qml/Main.qml')
          text = main.read_text(encoding='utf-8')
          old = '''    component ModulePage: ScrollView {\n        property string pageTitle: ""\n        property string pageSubtitle: ""\n        property var cards: []\n        clip: true\n        contentWidth: availableWidth\n        padding: 18\n        ColumnLayout {\n            width: parent.width\n            spacing: 16\n            SectionTitle { title: parent.parent.pageTitle; subtitle: parent.parent.pageSubtitle }\n            Flow {\n                Layout.fillWidth: true\n                spacing: 12\n                Repeater {\n                    model: parent.parent.parent.cards\n                    delegate: ModuleCard {\n                        required property var modelData\n                        title: modelData.title || ""\n                        subtitle: modelData.subtitle || ""\n                        badge: modelData.badge || "READY"\n                        tone: modelData.tone || window.accent\n                    }\n                }\n            }\n        }\n    }\n'''
          new = '''    component ModulePage: ScrollView {\n        id: modulePage\n        property string pageTitle: ""\n        property string pageSubtitle: ""\n        property var cards: []\n        clip: true\n        contentWidth: availableWidth\n        padding: 18\n        ColumnLayout {\n            width: modulePage.availableWidth\n            spacing: 16\n            SectionTitle { title: modulePage.pageTitle; subtitle: modulePage.pageSubtitle }\n            Flow {\n                Layout.fillWidth: true\n                spacing: 12\n                Repeater {\n                    model: modulePage.cards\n                    delegate: ModuleCard {\n                        required property var modelData\n                        title: modelData.title || ""\n                        subtitle: modelData.subtitle || ""\n                        badge: modelData.badge || "READY"\n                        tone: modelData.tone || window.accent\n                    }\n                }\n            }\n        }\n    }\n'''
          if old not in text:
              raise SystemExit('expected ModulePage block not found')
          main.write_text(text.replace(old, new, 1), encoding='utf-8')

          gate = Path('src/fa3_gui_gate.py')
          g = gate.read_text(encoding='utf-8')
          needle = '    if "id: askButton" not in qml or "id: askMenu" not in qml or "y: parent.height" not in qml: failures.append("qml-ask-menu-anchor-missing")\n'
          addition = needle + '    if "id: modulePage" not in qml or "model: modulePage.cards" not in qml or "width: modulePage.availableWidth" not in qml: failures.append("qml-module-page-render-contract-missing")\n'
          if needle not in g:
              raise SystemExit('expected ask-menu gate line not found')
          gate.write_text(g.replace(needle, addition, 1), encoding='utf-8')
          PY

          rm -f .github/workflows/fa3-module-page-render-fix-temp.yml
          git config user.name "fa3-gui-fix"
          git config user.email "fa3-gui-fix@users.noreply.github.com"
          git add apps/fa3-control-center/qml/Main.qml src/fa3_gui_gate.py .github/workflows/fa3-module-page-render-fix-temp.yml
          git commit -m "FA3 GUI: restore ModulePage content rendering"
          FIX_HEAD="$(git rev-parse HEAD)"
          PYTHONPATH=src python src/fa3_release_projection_regenerate.py --snapshot-head "$FIX_HEAD"
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git commit -m "FA3 release projection: reconcile ModulePage rendering fix"
          git push origin HEAD:fa3-gui-ask-menu-anchor-fix
