name: TEMP Vanessik Donor Materialization

on:
  push:
    branches:
      - fa3/donor-vanessik-20261003
    paths:
      - .github/workflows/fa3-temp-vanessik-donor-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact published parent and donor serialization
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "e5fb23319d57844b6c8b018e06e8f8281d8dc269"
          test "$(git rev-parse origin/main:canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json)" = "637efbe7aa85079f42f32b597ef19b9b9c239002"
          PYTHONPATH=src python3 src/fa3_donor_readiness.py --phase status
      - name: Materialize explicit Vanessik donor intake
        run: python3 scripts/fa3_temp_vanessik_donor_materialize.py
      - name: Verify donor intake regressions
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m unittest \
            tests.test_donor_vanessik_20261003 \
            tests.test_donor_hair_groom_sources_20261003 \
            tests.test_donor_count_refresh \
            tests.test_donor_registry_identity_uniqueness -v
      - name: Commit canonical donor intake and remove temporary helpers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fa3-temp-vanessik-donor-materialize.yml
          git rm scripts/fa3_temp_vanessik_donor_materialize.py
          git add canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json \
                  canonical/deltas/FA3-DONOR-VANESSIK-2026-10-03.json \
                  docs/donor-vanessik-2026-10-03.md \
                  tests/test_donor_vanessik_20261003.py
          git diff --cached --check
          git commit -m "Donor intake: add Vanessik profile reference"
      - name: Regenerate unified release projection
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 src/fa3_release_projection_regenerate.py --snapshot-head "$(git rev-parse HEAD)"
      - name: Verify release projection
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m unittest tests.test_release_projection -v
      - name: Commit reconciled projection and push
        run: |
          set -euo pipefail
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git diff --cached --check
          git commit -m "fix(release): reconcile Vanessik donor intake projection"
          git push origin HEAD:fa3/donor-vanessik-20261003
