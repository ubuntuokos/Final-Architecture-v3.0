name: FA3 Resource Admission Current Host

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/FA3-GATE-RESOURCE-ADMISSION-CURRENT-HOST-001.json'
      - 'canonical/resource-admission-current-host-enforcement.json'
      - 'canonical/decisions/FA3-DEC-RESOURCE-ADMISSION-CURRENT-HOST-2026-09-14.json'
      - 'evidence/reference/resource-admission-current-host-pending.json'
      - 'evidence/collect-resource-admission-current-host.py'
      - 'src/fa3_resource_admission_current_host_gate.py'
      - 'src/fa3_resource_admission_smoke.py'
      - 'tests/test_resource_admission_current_host_gate.py'
      - 'tests/test_resource_admission_smoke.py'
      - 'tests/test_hrb_validator_bridge.py'
      - 'libexec/fa3-host-resource-broker-validate-root.py'
      - 'libexec/fa3-host-resource-broker-validator.sh'
      - 'bin/fa3-install-hrb-validator-bridge.sh'
      - 'bin/fa3-resource-admission-current-host.sh'
      - 'bin/fa3-current-host-runner-bootstrap.sh'
      - 'bin/fa3-current-host-runner-doctor'
      - 'bin/fa3-enforce'
      - 'fa3-current-host/manifest.json'
      - '.github/workflows/fa3-resource-admission-current-host.yml'
      - '.github/workflows/fa3-current-host.yml'
  workflow_dispatch:
    inputs:
      execute_current_host:
        description: 'Execute real current-host resource admission on the labeled self-hosted runner'
        required: true
        default: false
        type: boolean
      workload_envelope:
        description: 'Output path for the generated fa3.workload-resource-envelope.v1 smoke envelope'
        required: false
        default: '.fa3-current-host/input/resource-smoke-workload-envelope.json'
        type: string
      hrb_lease:
        description: 'Optional path to a pre-existing real HRB AcceleratorExecutionLease; leave empty to use the runner-preconfigured external HRB acquire adapter'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  reference-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile evidence/collect-resource-admission-current-host.py src/fa3_resource_admission_current_host_gate.py src/fa3_resource_admission_smoke.py libexec/fa3-host-resource-broker-validate-root.py
      - name: Current-host contract, smoke and HRB validator bridge regressions
        run: PYTHONPATH=src python -m unittest tests.test_resource_admission_current_host_gate tests.test_resource_admission_smoke tests.test_hrb_validator_bridge -v
      - name: Parent normalization gate
        run: ./bin/fa3-enforce resource-evidence-normalization
      - name: Missing real current-host receipt must fail closed
        run: |
          set +e
          ./bin/fa3-enforce resource-admission-current-host
          rc=$?
          set -e
          test "$rc" -eq 2
      - name: Unified current-host projection stays coherent
        run: ./bin/fa3-current-host verify
      - name: Unified release projection stays coherent
        run: ./bin/fa3-enforce release-projection

  production-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_current_host }}
    needs: reference-regression
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify root-separated HRB validator bridge
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/bin/fa3-host-resource-broker-validator
          test -x /usr/local/libexec/fa3-host-resource-broker-validate-root
          sudo -n -l /usr/local/libexec/fa3-host-resource-broker-validate-root /dev/null >/dev/null
      - name: Run fail-closed resource-admission smoke bootstrap
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/fa3-enforce bin/fa3-resource-admission-current-host.sh evidence/collect-resource-admission-current-host.py
          args=(smoke --workload-envelope "${{ inputs.workload_envelope }}")
          if [[ -n "${{ inputs.hrb_lease }}" ]]; then
            args+=(--hrb-lease "${{ inputs.hrb_lease }}")
          fi
          ./bin/fa3-resource-admission-current-host.sh "${args[@]}"
      - name: Re-validate current-host receipt independently
        run: ./bin/fa3-enforce resource-admission-current-host
      - name: Upload scoped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-resource-admission-current-host
          if-no-files-found: warn
          path: |
            evidence/receipts/resource-admission-current-host.json
            reports/resource-admission-smoke-bootstrap-report.json
            reports/resource-admission-current-host-gate-report.json
            reports/resource-evidence-normalization-gate-report.json
            .fa3-current-host/input/resource-smoke-workload-envelope.json
