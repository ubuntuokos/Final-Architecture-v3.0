name: FA3 Decision Fabric Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/**DECISION-FABRIC**'
      - 'canonical/**JEV**'
      - 'canonical/profiles/FA3-CONTEXT-SELECTION-001.json'
      - 'canonical/profiles/FA3-EXTERNAL-PROJECT-RADAR-001.json'
      - 'src/fa3_decision*.py'
      - 'src/fa3_context_selection.py'
      - 'src/fa3_external_project_radar.py'
      - 'src/fa3_jev_decision_provider.py'
      - 'tests/test_decision_fabric.py'
      - 'research/external-project-radar/jev/**'
      - '.github/workflows/fa3-decision-fabric.yml'
  push:
    branches: [main]
    paths:
      - 'canonical/**DECISION-FABRIC**'
      - 'canonical/**JEV**'
      - 'canonical/profiles/FA3-CONTEXT-SELECTION-001.json'
      - 'canonical/profiles/FA3-EXTERNAL-PROJECT-RADAR-001.json'
      - 'src/fa3_decision*.py'
      - 'src/fa3_context_selection.py'
      - 'src/fa3_external_project_radar.py'
      - 'src/fa3_jev_decision_provider.py'
      - 'tests/test_decision_fabric.py'
      - 'research/external-project-radar/jev/**'
      - '.github/workflows/fa3-decision-fabric.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: decision-fabric-static / P0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: |
          python -m py_compile             src/fa3_decision_fabric.py             src/fa3_decision_adapters.py             src/fa3_context_selection.py             src/fa3_external_project_radar.py             src/fa3_jev_decision_provider.py             src/fa3_decision_fabric_gate.py             src/fa3_decision_current_host_gate.py             tests/test_decision_fabric.py
      - name: Canonical fail-closed gate
        run: PYTHONPATH=src python src/fa3_decision_fabric_gate.py --root .
      - name: Future-project adoption gate
        run: |
          git fetch origin main --depth=1
          PYTHONPATH=src python src/fa3_decision_adoption_gate.py --root . --base-ref origin/main
      - name: Regression tests
        run: PYTHONPATH=src python -m unittest tests.test_decision_fabric -v
      - name: Pinned Jev radar snapshot validation
        run: |
          PYTHONPATH=src python src/fa3_external_project_radar.py             --snapshot-dir research/external-project-radar/jev/upstream/a27922ad457389775f4fe4eadcf688afc9d36d83             --output reports/jev-radar-report.json             >/dev/null
