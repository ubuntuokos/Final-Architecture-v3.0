name: FA3 Temporary Release Projection Reconcile

on:
  push:
    branches:
      - fa3/model-manager-llmfit-gui-2026-09-13
    paths:
      - '.github/workflows/fa3-temp-release-projection-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove one-shot workflow from final release surface
        run: rm .github/workflows/fa3-temp-release-projection-reconcile.yml

      - name: Rebuild repository release-surface manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          sys.path.insert(0, str(root / 'src'))
          import fa3_release_projection_gate as gate

          projection_path = root / gate.PROJECTION_PATH
          projection = json.loads(projection_path.read_text(encoding='utf-8'))

          manifest = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              rel = path.relative_to(root).as_posix()
              if rel.startswith('.git/'):
                  continue
              if rel == gate.PROJECTION_PATH or gate.is_mutable_runtime_path(rel):
                  continue
              manifest.append({
                  'path': rel,
                  'git_blob_sha': gate.git_blob_sha(path),
              })

          projection['manifest'] = sorted(manifest, key=lambda row: row['path'])
          projection_path.write_text(
              json.dumps(projection, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Verify reconciled projection fail-closed
        run: PYTHONPATH=. python src/fa3_release_projection_gate.py

      - name: Commit reconciled projection and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'FA3: reconcile release projection for llmfit Model Manager'
          git push origin HEAD:${GITHUB_REF_NAME}
