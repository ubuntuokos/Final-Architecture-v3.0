name: FA3 WED verified source materialization
on:
  push:
    branches:
      - fa3/environmental-natural-phenomena-discovery-20260928
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fa3-wed-one-shot-source
  cancel-in-progress: false

jobs:
  unpack-test-screenshot-and-commit:
    if: "!contains(github.event.head_commit.message, '[source-materialized]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa3/environmental-natural-phenomena-discovery-20260928
          persist-credentials: true
      - name: Verify and unpack exact reviewed executable source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, tarfile
          parts = [Path(f".github/staging/wed-source.part{i:02d}").read_text(encoding="utf-8") for i in range(5)]
          assert list(map(len, parts)) == [7000, 7000, 7000, 7000, 1280]
          raw = base64.b64decode("".join(parts), validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          assert digest == "6e09c0928c137348983bd7d92b831a8d4f7ae2114115080cd9eee1cdce16bd8d", digest
          root=Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:xz") as archive:
              names=[m.name for m in archive.getmembers()]
              assert len(names)==len(set(names))
              for m in archive.getmembers():
                  target=(root/m.name).resolve()
                  assert target.is_relative_to(root), m.name
                  assert m.isfile() or m.isdir(), m.name
                  assert m.name.startswith(("apps/fa3-world-event-director/","bin/fa3-world-event-director","tests/test_world_event_director.py",".github/workflows/fa3-world-event-director-ci.yml")), m.name
                  if target.exists() and m.isfile():
                      raise RuntimeError(f"refusing to overwrite unexpected existing source: {m.name}")
              archive.extractall(path=root, filter="data")
          print("Reviewed source SHA-256 PASS:",digest)
          print("Unpacked source paths:",len(names))
          PY
      - name: Real CPU-only unit and headless runtime tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q apps/fa3-world-event-director
          python3 -m unittest discover -s tests -p 'test_world_event_director.py' -v
          python3 apps/fa3-world-event-director/launch.py --headless-preview > /tmp/fa3-wed-preview.json
          python3 - <<'PY'
          import json
          j=json.load(open("/tmp/fa3-wed-preview.json"))
          assert j["project"]["weather"]["origin"]=="AUTHOR_INVENTED"
          assert j["project"]["current_host_admitted"] is False
          assert len(j["four_scales"])==4
          print("CPU reference, provenance and four spatial scopes PASS")
          PY
      - name: Install headless screenshot requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth python3-tk python3-pil fonts-dejavu-core
      - name: Capture screenshot from running GUI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets/readme
          xvfb-run -a --server-args='-screen 0 1700x1140x24' /usr/bin/python3 \
            apps/fa3-world-event-director/launch.py --gui tk \
            --screenshot docs/assets/readme/world-environment-studio-runtime.png
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          path=Path("docs/assets/readme/world-environment-studio-runtime.png")
          assert path.stat().st_size > 20_000, path.stat().st_size
          with Image.open(path) as im:
              im.verify()
          with Image.open(path) as im:
              assert im.width>=1400 and im.height>=900, im.size
              print("REAL running GUI screenshot PASS:", im.size, path.stat().st_size, "bytes")
          PY
      - name: Update repository README with actual running GUI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r=Path("README.md")
          t=r.read_text(encoding="utf-8")
          needle="### World & Environment Studio\n\nEnvironment design covers natural, architectural, historical and fictional settings — from rooms, streets, forests and oceans to historical periods, fantasy worlds, science-fiction environments and mixed settings."
          assert needle in t, "README anchor changed; manual reconciliation required"
          section="""### World & Environment Studio

          Environment design covers natural, architectural, historical and fictional settings — from rooms, streets, forests and oceans to historical periods, fantasy worlds, science-fiction environments and mixed settings.

          **Executable World & Event Director MVP:** [source, instructions and current limitations](apps/fa3-world-event-director/README.md) · [detailed application plan](docs/world-event-director-application-plan-2026-09-28.md). The implemented local-first CPU reference calculates time-zone-aware seasonal and solar context; renders four linked interactive landscape, city, building-surroundings and interior previews; has editable weather, reversible screenplay events, project save/load, a narrative/event timeline and an explicitly authorized world-rule override. Fiction does not silently change Earth's north, Sun position or seasonal baseline.

          ![Actual running FA3 World & Environment Studio desktop GUI: weather, four spatial scopes, dates and narrative timeline](docs/assets/readme/world-environment-studio-runtime.png)

          *Actual screenshot captured by executing the Tk desktop frontend under a Linux virtual display, not a generated concept image. Qt6/QML frontend source is included, but Qt runtime validation, real historical data feeds, physically validated simulators, native Bforartists/Video Editor handoff and current-host runtime admission remain separate tasks.*"""
          t=t.replace(needle,section,1)
          r.write_text(t,encoding="utf-8")
          PY
      - name: Remove transport parts and self-disabling materializer
        shell: bash
        run: |
          git rm -f .github/staging/wed-source.part00 .github/staging/wed-source.part01 .github/staging/wed-source.part02 .github/staging/wed-source.part03 .github/staging/wed-source.part04
          git rm -f .github/workflows/fa3-wed-materialize.yml
      - name: Reconcile release projection Git-blob manifest fail-closed
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, json
          def git(*args):
              return subprocess.check_output(["git",*args],text=True).strip()
          projection=Path("canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json")
          obj=json.loads(projection.read_text(encoding="utf-8"))
          manifest={row["path"]:row for row in obj["manifest"]}
          staged=git("diff","--cached","--name-status").splitlines()
          changed=[]
          for line in staged:
              parts=line.split("\t",1)
              if len(parts)!=2:
                  raise RuntimeError("unexpected staged diff line: "+line)
              op,path=parts
              if path==projection.as_posix(): continue
              if op=="D":
                  manifest.pop(path,None)
                  continue
              if op not in ("A","M"):
                  raise RuntimeError("unexpected path operation: "+line)
              item=Path(path)
              assert item.is_file(),path
              blob=git("hash-object","--",path)
              assert len(blob)==40
              if path in manifest:
                  manifest[path]["git_blob_sha"]=blob
              else:
                  manifest[path]={"path":path,"git_blob_sha":blob,"baseline_delta_status":"added" if op=="A" else "modified"}
              changed.append(path)
          obj["manifest"]=sorted(manifest.values(),key=lambda row:row["path"])
          obj["manifest_entry_count"]=len(obj["manifest"])
          assert len({row["path"] for row in obj["manifest"]})==len(obj["manifest"])
          assert "docs/assets/readme/world-environment-studio-runtime.png" in changed
          assert "README.md" in changed
          assert "apps/fa3-world-event-director/fa3_world/engine.py" in changed
          assert "apps/fa3-world-event-director/fa3_world/qml/Main.qml" in changed
          assert "tests/test_world_event_director.py" in changed
          projection.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Manifest reconciled for",len(changed),"files; entries =",len(obj["manifest"]))
          PY
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git diff --cached --check
      - name: Commit the tested implementation and README on the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FA3 implementation bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[source-materialized] feat(world): executable CPU environment editor, real screenshot, README and tests"
          git push origin HEAD:fa3/environmental-natural-phenomena-discovery-20260928
