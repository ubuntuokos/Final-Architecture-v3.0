name: FA3 Conversation Meeting Work Fabric
on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/**CONVERSATION-MEETING-WORK**'
      - 'src/fa3_conversation_meeting_work.py'
      - 'src/fa3_conversation_meeting_work_gate.py'
      - 'tests/test_conversation_meeting_work.py'
      - 'canonical/FA3-GATE-REGISTRY-001.json'
      - 'canonical/enforcement-policy.json'
      - 'REUSE.toml'
      - '.github/workflows/fa3-conversation-meeting-work.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m py_compile src/fa3_conversation_meeting_work.py src/fa3_conversation_meeting_work_gate.py tests/test_conversation_meeting_work.py
      - env: {PYTHONPATH: src}
        run: python -m unittest tests.test_conversation_meeting_work -v
      - env: {PYTHONPATH: src}
        run: python src/fa3_conversation_meeting_work_gate.py
      - env: {PYTHONPATH: src}
        run: python src/fa3_gate_registry.py
      - env: {PYTHONPATH: src}
        run: python src/fa3_reuse_gate.py
