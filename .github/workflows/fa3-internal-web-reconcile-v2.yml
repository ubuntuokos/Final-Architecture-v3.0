name: FA3 internal web reconcile v2

on:
  push:
    branches:
      - fa3-gui-deploy-verification-v1

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa3-gui-deploy-verification-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Apply internal web workspace patch
        run: python3 tools/fa3_gui_internal_web_reconcile.py
      - name: Commit reconciled source
        run: |
          git config user.name "fa3-gui-reconcile"
          git config user.email "fa3-gui-reconcile@users.noreply.github.com"
          git add -A
          git commit -m "FA3 GUI: embed isolated Web Workspace and block external browser launches"
          git push origin HEAD:fa3-gui-deploy-verification-v1
