name: TEMP CFA3 donor backfill-count reconcile
on:
  push:
    branches:
      - cfa3/donor-agentscope-embabel-batch-finalizer-20261006
    paths:
      - .github/workflows/cfa3-donor-backfill-count-temp.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_MAIN: c2e2ab2aa1c34ef555e2324e9b67af9d8723f76a
      EXPECTED_REGISTRY_BLOB: f09d9fa51d359df2ff7b67c192926562044c5365
      TARGET_BRANCH: cfa3/donor-agentscope-embabel-batch-finalizer-20261006
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cfa3/donor-agentscope-embabel-batch-finalizer-20261006
          fetch-depth: 0
      - name: Exact-state preflight
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git hash-object canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json)" = "$EXPECTED_REGISTRY_BLOB"
      - name: Reconcile derived backfill count
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert len(d["entries"]) == 1835, len(d["entries"])
          assert d["backfill"]["entry_count"] == 1824, d["backfill"]["entry_count"]
          d["backfill"]["entry_count"] = len(d["entries"])
          p.write_text(json.dumps(d,separators=(",",":"))+"\n",encoding="utf-8")
          PY
          test "$(python3 - <<'PY'
          import json
          d=json.load(open("canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json"))
          print(d["backfill"]["entry_count"])
          PY
          )" = "1835"
      - name: Commit derived count reconciliation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json
          git diff --cached --quiet && { echo "No change"; exit 2; }
          git commit -m "fix(donors): reconcile registry backfill count"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
