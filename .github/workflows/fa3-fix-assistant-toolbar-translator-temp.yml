name: FA3 temporary assistant-toolbar translator repair

on:
  push:
    branches:
      - fa3-gui-fix-assistant-toolbar-translator

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa3-gui-fix-assistant-toolbar-translator
          fetch-depth: 0
          persist-credentials: true
      - name: Patch visible translator and responsive assistant toolbar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/fa3-control-center/qml/Main.qml')
          text = path.read_text(encoding='utf-8')

          # 1) Stable navigation entry point for the translator.
          marker = '''    function closeTransientWorkspaces() {\n        webWorkspaceOpen = false\n        chatWorkspaceOpen = false\n    }\n'''
          replacement = marker + '''\n    function openLanguageControl() {\n        closeTransientWorkspaces()\n        selectedIndex = 23\n        if (languageDrawer.opened) languageDrawer.close()\n    }\n'''
          if 'function openLanguageControl()' not in text:
              if marker not in text:
                  raise SystemExit('closeTransientWorkspaces marker not found')
              text = text.replace(marker, replacement, 1)

          # 2) Search index and sidebar navigation must expose the translator explicitly.
          idx_marker = '        {title: "Token Control Center", detail: "Credential és AI token governance, budget, audit és költség", category: "FUNCTION", pageIndex: 22},\n'
          if '{title: "Tolmács"' not in text:
              if idx_marker not in text:
                  raise SystemExit('uiSearchIndex marker not found')
              text = text.replace(idx_marker, idx_marker + '        {title: "Tolmács", detail: "Nyelvi híd ember, FA3 és AI modellek között", category: "FUNCTION", pageIndex: 23},\n', 1)

          nav_marker = '                        NavButton { iconText: "⌕"; label: "Keresés"; pageIndex: 7 }\n'
          if 'label: "Tolmács"; pageIndex: 23' not in text:
              if nav_marker not in text:
                  raise SystemExit('sidebar search marker not found')
              text = text.replace(nav_marker, nav_marker + '                        NavButton { iconText: "文"; label: "Tolmács"; pageIndex: 23 }\n', 1)

          # 3) Shortcut opens the stable full-page surface, not an overlay-only path.
          text = text.replace('Shortcut { sequence: "Ctrl+Shift+L"; context: Qt.ApplicationShortcut; onActivated: languageDrawer.open() }',
                              'Shortcut { sequence: "Ctrl+Shift+L"; context: Qt.ApplicationShortcut; onActivated: window.openLanguageControl() }')

          # 4) Replace the overloaded one-row top header with a two-row responsive assistant toolbar.
          start = text.find('            Rectangle {\n                Layout.fillWidth: true\n                Layout.preferredHeight: 64\n                color: "#081421"')
          end = text.find('            StackLayout {\n', start)
          if start < 0 or end < 0:
              raise SystemExit('top toolbar block not found')

          header = '''            Rectangle {\n                id: assistantToolbar\n                Layout.fillWidth: true\n                Layout.preferredHeight: 104\n                color: "#081421"\n                border.color: window.borderSoft\n\n                ColumnLayout {\n                    anchors.fill: parent\n                    spacing: 0\n\n                    Item {\n                        Layout.fillWidth: true\n                        Layout.preferredHeight: 42\n                        RowLayout {\n                            anchors.fill: parent\n                            anchors.leftMargin: 14\n                            anchors.rightMargin: 14\n                            spacing: 10\n\n                            ColumnLayout {\n                                spacing: 0\n                                Label { text: "Current Environment"; color: window.textMuted; font.pixelSize: 8 }\n                                RowLayout {\n                                    spacing: 7\n                                    Rectangle { width: 7; height: 7; radius: 4; color: window.green }\n                                    Label { text: "LOCAL / FA3"; color: window.textPrimary; font.pixelSize: 10; font.bold: true }\n                                }\n                            }\n\n                            Item { Layout.fillWidth: true }\n                            Label { text: "CANONICAL"; color: window.accent; font.pixelSize: 9; font.bold: true }\n                            Rectangle { width: 1; height: 22; color: window.border }\n                            Label { text: fa3Repository.canonicalRecordCount + " records"; color: window.textMuted; font.pixelSize: 9 }\n                            ToolButton {\n                                implicitWidth: 30\n                                implicitHeight: 30\n                                text: "↻"\n                                ToolTip.visible: hovered\n                                ToolTip.text: "FA3 állapot frissítése"\n                                onClicked: { fa3Repository.refresh(); fa3Journal.refresh() }\n                            }\n                        }\n                    }\n\n                    Rectangle { Layout.fillWidth: true; Layout.preferredHeight: 1; color: window.borderSoft }\n\n                    Item {\n                        Layout.fillWidth: true\n                        Layout.fillHeight: true\n                        RowLayout {\n                            anchors.fill: parent\n                            anchors.leftMargin: 14\n                            anchors.rightMargin: 14\n                            spacing: 8\n\n                            Label {\n                                text: "ASSZISZTENS"\n                                color: window.textMuted\n                                font.pixelSize: 8\n                                font.bold: true\n                                Layout.preferredWidth: 72\n                            }\n                            Rectangle { width: 1; height: 26; color: window.border }\n\n                            ToolButton {\n                                id: askButton\n                                Layout.minimumWidth: 180\n                                Layout.preferredWidth: 210\n                                Layout.preferredHeight: 32\n                                text: "Kérdezd: " + window.askRole + " ▾"\n                                onClicked: askMenu.open()\n                                contentItem: Label {\n                                    text: parent.text\n                                    color: window.textPrimary\n                                    font.pixelSize: 9\n                                    font.bold: true\n                                    horizontalAlignment: Text.AlignHCenter\n                                    verticalAlignment: Text.AlignVCenter\n                                    elide: Text.ElideRight\n                                }\n                                background: Rectangle {\n                                    radius: 6\n                                    color: parent.hovered ? "#132a42" : "#0d1c2f"\n                                    border.color: window.border\n                                }\n                                Menu {\n                                    id: askMenu\n                                    y: parent.height\n                                    MenuItem { text: "Mentor"; onTriggered: window.openRoleChat("Mentor") }\n                                    MenuItem { text: "Coach"; onTriggered: window.openRoleChat("Coach") }\n                                    MenuItem { text: "Manager"; onTriggered: window.openRoleChat("Manager") }\n                                    MenuItem { text: "Ellenőr"; onTriggered: window.openRoleChat("Ellenőr") }\n                                    MenuItem { text: "Ötletelő"; onTriggered: window.openRoleChat("Ötletelő") }\n                                    MenuItem { text: "Tanácsadó"; onTriggered: window.openRoleChat("Tanácsadó") }\n                                }\n                            }\n\n                            ToolButton {\n                                id: languageButton\n                                Layout.minimumWidth: 118\n                                Layout.preferredWidth: 126\n                                Layout.preferredHeight: 32\n                                text: "文/A  Tolmács"\n                                onClicked: window.openLanguageControl()\n                                ToolTip.visible: hovered\n                                ToolTip.text: "Tolmács / Nyelvi híd · Ctrl+Shift+L"\n                                Accessible.name: "Tolmács / Nyelvi híd"\n                                contentItem: Label {\n                                    text: parent.text\n                                    color: window.textPrimary\n                                    font.pixelSize: 9\n                                    font.bold: true\n                                    horizontalAlignment: Text.AlignHCenter\n                                    verticalAlignment: Text.AlignVCenter\n                                }\n                                background: Rectangle {\n                                    radius: 6\n                                    color: parent.hovered ? "#132a42" : "#0d1c2f"\n                                    border.color: window.accent\n                                }\n                            }\n\n                            Item { Layout.fillWidth: true }\n                            QuickLink { linkText: "Hugging Face"; targetUrl: "https://huggingface.co/" }\n                            QuickLink { linkText: "CivitAI"; targetUrl: "https://civitai.com/" }\n                            QuickLink { linkText: "OpenModelDB"; targetUrl: "https://openmodeldb.info/" }\n                        }\n                    }\n                }\n            }\n\n'''
          text = text[:start] + header + text[end:]

          # 5) A permanent, normal StackLayout page makes the translator impossible to hide by toolbar compression.
          token_block = '''                TokenControlCenterPage {\n                    panel: window.panel\n                    panelRaised: window.panelRaised\n                    border: window.border\n                    textPrimary: window.textPrimary\n                    textMuted: window.textMuted\n                    accent: window.accent\n                    green: window.green\n                    orange: window.orange\n                    magenta: window.magenta\n                }\n'''
          language_page = '''\n                LanguageControlPage {\n                    preferences: fa3Preferences\n                    panel: window.panel\n                    panelRaised: window.panelRaised\n                    border: window.border\n                    textPrimary: window.textPrimary\n                    textMuted: window.textMuted\n                    accent: window.accent\n                    green: window.green\n                    orange: window.orange\n                }\n'''
          if 'pageIndex: 23' in text and text.count('LanguageControlPage {') < 2:
              if token_block not in text:
                  raise SystemExit('TokenControlCenterPage block not found')
              text = text.replace(token_block, token_block + language_page, 1)

          path.write_text(text, encoding='utf-8')

          # GUI regression: visible translator + stable assistant toolbar layout.
          tpath = Path('tests/test_fa3_gui_gate.py')
          tests = tpath.read_text(encoding='utf-8')
          anchor = '\n\nif __name__ == "__main__":\n'
          method = '''\n    def test_translator_is_permanent_and_assistant_toolbar_is_responsive(self):\n        main = (ROOT / "apps/fa3-control-center/qml/Main.qml").read_text(encoding="utf-8")\n        self.assertIn('id: assistantToolbar', main)\n        self.assertIn('Layout.preferredHeight: 104', main)\n        self.assertIn('text: "ASSZISZTENS"', main)\n        self.assertIn('Layout.minimumWidth: 180', main)\n        self.assertIn('text: "文/A  Tolmács"', main)\n        self.assertIn('Layout.minimumWidth: 118', main)\n        self.assertIn('function openLanguageControl()', main)\n        self.assertIn('label: "Tolmács"; pageIndex: 23', main)\n        self.assertGreaterEqual(main.count('LanguageControlPage {'), 2)\n        self.assertIn('onActivated: window.openLanguageControl()', main)\n        self.assertIn('onClicked: window.openLanguageControl()', main)\n'''
          if 'test_translator_is_permanent_and_assistant_toolbar_is_responsive' not in tests:
              if anchor not in tests:
                  raise SystemExit('test anchor not found')
              tests = tests.replace(anchor, method + anchor, 1)
              tpath.write_text(tests, encoding='utf-8')
          PY

          temp_workflow=".github/workflows/fa3-fix-assistant-toolbar-translator-temp.yml"
          saved="/tmp/fa3-fix-assistant-toolbar-translator-temp.yml"
          mv "$temp_workflow" "$saved"
          python src/fa3_release_projection_regenerate.py
          mv "$saved" "$temp_workflow"

          git config user.name "fa3-assistant-toolbar-repair"
          git config user.email "fa3-assistant-toolbar-repair@users.noreply.github.com"
          git add apps/fa3-control-center/qml/Main.qml tests/test_fa3_gui_gate.py canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          if git diff --cached --quiet; then
            echo "No patch required"
            exit 0
          fi
          git commit -m "FA3 GUI: repair assistant toolbar and restore visible translator"
          git push origin HEAD:fa3-gui-fix-assistant-toolbar-translator
