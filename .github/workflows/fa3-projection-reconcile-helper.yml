name: FA3 One-Shot Projection Reconcile Helper

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fa3-projection-reconcile-helper.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove helper and create final pre-projection snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'fa3-projection-bot'
          git config user.email 'fa3-projection-bot@users.noreply.github.com'
          git rm .github/workflows/fa3-projection-reconcile-helper.yml
          git commit -m 'chore: remove one-shot projection helper'
          snapshot="$(git rev-parse HEAD)"
          PYTHONPATH=src python src/fa3_release_projection_regenerate.py --root . --snapshot-head "$snapshot"
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git commit -m 'chore: reconcile unified release projection for HRB locality fabric'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
