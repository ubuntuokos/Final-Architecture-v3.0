name: FA3 Khronos Open Standards Gate
on:
  pull_request:
    paths:
      - 'canonical/**KHRONOS**'
      - 'canonical/**/FA3-KHRONOS-*'
      - 'src/fa3_khronos_*'
      - 'bin/fa3-materialize-khronos-sdks.sh'
      - 'evidence/collect-khronos-sdk-materialization-current-host.py'
      - 'tests/test_khronos_open_standards_gate.py'
      - 'docs/FA3-KHRONOS-*'
      - 'canonical/FA3-GATE-REGISTRY-001.json'
      - 'canonical/enforcement-policy.json'
      - 'canonical/distribution-registry.json'
      - 'canonical/distribution-manifest.json'
      - 'canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json'
  workflow_dispatch:
jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: PYTHONPATH=src python3 src/fa3_khronos_open_standards_gate.py --root . --json
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_khronos_open_standards_gate.py' -v
      - run: PYTHONPATH=src python3 src/fa3_enforce.py --root . gate-registry
      - run: PYTHONPATH=src python3 src/fa3_distribution_compliance_gate.py --root .
