name: FA3 Khronos Open Standards Gate
on:
  pull_request:
    paths:
      - 'canonical/profiles/FA3-KHRONOS-OPEN-STANDARDS-001.json'
      - 'canonical/contracts/FA3-KHRONOS-OPEN-STANDARDS-CONTRACTS-001.json'
      - 'canonical/materialization/FA3-KHRONOS-SDK-MATERIALIZATION-001.json'
      - 'canonical/intents/FA3-KHRONOS-OPEN-STANDARDS-APPLICATION-INTENT-001.json'
      - 'canonical/assessments/FA3-KHRONOS-OPEN-STANDARDS-REUSE-ASSESSMENT-001.json'
      - 'canonical/FA3-GATE-KHRONOS-OPEN-STANDARDS-001.json'
      - 'src/fa3_khronos_open_standards_gate.py'
      - 'tests/test_khronos_open_standards_gate.py'
      - 'bin/fa3-materialize-khronos-sdks.sh'
      - 'docs/FA3-KHRONOS-OPEN-STANDARDS-MATERIALIZATION-2026-09-26.md'
  workflow_dispatch:
jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Khronos canonical gate
        run: PYTHONPATH=src python3 src/fa3_khronos_open_standards_gate.py --json
      - name: Khronos regression
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_khronos_open_standards_gate.py'
