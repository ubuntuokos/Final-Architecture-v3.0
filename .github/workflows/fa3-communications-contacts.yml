name: FA3 Communications & Contacts Shared

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/profiles/FA3-COMMUNICATIONS-CONTACTS-SHARED-001.json'
      - 'canonical/contracts/FA3-COMMUNICATIONS-CONTACTS-SHARED-CONTRACTS-001.json'
      - 'canonical/intents/FA3-COMMUNICATIONS-CONTACTS-SHARED-APPLICATION-INTENT-001.json'
      - 'canonical/assessments/FA3-COMMUNICATIONS-CONTACTS-SHARED-REUSE-ASSESSMENT-001.json'
      - 'canonical/decisions/FA3-DEC-COMMUNICATIONS-CONTACTS-SHARED-2026-09-30.json'
      - 'canonical/communications-contacts-current-host-enforcement.json'
      - 'canonical/FA3-GATE-COMMUNICATIONS-CONTACTS-CURRENT-HOST-001.json'
      - 'src/fa3_communications_contacts.py'
      - 'src/fa3_communications_contacts_gate.py'
      - 'src/fa3_communications_contacts_current_host_gate.py'
      - 'tests/test_communications_contacts.py'
      - 'apps/fa3-communications-hub/**'
      - 'canonical/FA3-APPLICATION-DONOR-LINKS-001.json'
      - 'canonical/FA3-GATE-REGISTRY-001.json'
      - 'canonical/enforcement-policy.json'
      - 'src/fa3_enforce.py'
      - '.github/workflows/fa3-communications-contacts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  communications-contacts:
    name: communications-contacts / P0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile src/fa3_communications_contacts.py src/fa3_communications_contacts_gate.py src/fa3_communications_contacts_current_host_gate.py tests/test_communications_contacts.py
      - name: Authorization and security regressions
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_communications_contacts -v
      - name: Static fail-closed gate
        env:
          PYTHONPATH: src
        run: python src/fa3_communications_contacts_gate.py
      - name: Gate registry mirror
        env:
          PYTHONPATH: src
        run: python src/fa3_gate_registry.py
