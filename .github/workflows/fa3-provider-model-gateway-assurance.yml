name: FA3 Provider Model Gateway Assurance
on:
  pull_request:
    paths:
      - "canonical/profiles/FA3-PROVIDER-MODEL-GATEWAY-ASSURANCE-001.json"
      - "canonical/contracts/FA3-PROVIDER-MODEL-GATEWAY-ASSURANCE-CONTRACTS-001.json"
      - "canonical/decisions/FA3-DEC-PROVIDER-MODEL-GATEWAY-ASSURANCE-2026-09-30.json"
      - "canonical/intents/FA3-PROVIDER-MODEL-GATEWAY-ASSURANCE-APPLICATION-INTENT-001.json"
      - "canonical/assessments/FA3-PROVIDER-MODEL-GATEWAY-ASSURANCE-*.json"
      - "src/fa3_provider_model_gateway_assurance_gate.py"
      - "tests/test_provider_model_gateway_assurance.py"
      - ".github/workflows/fa3-provider-model-gateway-assurance.yml"
  push:
    branches: [main]
    paths:
      - "canonical/profiles/FA3-PROVIDER-MODEL-GATEWAY-ASSURANCE-001.json"
      - "canonical/contracts/FA3-PROVIDER-MODEL-GATEWAY-ASSURANCE-CONTRACTS-001.json"
      - "src/fa3_provider_model_gateway_assurance_gate.py"
      - "tests/test_provider_model_gateway_assurance.py"
  workflow_dispatch:
jobs:
  assurance-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax
        run: python3 -m py_compile src/fa3_provider_model_gateway_assurance_gate.py
      - name: Assurance gate
        run: PYTHONPATH=src python3 src/fa3_provider_model_gateway_assurance_gate.py
      - name: Regression
        run: PYTHONPATH=src python3 -m unittest tests.test_provider_model_gateway_assurance -v
