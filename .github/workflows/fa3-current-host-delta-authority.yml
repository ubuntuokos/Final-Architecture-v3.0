name: FA3 Current Host Delta Authority

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fa3-current-host-delta-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  current-host-delta-authority:
    name: current-host-delta-authority / static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Delta authority unit tests
        run: PYTHONPATH=src python -m unittest tests.test_current_host_delta_authority -v
      - name: Compile delta authority
        run: python -m py_compile src/fa3_current_host_delta_authority.py
      - name: Static-only boundary
        run: |
          echo "Hosted CI validates planning/verifier logic only."
          echo "It MUST NOT emit a physical Current Host PASS."
