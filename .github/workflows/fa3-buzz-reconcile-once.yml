name: FA3 Release Projection Regeneration (temporary)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-projection:
    name: regenerate unified release projection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate deterministic projection
        shell: bash
        run: |
          set -euo pipefail
          snapshot_head="$(git rev-parse HEAD)"
          PYTHONPATH=src python tools/fa3_buzz_global_reconcile.py \
            --projection-only \
            --snapshot-head "$snapshot_head"
          PYTHONPATH=src python src/fa3_release_projection_gate.py
          git diff --check
          changed="$(git status --short | awk '{print $2}')"
          test "$changed" = "canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json"
      - name: Commit regenerated projection to PR branch
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git commit -m 'chore: regenerate unified release projection'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
      - name: Upload regenerated projection
        uses: actions/upload-artifact@v4
        with:
          name: fa3-regenerated-release-projection
          if-no-files-found: error
          path: canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
