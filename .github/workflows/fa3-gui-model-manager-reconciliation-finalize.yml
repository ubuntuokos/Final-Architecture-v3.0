name: FA3 GUI Model Manager Reconciliation Finalize

on:
  push:
    branches:
      - reconcile/gui-model-manager-2026-09-17
    paths:
      - .github/workflows/fa3-gui-model-manager-reconciliation-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile projection for validation tree
        run: python scripts/fa3_reconcile_release_projection.py --root .

      - name: Focused semantic reconciliation regressions
        shell: bash
        run: |
          chmod +x bin/fa3-enforce bin/fa3-convertx-gate bin/fa3-language-gateway-current-host.sh || true
          PYTHONPATH=src python -m unittest \
            tests.test_gui_model_manager_reconciliation_2026_09_17 \
            tests.test_openmodeldb_browser_download_manager \
            tests.test_model_manager_llmfit_gui_gate \
            tests.test_remote_ai_exec_gate \
            tests.test_canonical_language_gate \
            tests.test_language_bridge \
            tests.test_language_gateway_gate \
            tests.test_convertx_gate \
            tests.test_convertx_v018_http \
            tests.test_tools_fabric \
            tests.test_fa3_dev_update -v
          PYTHONPATH=src python src/fa3_remote_ai_exec_gate.py
          PYTHONPATH=src python src/fa3_model_manager_llmfit_gui_gate.py
          PYTHONPATH=src python src/fa3_language_gateway_gate.py --root .
          PYTHONPATH=src python src/fa3_dev_update_gate.py
          ./bin/fa3-convertx-gate

      - name: GUI canonical and unit gates
        shell: bash
        run: |
          PYTHONPATH=. python src/fa3_gui_gate.py
          PYTHONPATH=. python -m unittest tests.test_fa3_gui_gate -v

      - name: Unified release and global static gates
        shell: bash
        run: |
          ./bin/fa3-enforce release-projection
          ./bin/fa3-enforce static

      - name: Install Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-declarative-dev qt6-webengine-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs qml6-module-qtwebengine \
            qml6-module-qtquick-layouts qml6-module-qtqml-workerscript

      - name: Qt reference configure and build
        shell: bash
        run: |
          cmake -S apps/fa3-control-center -B build/fa3-control-center -GNinja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/fa3-control-center --parallel

      - name: Remove one-shot reconciliation scaffolding and reconcile final projection
        shell: bash
        run: |
          rm -f \
            tools/fa3_gui_model_manager_reconcile_2026_09_17.py \
            .github/workflows/fa3-gui-model-manager-reconciliation-builder.yml \
            .github/workflows/fa3-gui-model-manager-reconciliation-validate.yml \
            .github/workflows/fa3-gui-model-manager-reconciliation-finalize.yml
          python scripts/fa3_reconcile_release_projection.py --root .

      - name: Commit clean hosted-validated reconciliation head
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization delta."
          else
            git commit -m "FA3: finalize hosted GUI and Model Manager reconciliation [static-pass]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
