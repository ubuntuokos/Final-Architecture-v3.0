name: FA3 PR Watch Functional and Safety Gate
on:
  pull_request:
    branches: [main]
    paths:
      - "src/fa3_pr_watch.py"
      - "src/fa3_pr_watch_service_render.py"
      - "bin/fa3-pr-watch-render-service"
      - "tests/test_pr_watch_service_render.py"
      - "src/fa3_pr_watch_operator_export.py"
      - "tests/test_pr_watch_operator_export.py"
      - "src/fa3_pr_watch_workload_bridge.py"
      - "tests/test_pr_watch_workload_bridge.py"
      - "src/fa3_pr_watch_secret_runtime.py"
      - "src/fa3_pr_watch_reference_e2e.py"
      - "src/fa3_pr_watch_reference_checker.py"
      - "bin/fa3-pr-watch-secret-runtime"
      - "bin/fa3-pr-watch-e2e-fixture"
      - "tests/test_pr_watch_secret_runtime.py"
      - "tests/test_pr_watch_reference_e2e.py"
      - "deployment/pr-watch/**"
      - "src/fa3_pr_watch_receiver.py"
      - "bin/fa3-pr-watch-receiver"
      - "tests/test_pr_watch_receiver.py"
      - "tests/test_pr_watch_goal_bridge.py"
      - "bin/fa3-pr-watch"
      - "tests/test_pr_watch.py"
      - "apps/fa3-control-center/src/PrWatchService.*"
      - "apps/fa3-control-center/qml/WorkManagementPage.qml"
      - "apps/fa3-control-center/qml/Main.qml"
      - "apps/fa3-control-center/src/main.cpp"
      - "apps/fa3-control-center/CMakeLists.txt"
      - "canonical/contracts/FA3-GITHUB-DEVELOPMENT-INTEGRATION-CONTRACTS-001.json"
      - "docs/pr-watch-implementation.md"
      - ".github/workflows/fa3-pr-watch.yml"
  push:
    branches: [main]
    paths:
      - "src/fa3_pr_watch.py"
      - "src/fa3_pr_watch_service_render.py"
      - "bin/fa3-pr-watch-render-service"
      - "tests/test_pr_watch_service_render.py"
      - "src/fa3_pr_watch_operator_export.py"
      - "tests/test_pr_watch_operator_export.py"
      - "src/fa3_pr_watch_workload_bridge.py"
      - "tests/test_pr_watch_workload_bridge.py"
      - "src/fa3_pr_watch_secret_runtime.py"
      - "src/fa3_pr_watch_reference_e2e.py"
      - "src/fa3_pr_watch_reference_checker.py"
      - "bin/fa3-pr-watch-secret-runtime"
      - "bin/fa3-pr-watch-e2e-fixture"
      - "tests/test_pr_watch_secret_runtime.py"
      - "tests/test_pr_watch_reference_e2e.py"
      - "deployment/pr-watch/**"
      - "src/fa3_pr_watch_receiver.py"
      - "bin/fa3-pr-watch-receiver"
      - "tests/test_pr_watch_receiver.py"
      - "tests/test_pr_watch_goal_bridge.py"
      - "bin/fa3-pr-watch"
      - "tests/test_pr_watch.py"
      - "apps/fa3-control-center/src/PrWatchService.*"
      - "apps/fa3-control-center/qml/WorkManagementPage.qml"
      - "apps/fa3-control-center/qml/Main.qml"
      - "apps/fa3-control-center/src/main.cpp"
      - "apps/fa3-control-center/CMakeLists.txt"
      - "canonical/contracts/FA3-GITHUB-DEVELOPMENT-INTEGRATION-CONTRACTS-001.json"
      - ".github/workflows/fa3-pr-watch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-watch-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strict source syntax
        run: python -m py_compile src/fa3_pr_watch_service_render.py bin/fa3-pr-watch-render-service tests/test_pr_watch_service_render.py src/fa3_pr_watch_operator_export.py tests/test_pr_watch_operator_export.py src/fa3_pr_watch_secret_runtime.py src/fa3_pr_watch_reference_e2e.py src/fa3_pr_watch_reference_checker.py bin/fa3-pr-watch-secret-runtime bin/fa3-pr-watch-e2e-fixture tests/test_pr_watch_secret_runtime.py tests/test_pr_watch_reference_e2e.py src/fa3_pr_watch_workload_bridge.py tests/test_pr_watch_workload_bridge.py src/fa3_pr_watch.py src/fa3_pr_watch_receiver.py bin/fa3-pr-watch bin/fa3-pr-watch-receiver tests/test_pr_watch.py tests/test_pr_watch_receiver.py tests/test_pr_watch_goal_bridge.py
      - name: Real signed-payload and negative regression suite
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_pr_watch.py -v
          python -m unittest discover -s tests -p test_pr_watch_receiver.py -v
          python -m unittest discover -s tests -p test_pr_watch_goal_bridge.py -v
          python -m unittest discover -s tests -p test_pr_watch_secret_runtime.py -v
          python -m unittest discover -s tests -p test_pr_watch_reference_e2e.py -v
          python -m unittest discover -s tests -p test_pr_watch_workload_bridge.py -v
          python -m unittest discover -s tests -p test_pr_watch_operator_export.py -v
          python -m unittest discover -s tests -p test_pr_watch_service_render.py -v
      - name: Real signed-event to isolated workers to independent fixture verifier
        env:
          PYTHONPATH: src
        run: python bin/fa3-pr-watch-e2e-fixture --fixture-only --output reports/pr-watch-fixture-e2e.json
      - name: Upload non-production reference flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-pr-watch-reference-e2e
          path: reports/pr-watch-fixture-e2e.json
          if-no-files-found: warn
      - name: Existing work-management and goal-contract regressions
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_work_management_gate.py -v
          python -m unittest discover -s tests -p test_goal_execution_foundation.py -v
      - name: PR Watch boundaries and no runtime promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path("canonical/contracts/FA3-GITHUB-DEVELOPMENT-INTEGRATION-CONTRACTS-001.json").read_text())
          assert c["authority"] is False and c["new_capabilities"] == 0
          assert c["runtime_activation"] == "DISABLED_UNTIL_SEPARATE_ADMISSION"
          assert c["direct_model_and_tool_bypass"] is False
          assert c["github_ingress"]["signed_hmac_sha256_required"] is True
          assert c["evidence"]["self_certification_allowed"] is False
          assert c["hardware_audit"]["cpu_only_viable"] is True
          assert "PR Watch" in Path("apps/fa3-control-center/qml/WorkManagementPage.qml").read_text()
          PY
