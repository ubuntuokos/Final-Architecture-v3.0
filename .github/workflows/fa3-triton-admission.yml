name: FA3 Triton Admission

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fa3-triton-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  triton-admission:
    name: triton-admission / P0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile src/fa3_triton_gate.py tests/test_triton_gate.py
      - name: Triton regression tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_triton_gate.py' -v
      - name: Triton executable gate
        run: |
          chmod +x bin/fa3-triton-gate
          ./bin/fa3-triton-gate
      - name: Upload Triton static admission report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-triton-admission-report
          path: reports/triton-gate-report.json
