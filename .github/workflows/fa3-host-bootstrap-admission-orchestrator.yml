name: FA3 Host Bootstrap Admission Orchestrator

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/FA3-HOST-BOOTSTRAP-ADMISSION-ORCHESTRATOR-001.json'
      - 'canonical/decisions/FA3-DEC-HOST-BOOTSTRAP-ADMISSION-ORCHESTRATOR-2026-09-15.json'
      - 'src/fa3_host_bootstrap_admission_orchestrator.py'
      - 'libexec/fa3-host-resource-broker-acquire-root.py'
      - 'libexec/fa3-host-resource-broker-acquire.py'
      - 'libexec/fa3-host-resource-broker-admission-root.py'
      - 'libexec/fa3-host-resource-broker-admission.py'
      - 'bin/fa3-host-admission'
      - 'bin/fa3-install-hrb-acquire-bridge.sh'
      - 'bin/fa3-install-hrb-admission-bridge.sh'
      - 'bin/fa3-install-host-admission-bridge.sh'
      - 'bin/fa3-current-host-runner-bootstrap.sh'
      - 'bin/fa3-current-host-runner-doctor'
      - 'tests/test_host_bootstrap_admission_orchestrator.py'
      - 'tests/test_hrb_acquire_bridge.py'
      - 'tests/test_hrb_admission_bridge.py'
      - 'fa3-current-host/HOST-ADMISSION-ORCHESTRATOR.md'
      - 'fa3-current-host/manifest.json'
      - '.github/workflows/fa3-host-bootstrap-admission-orchestrator.yml'
  workflow_dispatch:
    inputs:
      execute_current_host:
        description: 'Run real current-host host-admission smoke on the labeled self-hosted runner'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  contract-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          python -m py_compile \
            src/fa3_host_bootstrap_admission_orchestrator.py \
            libexec/fa3-host-resource-broker-acquire-root.py \
            libexec/fa3-host-resource-broker-acquire.py \
            libexec/fa3-host-resource-broker-admission-root.py \
            libexec/fa3-host-resource-broker-admission.py
          bash -n \
            bin/fa3-host-admission \
            bin/fa3-install-hrb-acquire-bridge.sh \
            bin/fa3-install-hrb-admission-bridge.sh \
            bin/fa3-install-host-admission-bridge.sh \
            bin/fa3-current-host-runner-bootstrap.sh \
            bin/fa3-current-host-runner-doctor
      - name: Orchestrator and privilege-boundary regressions
        run: >-
          PYTHONPATH=src python -m unittest
          tests.test_host_bootstrap_admission_orchestrator
          tests.test_hrb_acquire_bridge
          tests.test_hrb_admission_bridge -v
      - name: Canonical authority invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('canonical/FA3-HOST-BOOTSTRAP-ADMISSION-ORCHESTRATOR-001.json').read_text())
          assert p['capability_delta'] == 0
          assert p['authority_delta'] == 0
          assert p['fail_closed'] is True
          assert p['authority']['resource_admission'] == 'FA3-AUTH-HOST-RESOURCE-BROKER-001'
          assert p['authority']['orchestrator_is_authority'] is False
          assert p['authority']['admission_authorization_signing'] == 'FORBIDDEN'
          assert p['runtime_invariants']['cpu_only_viable'] is True
          assert p['runtime_invariants']['cpu_only_requires_accelerator_discovery'] is False
          assert p['runtime_invariants']['cu_tu_admission_authority'] == 'FORBIDDEN'
          assert p['runtime_invariants']['raw_hmac_key_access_by_user_or_runner'] == 'FORBIDDEN'
          assert 'GLOBAL_FA3_PROMOTION' in p['non_claims']
          PY
      - name: Unified current-host projection stays coherent
        run: ./bin/fa3-current-host verify
      - name: Unified release projection stays coherent
        run: ./bin/fa3-enforce release-projection

  production-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_current_host }}
    needs: contract-regression
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify root-separated bridges
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/bin/fa3-host-resource-broker-validator
          test -x /usr/local/bin/fa3-host-resource-broker-acquire
          test -x /usr/local/bin/fa3-host-resource-broker-admission
          test -x /usr/local/libexec/fa3-host-resource-broker-validate-root
          test -x /usr/local/libexec/fa3-host-resource-broker-acquire-root
          test -x /usr/local/libexec/fa3-host-resource-broker-admission-root
          sudo -n -l /usr/local/libexec/fa3-host-resource-broker-validate-root /dev/null >/dev/null
          sudo -n -l /usr/local/libexec/fa3-host-resource-broker-acquire-root /dev/null >/dev/null
          /usr/local/bin/fa3-host-resource-broker-admission --doctor
      - name: Host admission doctor
        run: ./bin/fa3-host-admission doctor
      - name: Real current-host admission smoke with automatic HRB authorization
        run: ./bin/fa3-host-admission smoke
      - name: Re-validate canonical scoped receipt
        run: ./bin/fa3-enforce resource-admission-current-host
      - name: Upload scoped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-host-bootstrap-admission-orchestrator
          if-no-files-found: warn
          path: |
            evidence/receipts/resource-admission-current-host.json
            reports/host-bootstrap-admission-orchestrator-report.json
            reports/resource-admission-smoke-bootstrap-report.json
            reports/resource-admission-current-host-gate-report.json
            .fa3-current-host/input/resource-smoke-workload-envelope.json
