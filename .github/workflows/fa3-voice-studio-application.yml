name: FA3 Voice Studio Full Application
on:
  pull_request:
    paths:
      - 'canonical/FA3-VOICE-STUDIO-APPLICATION-001.json'
      - 'canonical/FA3-VOICE-STUDIO-RUNTIME-CONFORMANCE-001.json'
      - 'src/fa3_voice_workspace.py'
      - 'src/fa3_voice_studio_server.py'
      - 'src/fa3_piper_provider.py'
      - 'src/fa3_model_router_voice.py'
      - 'src/fa3_voice_studio_gate.py'
      - 'apps/fa3-control-center/src/VoiceWorkspaceService.*'
      - 'apps/fa3-control-center/qml/VoiceStudioPage.qml'
      - 'apps/fa3-control-center/qml/QuickVoicePluginPage.qml'
      - 'tests/test_voice_workspace.py'
      - 'tests/test_voice_studio_application.py'
      - 'tests/test_voice_studio_current_host.py'
      - 'src/fa3_voice_studio_current_host_gate.py src/fa3_model_router_voice.py'
      - 'canonical/current-host-impact/FA3-CH-IMPACT-VOICE-STUDIO-FULL-APPLICATION-20261004.json'
  push:
    branches: ['main','fa3/**']
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: PYTHONPATH=src python -m unittest tests.test_voice_workspace tests.test_voice_studio_application tests.test_voice_studio_current_host -v
      - run: PYTHONPATH=src python src/fa3_voice_studio_gate.py --root .
      - run: PYTHONPATH=src python src/fa3_voice_studio_current_host_gate.py --root .
      - run: python -m py_compile src/fa3_voice_workspace.py src/fa3_voice_studio_server.py src/fa3_piper_provider.py src/fa3_voice_studio_gate.py src/fa3_voice_studio_current_host_gate.py
