name: FA3 External Discovery Reconciliation

on:
  pull_request:
    branches:
      - main
      - "fa3/**"
    paths:
      - "canonical/FA3-EXTERNAL-DISCOVERY-RECONCILIATION-001.json"
      - "canonical/FA3-REUSE-CATALOG-001.json"
      - "canonical/external-api-discovery-enforcement.json"
      - "canonical/profiles/FA3-EXTERNAL-API-DISCOVERY-001.json"
      - "canonical/contracts/FA3-EXTERNAL-API-DISCOVERY-CONTRACTS-001.json"
      - "canonical/decisions/FA3-DEC-EXTERNAL-DISCOVERY-REUSE-RECONCILIATION-2026-10-02.json"
      - "canonical/intents/FA3-EXTERNAL-DISCOVERY-RECONCILIATION-APPLICATION-INTENT-2026-10-02.json"
      - "canonical/assessments/FA3-EXTERNAL-DISCOVERY-RECONCILIATION-REUSE-ASSESSMENT-2026-10-02.json"
      - "src/fa3_external_discovery_reconciler.py"
      - "src/fa3_external_discovery_reconcile_cli.py"
      - "src/fa3_external_api_discovery_gate.py"
      - "bin/fa3-external-discovery-reconcile"
      - "tests/test_external_discovery_reconciler.py"
      - "tests/test_external_api_discovery_gate.py"
      - ".github/workflows/fa3-external-discovery-reconciliation.yml"
  push:
    branches:
      - "fa3/**"
    paths:
      - "canonical/FA3-EXTERNAL-DISCOVERY-RECONCILIATION-001.json"
      - "canonical/FA3-REUSE-CATALOG-001.json"
      - "canonical/external-api-discovery-enforcement.json"
      - "canonical/profiles/FA3-EXTERNAL-API-DISCOVERY-001.json"
      - "canonical/contracts/FA3-EXTERNAL-API-DISCOVERY-CONTRACTS-001.json"
      - "canonical/decisions/FA3-DEC-EXTERNAL-DISCOVERY-REUSE-RECONCILIATION-2026-10-02.json"
      - "canonical/intents/FA3-EXTERNAL-DISCOVERY-RECONCILIATION-APPLICATION-INTENT-2026-10-02.json"
      - "canonical/assessments/FA3-EXTERNAL-DISCOVERY-RECONCILIATION-REUSE-ASSESSMENT-2026-10-02.json"
      - "src/fa3_external_discovery_reconciler.py"
      - "src/fa3_external_discovery_reconcile_cli.py"
      - "src/fa3_external_api_discovery_gate.py"
      - "bin/fa3-external-discovery-reconcile"
      - "tests/test_external_discovery_reconciler.py"
      - "tests/test_external_api_discovery_gate.py"
      - ".github/workflows/fa3-external-discovery-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax
        run: |
          python -m py_compile \
            src/fa3_external_discovery_reconciler.py \
            src/fa3_external_discovery_reconcile_cli.py \
            src/fa3_external_api_discovery_gate.py
      - name: Reconciliation regressions
        env:
          PYTHONPATH: src
        run: |
          python -m unittest -v \
            tests.test_external_discovery_reconciler \
            tests.test_external_api_discovery_gate
      - name: Canonical donor and application inventory
        run: |
          chmod +x bin/fa3-app-donor-index
          ./bin/fa3-app-donor-index --check --summary
      - name: Reuse Discovery gate
        run: |
          chmod +x bin/fa3-enforce
          ./bin/fa3-enforce reuse-discovery
      - name: External Discovery P0 gate
        run: ./bin/fa3-enforce external-api-discovery
