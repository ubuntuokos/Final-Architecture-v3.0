name: FA3 LavaSR reconcile candidate

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/lavasr-audio-restoration]

permissions:
  contents: read

jobs:
  reconcile-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare CAP-017 evidence registry projection
        run: python tools/fa3_lavasr_global_reconcile.py --prepare-only
      - name: Detect registry commit requirement
        id: registry
        shell: bash
        run: |
          if git diff --quiet -- evidence/evidence-registry.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload prepared Evidence Registry candidate
        if: steps.registry.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lavasr-evidence-registry-candidate
          path: evidence/evidence-registry.json
      - name: Generate unified projection candidate from committed clean snapshot
        if: steps.registry.outputs.changed == 'false'
        run: python tools/fa3_lavasr_global_reconcile.py --projection-only --snapshot-head "$(git rev-parse HEAD)"
      - name: Upload unified projection candidate
        if: steps.registry.outputs.changed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: lavasr-unified-projection-candidate
          path: canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
