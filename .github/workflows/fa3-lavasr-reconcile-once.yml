name: FA3 LavaSR sync-main one-shot

on:
  push:
    branches: [feat/lavasr-audio-restoration]

permissions:
  contents: write

jobs:
  sync-and-reconcile:
    if: github.repository == 'ubuntuokos/Final-Architecture-v3.0' && github.ref == 'refs/heads/feat/lavasr-audio-restoration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lavasr-audio-restoration
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure reconciliation commit identity
        run: |
          git config user.name 'fa3-reconciliation-bot'
          git config user.email 'fa3-reconciliation-bot@users.noreply.github.com'
      - name: Merge current main with projection-safe conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            allowed='canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json'
            unexpected="$(printf '%s\n' "$conflicts" | grep -v -x "$allowed" || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$unexpected" >&2
              git merge --abort
              exit 2
            fi
            git checkout --theirs -- "$allowed"
            git add -- "$allowed"
          fi
          git commit -m 'FA3: sync LavaSR materialization with current main'
      - name: Refresh dedicated LavaSR base anchor and CAP-017 registry
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          main_sha = subprocess.check_output(['git','rev-parse','origin/main'], text=True).strip()
          p = Path('canonical/releases/FA3-RELEASE-PROJECTION-LAVASR-2026-09-09.json')
          d = json.loads(p.read_text())
          d['source_snapshot']['base_commit_sha'] = main_sha
          p.write_text(json.dumps(d, indent=2) + '\n')
          PY
          python tools/fa3_lavasr_global_reconcile.py --prepare-only
          git add canonical/releases/FA3-RELEASE-PROJECTION-LAVASR-2026-09-09.json evidence/evidence-registry.json
          if ! git diff --cached --quiet; then
            git commit -m 'FA3: re-anchor LavaSR projection and evidence registry'
          fi
      - name: Regenerate unified projection from merged clean snapshot
        run: |
          snapshot="$(git rev-parse HEAD)"
          python tools/fa3_lavasr_global_reconcile.py --projection-only --snapshot-head "$snapshot"
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git commit -m 'FA3: regenerate unified projection after LavaSR main sync'
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/fa3-lavasr-reconcile-once.yml
          git commit -m 'FA3: remove LavaSR sync-main one-shot workflow'
      - name: Push synchronized feature branch
        run: git push origin HEAD:feat/lavasr-audio-restoration
