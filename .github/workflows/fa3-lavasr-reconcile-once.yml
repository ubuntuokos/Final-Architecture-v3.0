name: FA3 LavaSR final projection repair

on:
  push:
    branches: [reconcile/lavasr-post-merge]

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'ubuntuokos/Final-Architecture-v3.0' && github.ref == 'refs/heads/reconcile/lavasr-post-merge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/lavasr-post-merge
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure reconciliation identity
        run: |
          git config user.name 'fa3-reconciliation-bot'
          git config user.email 'fa3-reconciliation-bot@users.noreply.github.com'
      - name: Verify exact main ancestry
        shell: bash
        run: |
          set -euo pipefail
          expected_main='ef4b9d62abd008007d4a19ad71495c2a02f69dab'
          git fetch origin main
          actual_main="$(git rev-parse origin/main)"
          test "$actual_main" = "$expected_main"
          git merge-base --is-ancestor origin/main HEAD
      - name: Regenerate projection with canonical temporary-workflow exclusion
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(git rev-parse HEAD)"
          python tools/fa3_lavasr_global_reconcile.py --projection-only --snapshot-head "$snapshot"
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git commit -m 'FA3: repair LavaSR release projection after final sync'
      - name: Verify release and LavaSR gates
        run: |
          ./bin/fa3-enforce release-projection
          bash bin/fa3-lavasr-enforce
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/fa3-lavasr-reconcile-once.yml
          git commit -m 'FA3: remove LavaSR projection-repair one-shot workflow'
      - name: Push repaired reconciliation branch
        run: git push origin HEAD:reconcile/lavasr-post-merge
