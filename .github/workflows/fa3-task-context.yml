name: FA3 Task Context Scope
on:
  pull_request:
    paths:
      - "src/fa3_task_context.py"
      - "tests/test_task_context.py"
      - ".github/workflows/fa3-task-context.yml"
  push:
    branches: [main]
    paths:
      - "src/fa3_task_context.py"
      - "tests/test_task_context.py"
      - ".github/workflows/fa3-task-context.yml"
permissions:
  contents: read
jobs:
  context-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile src/fa3_task_context.py tests/test_task_context.py
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -p "test_task_context.py" -v
