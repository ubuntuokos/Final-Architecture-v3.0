name: FA3 Motion Video Quality
on:
  push:
    branches: ['fa3/shared-motion-video-quality-*']
    paths:
      - 'canonical/profiles/FA3-SHARED-MOTION-VIDEO-QUALITY-001.json'
      - 'canonical/contracts/FA3-MOTION-PLAN-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-MOTION-RENDER-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-MEDIA-QUALITY-REVIEW-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-MOTION-COMPONENT-LAB-CONTRACTS-001.json'
      - 'canonical/actions/motion.*.json'
      - 'canonical/motion-video-quality-enforcement.json'
      - 'canonical/FA3-APPLICATION-DONOR-LINKS-001.json'
      - 'fa3-current-host/manifest.json'
      - 'src/fa3_motion_video_quality.py'
      - 'src/fa3_motion_video_quality_gate.py'
      - 'tests/test_motion_video_quality.py'
      - '.github/workflows/fa3-motion-video-quality.yml'
  pull_request:
    paths:
      - 'canonical/profiles/FA3-SHARED-MOTION-VIDEO-QUALITY-001.json'
      - 'canonical/contracts/FA3-MOTION-PLAN-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-MOTION-RENDER-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-MEDIA-QUALITY-REVIEW-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-MOTION-COMPONENT-LAB-CONTRACTS-001.json'
      - 'src/fa3_motion_video_quality.py'
      - 'src/fa3_motion_video_quality_gate.py'
      - 'tests/test_motion_video_quality.py'
  workflow_dispatch:
jobs:
  static:
    runs-on: ubuntu-latest
    env: {PYTHONPATH: src}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Syntax
        run: python -m py_compile src/fa3_motion_video_quality.py src/fa3_motion_video_quality_gate.py tests/test_motion_video_quality.py
      - name: Regressions
        run: python -m unittest tests.test_motion_video_quality
      - name: Gate
        run: python src/fa3_motion_video_quality_gate.py --root . --check
      - name: Shared application capability index
        run: ./bin/fa3-app-donor-index --check --summary
