name: FA3 Motion Video Quality
on:
  push:
    branches: [fa3/motion-video-quality-fabric-20261003]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest tests.test_motion_video_quality
      - run: python src/fa3_application_donor_index.py --check --summary
