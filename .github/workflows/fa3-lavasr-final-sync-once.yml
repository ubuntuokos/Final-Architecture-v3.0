name: FA3 LavaSR final sync one-shot

on:
  push:
    branches: [reconcile/lavasr-post-merge]

permissions:
  contents: write

jobs:
  sync-and-reconcile:
    if: github.repository == 'ubuntuokos/Final-Architecture-v3.0' && github.ref == 'refs/heads/reconcile/lavasr-post-merge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/lavasr-post-merge
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure reconciliation identity
        run: |
          git config user.name 'fa3-reconciliation-bot'
          git config user.email 'fa3-reconciliation-bot@users.noreply.github.com'
      - name: Merge exact current main with projection-safe conflict policy
        shell: bash
        run: |
          set -euo pipefail
          expected_main='ef4b9d62abd008007d4a19ad71495c2a02f69dab'
          git fetch origin main
          actual_main="$(git rev-parse origin/main)"
          if [ "$actual_main" != "$expected_main" ]; then
            echo "main moved: expected $expected_main, got $actual_main" >&2
            exit 3
          fi
          set +e
          git merge --no-ff --no-commit origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            allowed='canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json'
            unexpected="$(printf '%s\n' "$conflicts" | grep -v -x "$allowed" || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$unexpected" >&2
              git merge --abort
              exit 2
            fi
            git checkout --theirs -- "$allowed"
            git add -- "$allowed"
          fi
          git commit -m 'FA3: sync LavaSR closure with current main'
      - name: Regenerate unified projection from synchronized snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(git rev-parse HEAD)"
          python tools/fa3_lavasr_global_reconcile.py --projection-only --snapshot-head "$snapshot"
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git commit -m 'FA3: regenerate LavaSR unified projection on current main'
      - name: Verify LavaSR gate
        run: bash bin/fa3-lavasr-enforce
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/fa3-lavasr-final-sync-once.yml
          git commit -m 'FA3: remove LavaSR final sync one-shot workflow'
      - name: Push synchronized reconciliation branch
        run: git push origin HEAD:reconcile/lavasr-post-merge
