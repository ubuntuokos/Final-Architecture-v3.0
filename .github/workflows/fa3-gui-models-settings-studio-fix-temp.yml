name: FA3 temporary Models Settings Studio fix

on:
  push:
    branches:
      - fa3-gui-models-settings-studio-fix

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa3-gui-models-settings-studio-fix
          fetch-depth: 0
          persist-credentials: true

      - name: Patch Control Center surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          main_path = Path('apps/fa3-control-center/qml/Main.qml')
          text = main_path.read_text(encoding='utf-8')

          text = text.replace(
              '    property bool llmFitExpanded: false\n',
              '    property bool llmFitExpanded: false\n    property bool compactNavigation: false\n    property bool statusStripVisible: true\n',
              1,
          )
          text = text.replace('        implicitHeight: 36\n', '        implicitHeight: window.compactNavigation ? 32 : 36\n', 1)
          text = text.replace('            Layout.preferredWidth: 224\n', '            Layout.preferredWidth: window.compactNavigation ? 190 : 224\n', 1)

          ai_re = re.compile(
              r'                ModulePage \{\n                    pageTitle: "AI Studio".*?\n                \}\n\n                ModulePage \{\n                    pageTitle: "Agents & Workflows"',
              re.S,
          )
          ai_replacement = '''                AiStudioPage {
                    panel: window.panel
                    panelRaised: window.panelRaised
                    border: window.border
                    textPrimary: window.textPrimary
                    textMuted: window.textMuted
                    accent: window.accent
                    cyan: window.cyan
                    green: window.green
                    orange: window.orange
                    magenta: window.magenta
                }

                ModulePage {
                    pageTitle: "Agents & Workflows"'''
          text, count = ai_re.subn(ai_replacement, text, count=1)
          if count != 1:
              raise SystemExit('AI Studio block replacement failed')

          provider_re = re.compile(
              r'                ScrollView \{\n                    id: providerView.*?\n                \}\n\n                ScrollView \{\n                    id: modelManagerView',
              re.S,
          )
          provider_replacement = '''                ModelsProvidersPage {
                    panel: window.panel
                    panelRaised: window.panelRaised
                    border: window.border
                    textPrimary: window.textPrimary
                    textMuted: window.textMuted
                    accent: window.accent
                    cyan: window.cyan
                    green: window.green
                    orange: window.orange
                }

                ScrollView {
                    id: modelManagerView'''
          text, count = provider_re.subn(provider_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Models & Providers block replacement failed')

          settings_re = re.compile(
              r'                ModulePage \{\n                    pageTitle: "Rendszerbeállítások".*?\n                \}\n\n                ScrollView \{\n                    id: systemView',
              re.S,
          )
          settings_replacement = '''                SystemSettingsPage {
                    panel: window.panel
                    panelRaised: window.panelRaised
                    border: window.border
                    textPrimary: window.textPrimary
                    textMuted: window.textMuted
                    accent: window.accent
                    cyan: window.cyan
                    green: window.green
                    orange: window.orange
                    magenta: window.magenta
                    compactNavigation: window.compactNavigation
                    statusStripVisible: window.statusStripVisible
                    onCompactNavigationRequested: function(enabled) { window.compactNavigation = enabled }
                    onStatusStripRequested: function(enabled) { window.statusStripVisible = enabled }
                    onNavigateRequested: function(pageIndex) { window.selectedIndex = pageIndex }
                }

                ScrollView {
                    id: systemView'''
          text, count = settings_re.subn(settings_replacement, text, count=1)
          if count != 1:
              raise SystemExit('System Settings block replacement failed')

          old_status = '''            Rectangle {
                Layout.fillWidth: true
                Layout.preferredHeight: 34
                color: "#06101c"'''
          new_status = '''            Rectangle {
                visible: window.statusStripVisible
                Layout.fillWidth: true
                Layout.preferredHeight: visible ? 34 : 0
                color: "#06101c"'''
          if old_status not in text:
              raise SystemExit('status strip marker missing')
          text = text.replace(old_status, new_status, 1)
          main_path.write_text(text, encoding='utf-8')

          cmake_path = Path('apps/fa3-control-center/CMakeLists.txt')
          cmake = cmake_path.read_text(encoding='utf-8')
          cmake = cmake.replace(
              'set_source_files_properties(qml/WebWorkspace.qml PROPERTIES QT_RESOURCE_ALIAS WebWorkspace.qml)\n',
              'set_source_files_properties(qml/WebWorkspace.qml PROPERTIES QT_RESOURCE_ALIAS WebWorkspace.qml)\n'
              'set_source_files_properties(qml/ModelsProvidersPage.qml PROPERTIES QT_RESOURCE_ALIAS ModelsProvidersPage.qml)\n'
              'set_source_files_properties(qml/AiStudioPage.qml PROPERTIES QT_RESOURCE_ALIAS AiStudioPage.qml)\n'
              'set_source_files_properties(qml/SystemSettingsPage.qml PROPERTIES QT_RESOURCE_ALIAS SystemSettingsPage.qml)\n',
              1,
          )
          cmake = cmake.replace(
              '        qml/WebWorkspace.qml\n',
              '        qml/WebWorkspace.qml\n'
              '        qml/ModelsProvidersPage.qml\n'
              '        qml/AiStudioPage.qml\n'
              '        qml/SystemSettingsPage.qml\n',
              1,
          )
          cmake_path.write_text(cmake, encoding='utf-8')

          gate_path = Path('src/fa3_gui_gate.py')
          gate = gate_path.read_text(encoding='utf-8')
          gate = gate.replace(
              '    "qml": ROOT / "apps/fa3-control-center/qml/Main.qml",\n',
              '    "qml": ROOT / "apps/fa3-control-center/qml/Main.qml",\n'
              '    "models_providers_qml": ROOT / "apps/fa3-control-center/qml/ModelsProvidersPage.qml",\n'
              '    "studio_qml": ROOT / "apps/fa3-control-center/qml/AiStudioPage.qml",\n'
              '    "settings_qml": ROOT / "apps/fa3-control-center/qml/SystemSettingsPage.qml",\n',
              1,
          )
          old_studio = '''    for module in ["Image", "Video", "Animation", "3D / VFX", "Audio", "Music", "Story / Screenplay"]:
        if module not in qml: failures.append(f"qml-studio-module-missing:{module}")
'''
          new_studio = '''    studio_qml = REQUIRED["studio_qml"].read_text(encoding="utf-8")
    for module in ["Image", "Video", "Animation", "3D / VFX", "Audio", "Music", "Story / Screenplay", "Office", "Marketing", "Weboldal", "Prezentáció"]:
        if module not in studio_qml: failures.append(f"qml-studio-module-missing:{module}")
    for office_surface in ["Writer", "Calc", "Impress", "Preview", "Apply/UNO", "Undo"]:
        if office_surface not in studio_qml: failures.append(f"qml-office-surface-missing:{office_surface}")
'''
          if old_studio not in gate:
              raise SystemExit('GUI gate studio marker missing')
          gate = gate.replace(old_studio, new_studio, 1)
          marker = '    if "id: architectureScope" not in qml or "Canonical Core" not in qml or "Execution Fabric" not in qml or "Evidence & Release" not in qml or "architectureResults" not in qml: failures.append("qml-architecture-semantic-view-missing")\n'
          additions = marker + '''    models_qml = REQUIRED["models_providers_qml"].read_text(encoding="utf-8")
    if "id: providerList" not in models_qml or "Layout.fillHeight: true" not in models_qml or "ScrollBar.AlwaysOn" not in models_qml: failures.append("qml-models-providers-responsive-scrollbar-missing")
    settings_qml = REQUIRED["settings_qml"].read_text(encoding="utf-8")
    if "compactNavigationRequested" not in settings_qml or "statusStripRequested" not in settings_qml or "ChangeSet-tervezet" not in settings_qml or "Security & Approvals megnyitása" not in settings_qml: failures.append("qml-system-settings-interaction-missing")
    if "ModelsProvidersPage" not in qml or "AiStudioPage" not in qml or "SystemSettingsPage" not in qml: failures.append("qml-dedicated-page-wiring-missing")
'''
          if marker not in gate:
              raise SystemExit('GUI gate architecture marker missing')
          gate = gate.replace(marker, additions, 1)
          gate_path.write_text(gate, encoding='utf-8')
          PY

          rm -f .github/workflows/fa3-gui-models-settings-studio-fix-temp.yml

          git config user.name "fa3-gui-fix"
          git config user.email "fa3-gui-fix@users.noreply.github.com"
          git add apps/fa3-control-center/qml/Main.qml apps/fa3-control-center/CMakeLists.txt src/fa3_gui_gate.py .github/workflows/fa3-gui-models-settings-studio-fix-temp.yml
          git commit -m "FA3 GUI: fix Models resizing, Settings interactions and Office Studio layer"

          PYTHONPATH=src python src/fa3_release_projection_regenerate.py --snapshot-head HEAD
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git commit -m "FA3 release projection: reconcile GUI interaction fixes"
          git push origin HEAD:fa3-gui-models-settings-studio-fix
