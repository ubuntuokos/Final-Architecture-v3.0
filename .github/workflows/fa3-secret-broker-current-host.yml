name: FA3 Secret Broker Current-Host Closure
on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Type RUN to execute the disposable privileged LUKS2 current-host proof"
        required: true
        default: ""
jobs:
  current-host:
    if: ${{ inputs.acknowledge == 'RUN' }}
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify commit-bound privileged bridge
        run: FA3_REPO_ROOT="$PWD" /usr/local/bin/fa3-secret-broker-current-host-bridge doctor
      - name: Real disposable LUKS2 + broker E2E
        run: FA3_REPO_ROOT="$PWD" /usr/local/bin/fa3-secret-broker-current-host-bridge run
      - name: Fail-closed gate
        run: PYTHONPATH=src python3 src/fa3_secret_broker_current_host_gate.py --root "$PWD" --require-evidence
      - name: Build reviewed promotion candidate
        run: PYTHONPATH=src python3 evidence/collect-secret-broker-current-host-reference.py --root "$PWD"
      - name: Upload sanitized current-host evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fa3-secret-broker-current-host-evidence
          path: |
            evidence/receipts/secret-broker-current-host.json
            reports/secret-broker-current-host-gate-report.json
            reports/secret-broker-current-host-reference-candidate.json
          if-no-files-found: error
