name: FA3 GUI Current Host Closure

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/FA3-GUI-RUNTIME-CONFORMANCE-001.json'
      - 'canonical/FA3-GATE-GUI-CURRENT-HOST-001.json'
      - 'canonical/gui-current-host-enforcement.json'
      - 'fa3-current-host/manifest.json'
      - 'canonical/FA3-GATE-GUI-001.json'
      - 'canonical/FA3-GUI-SURFACE-REGISTRY-001.json'
      - 'apps/fa3-control-center/**'
      - 'src/fa3_desktop_admission.py'
      - 'src/fa3_gui_current_host.py'
      - 'src/fa3_gui_current_host_gate.py'
      - 'evidence/collect-gui-current-host.py'
      - 'tests/test_fa3_gui_current_host.py'
      - '.github/workflows/fa3-gui-current-host.yml'

permissions:
  contents: read

concurrency:
  group: fa3-gui-current-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialization-regression:
    name: gui-current-host / materialization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current-host closure materialization
        env:
          PYTHONPATH: src
        run: python3 src/fa3_gui_current_host_gate.py --root .
      - name: Run current-host closure regressions
        env:
          PYTHONPATH: src
        run: python3 -m unittest tests.test_fa3_gui_current_host -v

  current-host:
    name: gui-current-host / physical-desktop-smoke
    needs: materialization-regression
    # Physical desktop smoke is intentionally manual-only. PR/push activity must never
    # pop a real GUI window on the operator workstation.
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 25
    env:
      FA3_RUNNER_CLASS: fa3-current-host
      FA3_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact non-root source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(git rev-parse HEAD)" = "$FA3_EXPECTED_SOURCE_SHA"
          test "$GITHUB_REPOSITORY" = "ubuntuokos/Final-Architecture-v3.0"
      - name: Configure same-source Qt6 build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .fa3-current-host/gui/build
          mkdir -p .fa3-current-host/gui/build reports/gui-current-host
          cmake -S apps/fa3-control-center -B .fa3-current-host/gui/build -GNinja -DCMAKE_BUILD_TYPE=Release
      - name: Build same-source Control Center
        run: cmake --build .fa3-current-host/gui/build --parallel
      - name: Collect real desktop-session smoke receipt
        env:
          PYTHONPATH: src
        run: |
          python3 evidence/collect-gui-current-host.py \
            --root . \
            --executable .fa3-current-host/gui/build/fa3-control-center \
            --output reports/gui-current-host/current-host-receipt.json \
            --smoke-seconds 8 \
            --tested-path CONTROL_CENTER_STARTUP_SESSION_VAULT_UNCONFIGURED
      - name: Validate physical receipt fail-closed
        env:
          PYTHONPATH: src
        run: |
          python3 src/fa3_gui_current_host_gate.py \
            --root . \
            --receipt reports/gui-current-host/current-host-receipt.json \
            --require-evidence
      - name: Upload scoped GUI current-host evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fa3-gui-current-host-evidence
          path: reports/gui-current-host/
          if-no-files-found: error
