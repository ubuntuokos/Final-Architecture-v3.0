name: FA3 Central Model Router Current-Host E2E
on:
  workflow_dispatch:
  push:
    branches:
      - feat/fa3-central-model-router-runtime
    paths:
      - canonical/profiles/FA3-MODEL-ROUTER-001.json
      - canonical/contracts/FA3-MODEL-ROUTER-CONTRACTS-001.json
      - canonical/model-router-enforcement.json
      - deployment/model-router/**
      - src/fa3_model_router_runtime.py
      - src/fa3_model_router_current_host_gate.py
      - evidence/collect-model-router-current-host.py
      - bin/fa3-model-router-*
      - .github/workflows/fa3-model-router-current-host.yml
permissions:
  contents: read
jobs:
  current-host:
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require dynamic provider catalog
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test -n "${FA3_MODEL_ROUTER_PROVIDER_CATALOG:-}"
          test -f "$FA3_MODEL_ROUTER_PROVIDER_CATALOG"
      - name: Ensure isolated LiteLLM data plane
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/fa3-model-router-litellm"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install 'litellm[proxy]==1.102.0'
          echo "FA3_LITELLM_BIN=$VENV/bin/litellm" >> "$GITHUB_ENV"
      - name: Run real current-host route resolution and execution
        shell: bash
        run: |
          set -euo pipefail
          bash bin/fa3-model-router-current-host.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-model-router-current-host-evidence
          path: |
            evidence/receipts/model-router-current-host.json
            evidence/runtime/model-router-current-host/
            reports/model-router-current-host-gate-report.json
