name: FA3 Work Management Canonical + GUI Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/FA3-WORK-MANAGEMENT-PROJECTION-001.json'
      - 'canonical/contracts/FA3-WORK-ITEM-PROJECTION-CONTRACTS-001.json'
      - 'canonical/decisions/FA3-DEC-WORK-MANAGEMENT-GUI-2026-09-17.json'
      - 'canonical/work-management-enforcement.json'
      - 'canonical/providers/FA3-PROVIDER-KANEO-001.json'
      - 'canonical/providers/FA3-PROVIDER-KANBOARD-001.json'
      - 'apps/fa3-control-center/qml/Main.qml'
      - 'apps/fa3-control-center/qml/WorkManagementPage.qml'
      - 'apps/fa3-control-center/qml/AcceleratorGuardPage.qml'
      - 'apps/fa3-control-center/CMakeLists.txt'
      - 'src/fa3_work_management_gate.py'
      - 'tests/test_work_management_gate.py'
      - 'tools/fa3_work_management_global_reconcile.py'
      - '.github/workflows/fa3-work-management.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  work-management:
    name: work-management-gui-resource / P0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile src/fa3_work_management_gate.py tests/test_work_management_gate.py tools/fa3_work_management_global_reconcile.py
      - name: Provider-neutral work-item and resource regressions
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_work_management_gate -v
      - name: Execute fail-closed Work Management gate
        env:
          PYTHONPATH: src
        run: python src/fa3_work_management_gate.py
      - name: Unified release projection gate
        env:
          PYTHONPATH: src
        run: python src/fa3_release_projection_gate.py --root .
      - name: Upload Work Management report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-work-management-gate-report
          path: reports/work-management-gate-report.json
