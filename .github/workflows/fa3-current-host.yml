name: FA3 Unified Current Host Projection

on:
  pull_request:
    branches: [main]
    paths:
      - 'fa3-current-host/**'
      - 'src/fa3_current_host.py'
      - 'bin/fa3-current-host'
      - 'tests/test_current_host_projection.py'
      - '.github/workflows/fa3-current-host.yml'
      - 'canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json'
      - 'src/fa3_release_projection_gate.py'
      - 'src/fa3_cpu_numa_threading_current_host_gate.py'
      - 'tests/test_cpu_numa_threading_current_host_gate.py'
      - 'evidence/collect-cpu-numa-threading-current-host.py'
      - 'canonical/cpu-numa-threading-current-host-enforcement.json'
      - 'canonical/FA3-GATE-CPU-NUMA-THREADING-CURRENT-HOST-001.json'
      - 'canonical/FA3-FFMPEG-AI-RUNTIME-CONFORMANCE-001.json'
      - 'canonical/FA3-GATE-FFMPEG-AI-CURRENT-HOST-001.json'
      - 'canonical/ffmpeg-ai-current-host-enforcement.json'
      - 'src/fa3_ffmpeg_ai_current_host.py'
      - 'src/fa3_ffmpeg_ai_current_host_gate.py'
      - 'tests/test_ffmpeg_ai_current_host_gate.py'
      - 'evidence/collect-ffmpeg-ai-current-host.py'
      - 'src/fa3_audit_chain.py'
      - 'src/fa3_blackhole_admission.py'
      - 'src/fa3_blackhole_runtime_gate.py'
      - 'apps/blackhole-api/**'
      - 'deployment/containers/blackhole-api.Containerfile'
      - 'evidence/collect-blackhole-oci-admission.py'
      - 'tests/test_blackhole_runtime_gate.py'
      - 'canonical/blackhole-runtime-promotion-enforcement.json'
      - 'canonical/decisions/FA3-DEC-BLACKHOLE-RUNTIME-PROMOTION-2026-09-14.json'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      execute_current_host:
        description: 'Run real current-host collection and fail-closed gates on the labeled self-hosted runner'
        required: true
        default: false
        type: boolean
      cpu_numa_performance_evidence:
        description: 'Path on the self-hosted runner to workload-specific CPU/NUMA benchmark evidence JSON'
        required: false
        default: '.fa3-current-host/input/cpu-numa-performance.json'
        type: string
      cpu_numa_rollback_evidence:
        description: 'Path on the self-hosted runner to CPU/NUMA rollback and failure-injection evidence JSON'
        required: false
        default: '.fa3-current-host/input/cpu-numa-rollback.json'
        type: string
      blackhole_production_image:
        description: 'Optional immutable Blackhole production image reference, required form: registry/name@sha256:<digest>'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  projection-regression:
    name: current-host-projection / regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify unified current-host projection
        run: |
          chmod +x bin/fa3-current-host bin/fa3-enforce
          ./bin/fa3-current-host verify
      - name: Executable regression tests
        run: PYTHONPATH=src python -m unittest tests.test_current_host_projection tests.test_cpu_numa_threading_current_host_gate tests.test_ffmpeg_ai_current_host_gate tests.test_blackhole_runtime_gate -v
      - name: Current-host collector syntax check
        run: python -m py_compile evidence/collect-cpu-numa-threading-current-host.py src/fa3_cpu_numa_threading_current_host_gate.py evidence/collect-ffmpeg-ai-current-host.py src/fa3_ffmpeg_ai_current_host.py src/fa3_ffmpeg_ai_current_host_gate.py src/fa3_audit_chain.py src/fa3_blackhole_admission.py src/fa3_blackhole_runtime_gate.py apps/blackhole-api/main.py evidence/collect-blackhole-oci-admission.py
      - name: Blackhole REST/audit/OCI reference promotion boundary
        run: PYTHONPATH=src python src/fa3_blackhole_runtime_gate.py --root .
      - name: Unified release projection must remain coherent
        run: ./bin/fa3-enforce release-projection

  current-host:
    name: current-host / real-execution
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_current_host }}
    needs: projection-regression
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Execute current-host collection and global fail-closed gates
        run: |
          chmod +x bin/fa3-current-host bin/fa3-enforce evidence/collect-current-host.sh evidence/collect-cpu-numa-threading-current-host.py
          python evidence/collect-cpu-numa-threading-current-host.py \
            --performance-evidence "${{ inputs.cpu_numa_performance_evidence }}" \
            --rollback-evidence "${{ inputs.cpu_numa_rollback_evidence }}"
          ./bin/fa3-enforce cpu-numa-threading-current-host
          ./bin/fa3-current-host all
      - name: Blackhole component production admission
        if: ${{ inputs.blackhole_production_image != '' }}
        env:
          FA3_BLACKHOLE_PRODUCTION_IMAGE: ${{ inputs.blackhole_production_image }}
        run: |
          PYTHONPATH=src python src/fa3_ffmpeg_ai_current_host_gate.py --root .
          PYTHONPATH=src python evidence/collect-blackhole-oci-admission.py --root . --mode current-host --production-image "$FA3_BLACKHOLE_PRODUCTION_IMAGE"
          PYTHONPATH=src python src/fa3_blackhole_runtime_gate.py --root . --current-host
      - name: Upload current-host execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa3-current-host-execution
          if-no-files-found: warn
          path: |
            .fa3-current-host/**
            reports/**
            acceptance/**
            promotion/**
