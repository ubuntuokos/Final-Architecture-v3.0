name: FA3 Unified Current Host Projection

on:
  pull_request:
    branches: [main]
    paths:
      - 'fa3-current-host/**'
      - 'src/fa3_current_host.py'
      - 'bin/fa3-current-host'
      - 'tests/test_current_host_projection.py'
      - '.github/workflows/fa3-current-host.yml'
      - 'canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json'
      - 'src/fa3_release_projection_gate.py'
      - 'src/fa3_cpu_numa_threading_current_host_gate.py'
      - 'tests/test_cpu_numa_threading_current_host_gate.py'
      - 'evidence/collect-cpu-numa-threading-current-host.py'
      - 'canonical/cpu-numa-threading-current-host-enforcement.json'
      - 'canonical/FA3-GATE-CPU-NUMA-THREADING-CURRENT-HOST-001.json'
      - 'canonical/FA3-FFMPEG-AI-RUNTIME-CONFORMANCE-001.json'
      - 'canonical/FA3-GATE-FFMPEG-AI-CURRENT-HOST-001.json'
      - 'canonical/ffmpeg-ai-current-host-enforcement.json'
      - 'src/fa3_ffmpeg_ai_current_host.py'
      - 'src/fa3_ffmpeg_ai_current_host_gate.py'
      - 'tests/test_ffmpeg_ai_current_host_gate.py'
      - 'evidence/collect-ffmpeg-ai-current-host.py'
      - 'canonical/FA3-GATE-RESOURCE-ADMISSION-CURRENT-HOST-001.json'
      - 'canonical/resource-admission-current-host-enforcement.json'
      - 'canonical/decisions/FA3-DEC-RESOURCE-ADMISSION-CURRENT-HOST-2026-09-14.json'
      - 'evidence/reference/resource-admission-current-host-pending.json'
      - 'src/fa3_resource_admission_current_host_gate.py'
      - 'tests/test_resource_admission_current_host_gate.py'
      - 'evidence/collect-resource-admission-current-host.py'
      - 'bin/fa3-resource-admission-current-host.sh'
      - '.github/workflows/fa3-resource-admission-current-host.yml'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      execute_current_host:
        description: 'Run real current-host collection and fail-closed gates on the labeled self-hosted runner'
        required: true
        default: false
        type: boolean
      cpu_numa_performance_evidence:
        description: 'Path on the self-hosted runner to workload-specific CPU/NUMA benchmark evidence JSON'
        required: false
        default: '.fa3-current-host/input/cpu-numa-performance.json'
        type: string
      cpu_numa_rollback_evidence:
        description: 'Path on the self-hosted runner to CPU/NUMA rollback and failure-injection evidence JSON'
        required: false
        default: '.fa3-current-host/input/cpu-numa-rollback.json'
        type: string
      resource_workload_envelope:
        description: 'Path on the self-hosted runner to fa3.workload-resource-envelope.v1 JSON'
        required: false
        default: '.fa3-current-host/input/resource-workload-envelope.json'
        type: string
      resource_hrb_lease:
        description: 'Path on the self-hosted runner to the current HRB AcceleratorExecutionLease JSON'
        required: false
        default: '.fa3-current-host/input/resource-hrb-lease.json'
        type: string

permissions:
  contents: read

jobs:
  projection-regression:
    name: current-host-projection / regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unified current-host projection
        run: |
          chmod +x bin/fa3-current-host bin/fa3-enforce
          ./bin/fa3-current-host verify
      - name: Executable regression tests
        run: PYTHONPATH=src python -m unittest tests.test_current_host_projection tests.test_cpu_numa_threading_current_host_gate tests.test_ffmpeg_ai_current_host_gate tests.test_resource_admission_current_host_gate -v
      - name: Current-host collector syntax check
        run: python -m py_compile evidence/collect-cpu-numa-threading-current-host.py src/fa3_cpu_numa_threading_current_host_gate.py evidence/collect-ffmpeg-ai-current-host.py src/fa3_ffmpeg_ai_current_host.py src/fa3_ffmpeg_ai_current_host_gate.py evidence/collect-resource-admission-current-host.py src/fa3_resource_admission_current_host_gate.py
      - name: Resource admission canonical parent gate
        run: ./bin/fa3-enforce resource-evidence-normalization
      - name: Missing real resource-admission receipt must remain fail-closed
        run: |
          set +e
          ./bin/fa3-enforce resource-admission-current-host
          rc=$?
          set -e
          test "$rc" -eq 2
      - name: Unified release projection must remain coherent
        run: ./bin/fa3-enforce release-projection

  current-host:
    name: current-host / real-execution
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_current_host }}
    needs: projection-regression
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Execute current-host resource admission, collection and global fail-closed gates
        run: |
          chmod +x bin/fa3-current-host bin/fa3-enforce bin/fa3-resource-admission-current-host.sh evidence/collect-current-host.sh evidence/collect-cpu-numa-threading-current-host.py evidence/collect-resource-admission-current-host.py
          ./bin/fa3-resource-admission-current-host.sh collect \
            --workload-envelope "${{ inputs.resource_workload_envelope }}" \
            --hrb-lease "${{ inputs.resource_hrb_lease }}"
          ./bin/fa3-enforce resource-admission-current-host
          python evidence/collect-cpu-numa-threading-current-host.py \
            --performance-evidence "${{ inputs.cpu_numa_performance_evidence }}" \
            --rollback-evidence "${{ inputs.cpu_numa_rollback_evidence }}"
          ./bin/fa3-enforce cpu-numa-threading-current-host
          ./bin/fa3-current-host all
      - name: Upload current-host execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-current-host-execution
          if-no-files-found: warn
          path: |
            .fa3-current-host/**
            evidence/receipts/resource-admission-current-host.json
            reports/**
            acceptance/**
            promotion/**
