name: FA3 Caveman Finalizer

on:
  push:
    branches:
      - fa3/caveman-finalize-2026-09-06

permissions:
  contents: write

concurrency:
  group: fa3-caveman-finalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[caveman-finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize Caveman global reconciliation
        run: python tools/fa3_caveman_finalize.py
