name: FA3 Secret Broker reference gate
on:
  pull_request:
  workflow_dispatch:
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret Broker tests
        run: PYTHONPATH=src python -m unittest tests.test_secret_broker tests.test_secret_broker_gate tests.test_secret_broker_current_host -v
      - name: Secret Broker canonical gate
        run: PYTHONPATH=src python src/fa3_secret_broker_gate.py
