name: FA3 temporary app-search label patch

on:
  push:
    branches:
      - fa3-gui-integrations-fa3-app-search

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa3-gui-integrations-fa3-app-search
          fetch-depth: 0
          persist-credentials: true
      - name: Clarify FA3 application search wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/fa3-control-center/qml/Main.qml')
          text = path.read_text(encoding='utf-8')
          old_sub = 'SectionTitle { title: "Keresés"; subtitle: "Projekt, beszélgetés, telepített alkalmazás, FA3-funkció, beállítás és canonical rekord egy helyen" }'
          new_sub = 'SectionTitle { title: "Keresés"; subtitle: "Projekt, beszélgetés, FA3-alkalmazás, FA3-funkció, beállítás és canonical rekord egy helyen" }'
          if old_sub not in text:
              raise SystemExit('search subtitle marker not found')
          text = text.replace(old_sub, new_sub, 1)
          old_label = '{label: "Telepített alkalmazások", value: "APPLICATION"}'
          new_label = '{label: "FA3 alkalmazások", value: "APPLICATION"}'
          if old_label not in text:
              raise SystemExit('application scope label not found')
          text = text.replace(old_label, new_label, 1)
          path.write_text(text, encoding='utf-8')

          tpath = Path('tests/test_fa3_gui_gate.py')
          tests = tpath.read_text(encoding='utf-8')
          needle = '        self.assertNotIn("fa3Repository.searchInstalledApplications(needle)", main)\n'
          replacement = needle + '        self.assertIn(\'{label: "FA3 alkalmazások", value: "APPLICATION"}\', main)\n        self.assertNotIn(\'{label: "Telepített alkalmazások", value: "APPLICATION"}\', main)\n'
          if needle not in tests:
              raise SystemExit('test marker not found')
          if 'self.assertIn(\'{label: "FA3 alkalmazások"' not in tests:
              tests = tests.replace(needle, replacement, 1)
              tpath.write_text(tests, encoding='utf-8')
          PY

          temp_workflow=".github/workflows/fa3-app-search-label-temp.yml"
          saved="/tmp/fa3-app-search-label-temp.yml"
          mv "$temp_workflow" "$saved"
          python src/fa3_release_projection_regenerate.py
          mv "$saved" "$temp_workflow"

          git config user.name "fa3-gui-integrations-app-search"
          git config user.email "fa3-gui-integrations-app-search@users.noreply.github.com"
          git add apps/fa3-control-center/qml/Main.qml tests/test_fa3_gui_gate.py canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "FA3 GUI: label application search as FA3-scoped"
          git push origin HEAD:fa3-gui-integrations-fa3-app-search
