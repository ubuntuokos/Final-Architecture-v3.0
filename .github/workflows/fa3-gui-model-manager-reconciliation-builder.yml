name: FA3 GUI Model Manager Reconciliation Builder

on:
  push:
    branches:
      - reconcile/gui-model-manager-2026-09-17
    paths:
      - tools/fa3_gui_model_manager_reconcile_2026_09_17.py
      - .github/workflows/fa3-gui-model-manager-reconciliation-builder.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fa3-gui-model-manager-reconciliation-builder
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch serialized donor workstreams
        shell: bash
        run: |
          git fetch --no-tags origin \
            feat/fa3-gui-settings-mentor-coach \
            fa3/remote-ai-hub-hf-spaces \
            fa3/model-manager-llmfit-gui-2026-09-13 \
            fa3/gui-resource-strip-2026-09-13 \
            fa3/openmodeldb-download-manager-gui-2026-09-13 \
            feat/fa3-language-fabric-litellm-gateway \
            fa3-gui-live-interpreter-v1 \
            feature/fa3-tools-file-conversion-convertx \
            fa3/dev-mode-update-fabric-2026-09-15

      - name: Materialize semantic reconciliation
        run: python tools/fa3_gui_model_manager_reconcile_2026_09_17.py

      - name: Reconcile unified release projection
        run: python scripts/fa3_reconcile_release_projection.py --root .

      - name: Commit reconciled tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reconciliation delta."
          else
            git commit -m "FA3: materialize serialized GUI and Model Manager reconciliation [reconciled]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Run focused reconciliation regressions
        shell: bash
        run: |
          chmod +x bin/fa3-enforce bin/fa3-convertx-gate bin/fa3-language-gateway-current-host.sh || true
          PYTHONPATH=src python -m unittest \
            tests.test_gui_model_manager_reconciliation_2026_09_17 \
            tests.test_openmodeldb_browser_download_manager \
            tests.test_model_manager_llmfit_gui_gate \
            tests.test_remote_ai_exec_gate \
            tests.test_canonical_language_gate \
            tests.test_language_bridge \
            tests.test_language_gateway_gate \
            tests.test_convertx_gate \
            tests.test_convertx_v018_http \
            tests.test_tools_fabric \
            tests.test_fa3_dev_update -v
          PYTHONPATH=src python src/fa3_remote_ai_exec_gate.py
          PYTHONPATH=src python src/fa3_model_manager_llmfit_gui_gate.py
          PYTHONPATH=src python src/fa3_language_gateway_gate.py --root .
          PYTHONPATH=src python src/fa3_dev_update_gate.py
          ./bin/fa3-convertx-gate
          ./bin/fa3-enforce release-projection

      - name: Verify no current-host promotion was fabricated
        shell: bash
        run: |
          ! git grep -n 'GLOBAL_FA3_PROMOTION_PASS' -- evidence/reference canonical reports || false
          echo "Hosted reconciliation completed; current-host E2E remains a separate explicit step."
