name: FA3 Donor Intake Cross-PR Revalidation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed, ready_for_review]
    paths:
      - 'canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json'
      - 'canonical/deltas/FA3-DONOR-*'
      - 'src/fa3_donor_readiness.py'
      - '.github/workflows/fa3-donor-serialization.yml'
      - '.github/workflows/fa3-donor-intake-revalidation.yml'
  push:
    branches: [main]

permissions:
  actions: write
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: fa3-donor-intake-cross-pr-revalidation
  cancel-in-progress: false

jobs:
  revalidate-active-intake-order:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout protected published main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Invalidate stale required checks and re-run the current finalizer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from pathlib import Path

          sys.path.insert(0, "src")
          from fa3_donor_readiness import REPO, gate, github_get

          token=os.environ["GITHUB_TOKEN"]
          getter=lambda path: github_get(path,token)
          report=gate(Path(".").resolve(),"intake",get=getter)
          rows=report.get("pending_intake_prs")
          order=report.get("finalization_order") or []
          findings=report.get("findings") or []
          proof_failures=[f for f in findings
                          if f=="MAIN_MOVED_DURING_SCAN" or f.startswith("PROOF_UNAVAILABLE:")]
          if rows is None or proof_failures:
              raise SystemExit("live donor inventory proof unavailable; refusing cross-PR revalidation")
          if not rows:
              print("No live donor-intake PRs require cross-PR revalidation.")
              raise SystemExit(0)
          if not order:
              raise SystemExit("live donor inventory has intake PRs but no finalization order")

          finalizer=order[0]
          waiting=set(report.get("waiting_donor_prs") or [])
          main_sha=getter(f"/repos/{REPO}/branches/main")["commit"]["sha"]

          def api(method,path,payload):
              req=urllib.request.Request(
                  "https://api.github.com"+path,
                  data=json.dumps(payload).encode("utf-8"),
                  method=method,
                  headers={
                      "Authorization":"Bearer "+token,
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                      "Content-Type":"application/json",
                      "User-Agent":"fa3-donor-cross-pr-revalidation",
                  })
              with urllib.request.urlopen(req,timeout=20) as response:
                  if response.status not in (200,201,204):
                      raise RuntimeError("GitHub write failed: "+str(response.status))

          def fail_required_check(row,title,summary):
              head_sha=row.get("head_sha")
              if not isinstance(head_sha,str) or len(head_sha)!=40:
                  raise SystemExit(f"PR #{row.get('number')}: missing exact head SHA")
              api("POST",f"/repos/{REPO}/check-runs",{
                  "name":"canonical-regression / P0",
                  "head_sha":head_sha,
                  "status":"completed",
                  "conclusion":"failure",
                  "output":{"title":title,"summary":summary},
              })

          for row in rows:
              number=row["number"]
              if number == finalizer:
                  continue
              reason=("DONOR_INTAKE_ACTIVE_WINDOW_FULL_WAIT_FOR_SLOT"
                      if number in waiting else
                      "DONOR_INTAKE_ACTIVE_WAIT_FOR_SMALLER_FINALIZATION")
              fail_required_check(
                  row,
                  "Donor intake ordering changed",
                  (
                      f"PR #{number} is not the current canonical donor finalizer. "
                      f"Required check invalidated by live rolling-window revalidation: {reason}. "
                      f"Current finalizer: PR #{finalizer}."
                  ),
              )
              print(f"Invalidated stale canonical readiness for PR #{number}: {reason}")

          final=next(row for row in rows if row["number"]==finalizer)
          head_sha=final.get("head_sha")
          if not isinstance(head_sha,str) or len(head_sha)!=40:
              raise SystemExit(f"PR #{finalizer}: missing exact head SHA")

          compare=getter(f"/repos/{REPO}/compare/{main_sha}...{head_sha}")
          merge_base=(compare.get("merge_base_commit") or {}).get("sha")
          behind=compare.get("behind_by")
          if merge_base != main_sha or behind != 0:
              fail_required_check(
                  final,
                  "Donor finalizer must reconcile published main",
                  (
                      f"PR #{finalizer} is the current donor finalizer but its exact head "
                      f"{head_sha} does not contain published main {main_sha}. "
                      "Reconcile main, then let the normal pull_request Permanent Canonical "
                      "gate revalidate the updated exact head."
                  ),
              )
              print(f"Invalidated finalizer PR #{finalizer}: published-main reconciliation required")
              raise SystemExit(0)

          runs=getter(
              f"/repos/{REPO}/actions/runs?event=pull_request&head_sha={head_sha}&per_page=100")
          candidates=[
              run for run in runs.get("workflow_runs",[])
              if run.get("name")=="FA3 Permanent Canonical + Promotion Gate"
              and run.get("event")=="pull_request"
              and run.get("head_sha")==head_sha
          ]
          if not candidates:
              fail_required_check(
                  final,
                  "Donor finalizer requires PR-context canonical revalidation",
                  (
                      f"PR #{finalizer} is the current donor finalizer, but no exact-head "
                      "pull_request Permanent Canonical run is available to re-run. "
                      "Synchronize the PR head to trigger the required gate."
                  ),
              )
              print(f"Invalidated finalizer PR #{finalizer}: no PR-context canonical run")
              raise SystemExit(0)

          candidates.sort(key=lambda run:(run.get("created_at") or "",run.get("id") or 0),
                          reverse=True)
          current=candidates[0]
          if current.get("status") != "completed":
              print(
                  f"PR #{finalizer} already has PR-context Permanent Canonical "
                  f"revalidation in progress: run {current['id']}")
              raise SystemExit(0)

          api("POST",f"/repos/{REPO}/actions/runs/{current['id']}/rerun",{})
          print(
              f"Re-running PR-context Permanent Canonical for current finalizer "
              f"PR #{finalizer} @ {head_sha}: run {current['id']}")
          PY
