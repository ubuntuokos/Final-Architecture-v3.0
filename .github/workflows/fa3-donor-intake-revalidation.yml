name: FA3 Donor Intake Cross-PR Revalidation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed, ready_for_review]
    paths:
      - 'canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json'
      - 'canonical/deltas/FA3-DONOR-*'
      - 'src/fa3_donor_readiness.py'
      - '.github/workflows/fa3-donor-serialization.yml'
      - '.github/workflows/fa3-donor-intake-revalidation.yml'
  push:
    branches: [main]

permissions:
  actions: write
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: fa3-donor-intake-cross-pr-revalidation
  cancel-in-progress: false

jobs:
  revalidate-active-intake-order:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout protected published main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Invalidate stale required checks and re-run the current finalizer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from pathlib import Path

          sys.path.insert(0, "src")
          from fa3_donor_readiness import REPO, gate, github_get

          token=os.environ["GITHUB_TOKEN"]
          getter=lambda path: github_get(path,token)
          report=gate(Path(".").resolve(),"intake",get=getter)
          rows=report.get("pending_intake_prs")
          order=report.get("finalization_order") or []
          findings=report.get("findings") or []
          proof_failures=[f for f in findings
                          if f=="MAIN_MOVED_DURING_SCAN" or f.startswith("PROOF_UNAVAILABLE:")]
          if rows is None or proof_failures:
              raise SystemExit("live donor inventory proof unavailable; refusing cross-PR revalidation")
          if not rows:
              print("No live donor-intake PRs require cross-PR revalidation.")
              raise SystemExit(0)
          if not order:
              raise SystemExit("live donor inventory has intake PRs but no finalization order")

          finalizer=order[0]
          waiting=set(report.get("waiting_donor_prs") or [])

          def api(method,path,payload):
              req=urllib.request.Request(
                  "https://api.github.com"+path,
                  data=json.dumps(payload).encode("utf-8"),
                  method=method,
                  headers={
                      "Authorization":"Bearer "+token,
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                      "Content-Type":"application/json",
                      "User-Agent":"fa3-donor-cross-pr-revalidation",
                  })
              with urllib.request.urlopen(req,timeout=20) as response:
                  if response.status not in (200,201,204):
                      raise RuntimeError("GitHub write failed: "+str(response.status))

          for row in rows:
              number=row["number"]
              head_sha=row.get("head_sha")
              if not isinstance(head_sha,str) or len(head_sha)!=40:
                  raise SystemExit(f"PR #{number}: missing exact head SHA")
              if number != finalizer:
                  reason=("DONOR_INTAKE_ACTIVE_WINDOW_FULL_WAIT_FOR_SLOT"
                          if number in waiting else
                          "DONOR_INTAKE_ACTIVE_WAIT_FOR_SMALLER_FINALIZATION")
                  api("POST",f"/repos/{REPO}/check-runs",{
                      "name":"canonical-regression / P0",
                      "head_sha":head_sha,
                      "status":"completed",
                      "conclusion":"failure",
                      "output":{
                          "title":"Donor intake ordering changed",
                          "summary":(
                              f"PR #{number} is not the current canonical donor finalizer. "
                              f"Required check invalidated by live rolling-window revalidation: {reason}. "
                              f"Current finalizer: PR #{finalizer}."
                          ),
                      },
                  })
                  print(f"Invalidated stale canonical readiness for PR #{number}: {reason}")

          final=next(row for row in rows if row["number"]==finalizer)
          head_ref=final.get("head_ref")
          head_repo=final.get("head_repo_full_name")
          if head_repo != REPO or not isinstance(head_ref,str) or not head_ref:
              api("POST",f"/repos/{REPO}/check-runs",{
                  "name":"canonical-regression / P0",
                  "head_sha":final["head_sha"],
                  "status":"completed",
                  "conclusion":"failure",
                  "output":{
                      "title":"Donor finalizer cannot be revalidated",
                      "summary":"The current donor finalizer is not dispatchable from the canonical repository; fail closed.",
                  },
              })
              raise SystemExit(f"PR #{finalizer}: finalizer head is not a dispatchable repository branch")

          api("POST",f"/repos/{REPO}/actions/workflows/fa3-permanent-enforcement.yml/dispatches",{
              "ref":head_ref,
          })
          print(f"Dispatched required Permanent Canonical revalidation for PR #{finalizer} @ {final['head_sha']}")
          PY
