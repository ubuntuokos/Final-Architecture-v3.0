name: FA3 Reuse Discovery Gate

on:
  push:
    branches: ["fa3/**", "feature/**", "feat/**", "fix/**"]
    paths:
      - "canonical/FA3-REUSE-CATALOG-001.json"
      - "canonical/profiles/FA3-REUSE-DISCOVERY-001.json"
      - "canonical/contracts/FA3-APPLICATION-INTENT-001.schema.json"
      - "canonical/contracts/FA3-REUSABLE-PATTERN-001.schema.json"
      - "canonical/contracts/FA3-REUSE-ASSESSMENT-001.schema.json"
      - "canonical/contracts/FA3-REUSE-DISCOVERY-CONTRACTS-001.json"
      - "canonical/patterns/**"
      - "canonical/intents/**"
      - "canonical/assessments/**"
      - "src/fa3_reuse_*.py"
      - "bin/fa3-reuse-assess"
      - "tests/test_reuse_discovery_gate.py"
      - ".github/workflows/fa3-reuse-discovery.yml"
      - "reports/reuse-discovery-ci-retrigger-*.txt"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax
        run: python -m py_compile src/fa3_reuse_catalog.py src/fa3_reuse_resolver.py src/fa3_reuse_assessment.py src/fa3_reuse_gate.py
      - name: Reuse discovery regressions
        run: PYTHONPATH=src python -m unittest tests.test_reuse_discovery_gate -v
      - name: Full repository unit regression
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Hardware audit remains vendor-neutral
        run: ./bin/fa3-enforce hardware-portability
      - name: Unified release projection
        run: ./bin/fa3-enforce release-projection
      - name: Distribution compliance regression
        run: ./bin/fa3-enforce distribution-compliance
      - name: Integration broker regression
        run: ./bin/fa3-enforce integration-broker
      - name: GUI canonical regression
        run: PYTHONPATH=. python src/fa3_gui_gate.py
      - name: Reuse discovery fail-closed gate
        run: ./bin/fa3-enforce reuse-discovery
      - name: Global static enforcement
        run: ./bin/fa3-enforce static
      - name: Diff whitespace
        run: git diff --check HEAD^ HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fa3-reuse-discovery-gate
          if-no-files-found: error
          path: |
            reports/reuse-discovery-gate-report.json
            reports/release-projection-gate-report.json
            reports/static-gate-report.json
