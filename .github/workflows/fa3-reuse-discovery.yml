name: FA3 Reuse Discovery Gate

on:
  push:
    branches: ["fa3/**", "feature/**", "feat/**", "fix/**"]
    paths:
      - "canonical/FA3-REUSE-CATALOG-001.json"
      - "canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json"
      - "canonical/FA3-DONOR-REJECTION-AUDIT-001.json"
      - "canonical/decisions/FA3-DEC-DONOR-LIFECYCLE-APPLICATION-SYNC-2026-09-30.json"
      - "canonical/FA3-APPLICATION-DONOR-LINKS-001.json"
      - "canonical/FA3-APP-LIFECYCLE-001.json"
      - "canonical/FA3-AI-STUDIO-APP-CATALOG-001.json"
      - "src/fa3_application_donor_index.py"
      - "docs/application-donor-inventory.md"
      - "canonical/decisions/FA3-DEC-DONOR-REFERENCE-REGISTRY-2026-09-28.json"
      - "canonical/FA3-KHRONOS-ADAPTER-REGISTRY-001.json"
      - "canonical/integrations/FA3-KHRONOS-OPEN-STANDARDS-INTEGRATION-001.json"
      - "canonical/profiles/FA3-KHRONOS-OPEN-STANDARDS-001.json"
      - "canonical/decisions/FA3-DEC-KHRONOS-REUSE-SOURCE-2026-09-28.json"
      - "canonical/profiles/FA3-REUSE-DISCOVERY-001.json"
      - "canonical/contracts/FA3-APPLICATION-INTENT-001.schema.json"
      - "canonical/contracts/FA3-REUSABLE-PATTERN-001.schema.json"
      - "canonical/contracts/FA3-REUSE-ASSESSMENT-001.schema.json"
      - "canonical/contracts/FA3-REUSE-DISCOVERY-CONTRACTS-001.json"
      - "canonical/skill-registry.json"
      - "canonical/FA3-EXTERNAL-SKILL-RADAR-001.json"
      - "canonical/profiles/FA3-SKILL-FABRIC-001.json"
      - "canonical/contracts/FA3-SKILL-DISCOVERY-CONTRACTS-001.json"
      - "canonical/patterns/**"
      - "canonical/intents/**"
      - "canonical/assessments/**"
      - "src/fa3_reuse_*.py"
      - "src/fa3_donor_registry.py"
      - "src/fa3_donor_chat_import.py"
      - "src/fa3_donor_chat_inbox.py"
      - "bin/fa3-donor-chat-inbox"
      - "bin/fa3-donor-chat-watch-install"
      - "tests/test_donor_chat_inbox.py"
      - "tests/test_donor_chat_watch_install.py"
      - "tests/test_donor_historical_partial_reuse.py"
      - "tests/test_donor_intel_ecosystem.py"
      - "docs/donor-intel-github-ecosystem-2026-09-28.md"
      - "docs/donor-historical-selective-review.md"
      - "docs/donor-reference-registry.md"
      - "canonical/contracts/FA3-DONOR-CHAT-INGEST-001.json"
      - "bin/fa3-donor-chat-import"
      - "tests/test_donor_chat_import.py"
      - "docs/donor-chat-history-bridge.md"
      - "bin/fa3-donor-capture"
      - "AGENTS.md"
      - "bin/fa3-reuse-assess"
      - "tests/test_reuse_discovery_gate.py"
      - ".github/workflows/fa3-reuse-discovery.yml"
      - "reports/reuse-discovery-ci-retrigger-*.txt"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse-discovery:
    runs-on: ubuntu-latest
    env:
      FA3_CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      FA3_CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FA3_PUBLISHED_MAIN_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve live main and change merge-base for reuse planning
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          LIVE_MAIN="$(git rev-parse refs/remotes/origin/main)"
          MERGE_BASE="$(git merge-base "$LIVE_MAIN" "$FA3_CHANGE_HEAD_SHA")"
          test -n "$LIVE_MAIN"
          test -n "$MERGE_BASE"
          echo "FA3_PUBLISHED_MAIN_SHA=$LIVE_MAIN" >> "$GITHUB_ENV"
          echo "FA3_CHANGE_BASE_SHA=$MERGE_BASE" >> "$GITHUB_ENV"
          echo "Live main: $LIVE_MAIN; change merge-base: $MERGE_BASE"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax
        run: python -m py_compile src/fa3_reuse_catalog.py src/fa3_reuse_resolver.py src/fa3_reuse_assessment.py src/fa3_reuse_gate.py src/fa3_donor_registry.py src/fa3_donor_chat_import.py src/fa3_donor_chat_inbox.py
      - name: Donor import wrapper and installer shell syntax
        run: bash -n bin/fa3-donor-chat-import bin/fa3-donor-chat-inbox bin/fa3-donor-chat-watch-install
      - name: Donor capture dry-run
        run: ./bin/fa3-donor-capture --name "CI Donor Probe" --source "reference:ci-donor-probe" --tag ci --dry-run
      - name: Donor chat export and approved-event ingestion regressions
        run: PYTHONPATH=src python -m unittest tests.test_donor_chat_import -v
      - name: Local opt-in donor inbox regressions
        run: PYTHONPATH=src python -m unittest tests.test_donor_chat_inbox -v
      - name: Opt-in systemd watcher installer regression
        run: PYTHONPATH=src python -m unittest tests.test_donor_chat_watch_install -v
      - name: Historical selective donor source and authority regressions
        run: PYTHONPATH=src python -m unittest tests.test_donor_historical_partial_reuse -v
      - name: Intel ecosystem donor and hardware boundary regressions
        run: PYTHONPATH=src python -m unittest tests.test_donor_intel_ecosystem -v
      - name: Reuse discovery regressions
        run: PYTHONPATH=src python -m unittest tests.test_reuse_discovery_gate -v
      - name: Full repository unit regression
        run: bash bin/fa3-test -v
      - name: Hardware audit remains vendor-neutral
        run: ./bin/fa3-enforce hardware-portability
      - name: Unified release projection
        run: ./bin/fa3-enforce release-projection
      - name: Distribution compliance regression
        run: ./bin/fa3-enforce distribution-compliance
      - name: Integration broker regression
        run: ./bin/fa3-enforce integration-broker
      - name: GUI canonical regression
        run: PYTHONPATH=src python src/fa3_gui_gate.py
      - name: Reuse discovery fail-closed gate
        run: ./bin/fa3-enforce reuse-discovery
      - name: Global static enforcement
        run: ./bin/fa3-enforce static
      - name: Diff whitespace
        run: git diff --check HEAD^ HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fa3-reuse-discovery-gate
          if-no-files-found: error
          path: |
            reports/reuse-discovery-gate-report.json
            reports/release-projection-gate-report.json
            reports/static-gate-report.json
