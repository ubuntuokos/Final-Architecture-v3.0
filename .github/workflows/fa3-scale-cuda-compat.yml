name: FA3 SCALE CUDA Compatibility Backend

on:
  pull_request:
    paths:
      - 'canonical/providers/FA3-PROVIDER-SCALE-CUDA-COMPAT-001.json'
      - 'canonical/contracts/FA3-SCALE-CUDA-COMPAT-CONTRACTS-001.json'
      - 'canonical/intents/FA3-SCALE-CUDA-COMPAT-APPLICATION-INTENT-2026-10-04.json'
      - 'canonical/assessments/FA3-SCALE-CUDA-COMPAT-REUSE-ASSESSMENT-2026-10-04.json'
      - 'canonical/current-host-impact/FA3-CH-IMPACT-SCALE-CUDA-COMPAT-20261004.json'
      - 'src/fa3_scale_backend.py'
      - 'src/fa3_accelerator_backend_probe.py'
      - 'src/fa3_scale_backend_gate.py'
      - 'tests/test_scale_backend.py'
      - 'tests/test_scale_backend_integration.py'
      - 'tests/test_scale_backend_gate.py'
      - 'docs/scale-cuda-compat-backend-2026-10-04.md'
      - '.github/workflows/fa3-scale-cuda-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-cuda-compat-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: |
          python -m py_compile \
            src/fa3_scale_backend.py \
            src/fa3_accelerator_backend_probe.py \
            src/fa3_scale_backend_gate.py \
            tests/test_scale_backend.py \
            tests/test_scale_backend_integration.py \
            tests/test_scale_backend_gate.py
      - name: SCALE backend regressions
        env:
          PYTHONPATH: src
        run: |
          python -m unittest \
            tests.test_scale_backend \
            tests.test_scale_backend_integration \
            tests.test_scale_backend_gate
      - name: Canonical SCALE backend gate
        env:
          PYTHONPATH: src
        run: python src/fa3_scale_backend_gate.py --root "$GITHUB_WORKSPACE"
