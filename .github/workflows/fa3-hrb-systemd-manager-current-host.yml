name: FA3 HRB Systemd Manager Current Host

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fa3-hrb-systemd-manager-current-host
  cancel-in-progress: false

jobs:
  current-host:
    name: portable-current-host / hrb-systemd-manager
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile src/fa3_hrb_systemd_manager_current_host_gate.py evidence/collect-hrb-systemd-manager-current-host.py
      - name: Portable gate regressions
        run: PYTHONPATH=src python -m unittest tests.test_hrb_systemd_manager_current_host_gate -v
      - name: Collect live portable hardware and systemd evidence
        run: PYTHONPATH=src python evidence/collect-hrb-systemd-manager-current-host.py --root .
      - name: Validate current-host evidence fail closed
        run: ./bin/fa3-enforce hrb-systemd-manager-current-host
      - name: Upload evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-hrb-systemd-manager-current-host
          path: |
            evidence/receipts/hrb-systemd-manager-current-host.json
            reports/hrb-systemd-manager-current-host-gate-report.json
