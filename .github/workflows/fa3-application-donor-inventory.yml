name: FA3 Application Donor Inventory

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "canonical/FA3-AI-STUDIO-APP-CATALOG-001.json"
      - "canonical/FA3-GUI-SURFACE-REGISTRY-001.json"
      - "canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json"
      - "canonical/FA3-APPLICATION-DONOR-LINKS-001.json"
      - "canonical/FA3-CAPABILITY-MODEL-175-001.json"
      - "canonical/profiles/**"
      - "canonical/contracts/**"
      - "canonical/decisions/FA3-DEC-CAPABILITY-USAGE-GRAPH-2026-09-30.json"
      - "canonical/FA3-CAPABILITY-USAGE-GRAPH-CURRENT-HOST-IMPACT-001.json"
      - "canonical/FA3-TUTORIAL-SHARED-CAPABILITY-POLICY-001.json"
      - "canonical/FA3-TUTORIAL-SHARED-CAPABILITY-CURRENT-HOST-IMPACT-001.json"
      - "canonical/schemas/FA3-TUTORIAL-REFERENCE-SCHEMA-001.json"
      - "src/fa3_application_donor_index.py"
      - "src/fa3_capability_usage_graph.py"
      - "src/fa3_tutorial_reuse_planner.py"
      - "tests/test_application_donor_index.py"
      - "tests/test_capability_usage_graph.py"
      - "tests/test_tutorial_reuse_planner.py"
      - "bin/fa3-app-donor-index"
      - "bin/fa3-capability-map"
      - "bin/fa3-tutorial-reuse-plan"
      - ".github/workflows/fa3-application-donor-inventory.yml"

jobs:
  application-donor-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static application inventory gate
        run: python3 src/fa3_application_donor_index.py --check --summary

      - name: Derived donor capability consumer graph
        run: python3 src/fa3_capability_usage_graph.py --check --summary --output capability-usage-graph.json

      - name: Tutorial shared-capability materialization self-check
        run: python3 src/fa3_tutorial_reuse_planner.py --self-check --check

      - name: Automatically calculate exact donor-change impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "${BASE_SHA:-}" ] && git cat-file -e "$BASE_SHA:canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json" 2>/dev/null; then
            git show "$BASE_SHA:canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json" > "$RUNNER_TEMP/fa3-donor-before.json"
            python3 src/fa3_application_donor_index.py --check --previous-registry "$RUNNER_TEMP/fa3-donor-before.json" --output donor-impact.json > "$RUNNER_TEMP/fa3-donor-impact-summary.json"
            python3 src/fa3_capability_usage_graph.py --check --previous-registry "$RUNNER_TEMP/fa3-donor-before.json" --output capability-update-impact.json --summary
          else
            echo "Baseline donor registry unavailable; static inventory and capability graph still checked."
          fi

      - name: Publish application/capability impact reports
        uses: actions/upload-artifact@v4
        with:
          name: fa3-application-capability-impact
          path: |
            donor-impact.json
            capability-usage-graph.json
            capability-update-impact.json
          if-no-files-found: ignore

      - name: Application inventory regression and safety tests
        run: python3 -m unittest discover -s tests -p "test_application_donor_index.py" -v

      - name: Capability usage graph regression and fail-closed tests
        run: python3 -m unittest tests.test_capability_usage_graph -v

      - name: Tutorial reuse planner regression and fail-closed tests
        run: python3 -m unittest discover -s tests -p "test_tutorial_reuse_planner.py" -v
