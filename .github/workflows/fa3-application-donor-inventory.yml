name: FA3 Application Donor Inventory

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "canonical/FA3-AI-STUDIO-APP-CATALOG-001.json"
      - "canonical/FA3-GUI-SURFACE-REGISTRY-001.json"
      - "canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json"
      - "canonical/FA3-APPLICATION-DONOR-LINKS-001.json"
      - "src/fa3_application_donor_index.py"
      - "tests/test_application_donor_index.py"
      - "bin/fa3-app-donor-index"
      - ".github/workflows/fa3-application-donor-inventory.yml"
jobs:
  application-donor-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Static application inventory gate
        run: python3 src/fa3_application_donor_index.py --check --summary
      - name: Regression and safety negative tests
        run: python3 -m unittest discover -s tests -p "test_application_donor_index.py" -v
