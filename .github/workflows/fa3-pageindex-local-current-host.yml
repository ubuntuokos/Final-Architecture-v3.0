name: FA3 PageIndex Local Current Host

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/providers/FA3-PROVIDER-PAGEINDEX-LOCAL-001.json'
      - 'canonical/FA3-PAGEINDEX-LOCAL-RUNTIME-CONFORMANCE-001.json'
      - 'canonical/FA3-GATE-PAGEINDEX-LOCAL-CURRENT-HOST-001.json'
      - 'canonical/pageindex-local-current-host-enforcement.json'
      - 'canonical/mcp-capability-registry.json'
      - 'src/fa3_pageindex_local_*.py'
      - 'src/fa3_mcp_unix_client.py'
      - 'bin/fa3-pageindex-local-*'
      - 'deployment/pageindex-local/**'
      - 'evidence/collect-pageindex-local-current-host.py'
      - 'tests/test_pageindex_local_current_host.py'
      - '.github/workflows/fa3-pageindex-local-current-host.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fa3-pageindex-local-current-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: |
          python -m py_compile src/fa3_mcp_unix_client.py src/fa3_pageindex_local_gateway_adapter.py src/fa3_pageindex_local_service.py src/fa3_pageindex_local_evidence.py src/fa3_pageindex_local_runtime_probe.py src/fa3_pageindex_local_current_host_gate.py evidence/collect-pageindex-local-current-host.py
          bash -n bin/fa3-pageindex-local-bootstrap.sh
          bash -n bin/fa3-pageindex-local-install
      - name: Regression
        run: PYTHONPATH=src python -m unittest tests.test_pageindex_local_current_host tests.test_knowledge_hybrid_retrieval -v
      - name: Static current-host gate
        run: PYTHONPATH=src python src/fa3_pageindex_local_current_host_gate.py --root .

  real-execution:
    needs: regression
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove current-host runner
        run: bash bin/fa3-current-host-runner-doctor
      - name: Bootstrap pinned PageIndex runtime
        run: bash bin/fa3-pageindex-local-bootstrap.sh
      - name: Collect real local PageIndex evidence
        run: |
          set -o pipefail
          mkdir -p evidence/receipts reports/pageindex-local
          PYTHONPATH=src python3 evidence/collect-pageindex-local-current-host.py --output evidence/receipts/pageindex-local-current-host.json | tee reports/pageindex-local/collector.txt
      - name: Enforce fresh evidence
        run: |
          set -o pipefail
          PYTHONPATH=src python3 src/fa3_pageindex_local_current_host_gate.py --root . --require-evidence --receipt evidence/receipts/pageindex-local-current-host.json | tee reports/pageindex-local/gate.txt
      - name: Capture PageIndex service diagnostics
        if: always()
        run: |
          mkdir -p reports/pageindex-local
          systemctl --user status fa3-pageindex-local.service --no-pager > reports/pageindex-local/pageindex-local-status.txt 2>&1 || true
          systemctl --user status fa3-mcp-gateway.service --no-pager > reports/pageindex-local/mcp-gateway-status.txt 2>&1 || true
          journalctl --user -u fa3-pageindex-local.service -n 250 --no-pager > reports/pageindex-local/pageindex-local-journal.txt 2>&1 || true
          journalctl --user -u fa3-mcp-gateway.service -n 250 --no-pager > reports/pageindex-local/mcp-gateway-journal.txt 2>&1 || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-pageindex-local-current-host
          path: |
            evidence/receipts/pageindex-local-current-host.json
            reports/pageindex-local/**
          if-no-files-found: error
