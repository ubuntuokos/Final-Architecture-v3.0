name: FA3 temporary settings device materialization

on:
  push:
    branches:
      - fa3-gui-settings-devices-shortcuts-v1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa3-gui-settings-devices-shortcuts-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Patch shell wiring and GUI gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main = Path('apps/fa3-control-center/qml/Main.qml')
          text = main.read_text(encoding='utf-8')

          old = '''    property bool compactNavigation: false\n    property bool statusStripVisible: true\n'''
          new = '''    property bool compactNavigation: Boolean(fa3Preferences.value("appearance/compactNavigation", false))\n    property bool statusStripVisible: Boolean(fa3Preferences.value("appearance/statusStripVisible", true))\n    property string colorTheme: String(fa3Preferences.value("appearance/colorTheme", "Blue"))\n    property string navigationPosition: String(fa3Preferences.value("appearance/navigationBarPosition", "Left"))\n    property string shortcutDashboard: String(fa3Preferences.value("shortcuts/dashboard", "Ctrl+1"))\n    property string shortcutProjects: String(fa3Preferences.value("shortcuts/projects", "Ctrl+2"))\n    property string shortcutAiStudio: String(fa3Preferences.value("shortcuts/aiStudio", "Ctrl+3"))\n    property string shortcutSearch: String(fa3Preferences.value("shortcuts/search", "Ctrl+K"))\n    property string shortcutSettings: String(fa3Preferences.value("shortcuts/settings", "Ctrl+,"))\n    property string shortcutToggleStatus: String(fa3Preferences.value("shortcuts/toggleStatus", "Ctrl+Shift+S"))\n\n    function accentForTheme(name) {\n        if (name === "Cyan") return "#22d3ee"\n        if (name === "Green") return "#35e0a1"\n        if (name === "Magenta") return "#b778ff"\n        if (name === "Amber") return "#f0b14a"\n        return "#25a7ff"\n    }\n'''
          if old not in text:
              raise SystemExit('main property anchor not found')
          text = text.replace(old, new, 1)

          old = '    property color accent: "#25a7ff"\n'
          new = '    property color accent: accentForTheme(window.colorTheme)\n'
          if old not in text:
              raise SystemExit('accent anchor not found')
          text = text.replace(old, new, 1)

          old = '''    component Panel: Rectangle {\n'''
          insert = '''    Connections {\n        target: fa3Preferences\n        function onPreferenceChanged(key, value) {\n            if (key === "appearance/colorTheme") window.colorTheme = String(value)\n            else if (key === "appearance/navigationBarPosition") window.navigationPosition = String(value)\n            else if (key === "appearance/compactNavigation") window.compactNavigation = Boolean(value)\n            else if (key === "appearance/statusStripVisible") window.statusStripVisible = Boolean(value)\n            else if (key === "shortcuts/dashboard") window.shortcutDashboard = String(value)\n            else if (key === "shortcuts/projects") window.shortcutProjects = String(value)\n            else if (key === "shortcuts/aiStudio") window.shortcutAiStudio = String(value)\n            else if (key === "shortcuts/search") window.shortcutSearch = String(value)\n            else if (key === "shortcuts/settings") window.shortcutSettings = String(value)\n            else if (key === "shortcuts/toggleStatus") window.shortcutToggleStatus = String(value)\n        }\n    }\n\n    Shortcut { sequence: window.shortcutDashboard; context: Qt.ApplicationShortcut; onActivated: { window.webWorkspaceOpen = false; window.selectedIndex = 0 } }\n    Shortcut { sequence: window.shortcutProjects; context: Qt.ApplicationShortcut; onActivated: { window.webWorkspaceOpen = false; window.selectedIndex = 2 } }\n    Shortcut { sequence: window.shortcutAiStudio; context: Qt.ApplicationShortcut; onActivated: { window.webWorkspaceOpen = false; window.selectedIndex = 3 } }\n    Shortcut { sequence: window.shortcutSearch; context: Qt.ApplicationShortcut; onActivated: { window.webWorkspaceOpen = false; window.selectedIndex = 7 } }\n    Shortcut { sequence: window.shortcutSettings; context: Qt.ApplicationShortcut; onActivated: { window.webWorkspaceOpen = false; window.selectedIndex = 15 } }\n    Shortcut { sequence: window.shortcutToggleStatus; context: Qt.ApplicationShortcut; onActivated: { window.statusStripVisible = !window.statusStripVisible; fa3Preferences.setValue("appearance/statusStripVisible", window.statusStripVisible) } }\n\n    component Panel: Rectangle {\n'''
          if old not in text:
              raise SystemExit('component Panel anchor not found')
          text = text.replace(old, insert, 1)

          old = '''    RowLayout {\n        anchors.fill: parent\n        spacing: 0\n'''
          new = '''    RowLayout {\n        anchors.fill: parent\n        spacing: 0\n        LayoutMirroring.enabled: window.navigationPosition === "Right"\n        LayoutMirroring.childrenInherit: false\n'''
          if old not in text:
              raise SystemExit('outer RowLayout anchor not found')
          text = text.replace(old, new, 1)

          old = '''                    onCompactNavigationRequested: function(enabled) { window.compactNavigation = enabled }\n                    onStatusStripRequested: function(enabled) { window.statusStripVisible = enabled }\n'''
          new = '''                    onCompactNavigationRequested: function(enabled) { window.compactNavigation = enabled; fa3Preferences.setValue("appearance/compactNavigation", enabled) }\n                    onStatusStripRequested: function(enabled) { window.statusStripVisible = enabled; fa3Preferences.setValue("appearance/statusStripVisible", enabled) }\n'''
          if old not in text:
              raise SystemExit('settings signal anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''        {title: "Naplózás", detail: "Retention, export és archive preferenciák", category: "SETTING", pageIndex: 15}\n'''
          extra = '''        {title: "Naplózás", detail: "Retention, export és archive preferenciák", category: "SETTING", pageIndex: 15},\n        {title: "Appearance", detail: "Színes téma és Navigation Bar position", category: "SETTING", pageIndex: 15},\n        {title: "Chat Style", detail: "Chat nézet, tipográfia és message-flow", category: "SETTING", pageIndex: 15},\n        {title: "Reasoning", detail: "Reasoning blokk megjelenítési preferenciák", category: "SETTING", pageIndex: 15},\n        {title: "Gyorsbillentyűk", detail: "FA3 Control Center shortcut beállítások", category: "SETTING", pageIndex: 15},\n        {title: "CPU GPU NPU DGX", detail: "Compute és accelerator policy", category: "SETTING", pageIndex: 15},\n        {title: "Webkamera Nyomtató Scanner", detail: "Periféria felderítés és adapter policy", category: "SETTING", pageIndex: 15},\n        {title: "MIDI GIMP Ardour", detail: "MIDI és control-surface mapping", category: "SETTING", pageIndex: 15}\n'''
          if anchor not in text:
              raise SystemExit('search index settings anchor not found')
          text = text.replace(anchor, extra, 1)
          main.write_text(text, encoding='utf-8')

          gate = Path('src/fa3_gui_gate.py')
          g = gate.read_text(encoding='utf-8')
          old = '''    "settings_qml": ROOT / "apps/fa3-control-center/qml/SystemSettingsPage.qml",\n    "rtd_qml": ROOT / "apps/fa3-control-center/qml/RtdProvidersPage.qml",\n'''
          new = '''    "settings_qml": ROOT / "apps/fa3-control-center/qml/SystemSettingsPage.qml",\n    "rtd_qml": ROOT / "apps/fa3-control-center/qml/RtdProvidersPage.qml",\n    "preference_store": ROOT / "apps/fa3-control-center/src/PreferenceStore.cpp",\n    "device_model": ROOT / "apps/fa3-control-center/src/SystemDeviceModel.cpp",\n'''
          if old not in g:
              raise SystemExit('gate required anchor not found')
          g = g.replace(old, new, 1)

          old = '''    if "compactNavigationRequested" not in settings_qml or "statusStripRequested" not in settings_qml or "ChangeSet-tervezet" not in settings_qml or "Security & Approvals megnyitása" not in settings_qml: failures.append("qml-system-settings-interaction-missing")\n'''
          new = '''    if "compactNavigationRequested" not in settings_qml or "statusStripRequested" not in settings_qml or "ChangeSet-tervezet" not in settings_qml or "Security & Approvals megnyitása" not in settings_qml: failures.append("qml-system-settings-interaction-missing")\n    for token in ["Appearance", "Chat Style", "Reasoning", "Gyorsbillentyűk", "CPU", "GPU", "NPU", "DGX", "Webkamera", "Nyomtató", "Scanner", "MIDI", "GIMP", "Ardour", "Auto-latch onto generating message"]:\n        if token not in settings_qml: failures.append(f"qml-system-settings-surface-missing:{token}")\n    preference_cpp = REQUIRED["preference_store"].read_text(encoding="utf-8")\n    if "QSettings" not in preference_cpp or "normalizeShortcut" not in preference_cpp or "preferenceChanged" not in preference_cpp: failures.append("settings-preference-store-missing")\n    device_cpp = REQUIRED["device_model"].read_text(encoding="utf-8")\n    for token in ["QPrinterInfo", "/sys/class/accel", "/dev/video", "/dev/snd", "DGX", "ADAPTER-GATED"]:\n        if token not in device_cpp: failures.append(f"settings-device-discovery-missing:{token}")\n    for token in ["accentForTheme", "navigationBarPosition", "Shortcut {", "fa3Preferences.setValue"]:\n        if token not in qml: failures.append(f"qml-persistent-settings-shell-missing:{token}")\n'''
          if old not in g:
              raise SystemExit('gate settings anchor not found')
          g = g.replace(old, new, 1)

          old = '''    cmake = REQUIRED["cmake"].read_text(encoding="utf-8")\n    if "Qt6" not in cmake or "qt_add_qml_module" not in cmake: failures.append("qt6-qml-build-contract-missing")\n'''
          new = '''    cmake = REQUIRED["cmake"].read_text(encoding="utf-8")\n    if "Qt6" not in cmake or "qt_add_qml_module" not in cmake: failures.append("qt6-qml-build-contract-missing")\n    if "PrintSupport" not in cmake or "PreferenceStore.cpp" not in cmake or "SystemDeviceModel.cpp" not in cmake: failures.append("settings-device-build-wiring-missing")\n'''
          if old not in g:
              raise SystemExit('gate cmake anchor not found')
          g = g.replace(old, new, 1)

          old = '''    for token in FORBIDDEN_BACKEND_TOKENS:\n        if token in model_cpp: failures.append(f"backend-forbidden-token:{token}")\n'''
          new = '''    for token in FORBIDDEN_BACKEND_TOKENS:\n        if token in model_cpp or token in device_cpp or token in preference_cpp: failures.append(f"backend-forbidden-token:{token}")\n'''
          if old not in g:
              raise SystemExit('forbidden backend anchor not found')
          g = g.replace(old, new, 1)
          gate.write_text(g, encoding='utf-8')
          PY

          temp_workflow=".github/workflows/fa3-settings-devices-materialize-temp.yml"
          saved="/tmp/fa3-settings-devices-materialize-temp.yml"
          mv "$temp_workflow" "$saved"
          python src/fa3_release_projection_regenerate.py
          mv "$saved" "$temp_workflow"

          git config user.name "fa3-gui-settings"
          git config user.email "fa3-gui-settings@users.noreply.github.com"
          git add apps/fa3-control-center/qml/Main.qml src/fa3_gui_gate.py canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git commit -m "FA3 GUI: wire persistent settings shortcuts and device surfaces"
          git push origin HEAD:fa3-gui-settings-devices-shortcuts-v1
