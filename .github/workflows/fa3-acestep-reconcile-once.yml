name: FA3 ACE-Step one-shot release reconciliation

on:
  push:
    branches:
      - fa3/acestep-hardening-2026-09-10

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa3/acestep-hardening-2026-09-10
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create clean pre-projection snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fa3-acestep-reconcile-once.yml
          git commit -m 'chore: remove one-shot ACE-Step reconciler'
      - name: Regenerate unified projection from committed snapshot
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="$(git rev-parse HEAD)"
          SNAPSHOT="$SNAPSHOT" python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, 'tools')
          import fa3_buzz_global_reconcile as common

          snapshot = os.environ['SNAPSHOT']
          common.regenerate_release(snapshot)
          path = Path(common.RELEASE)
          release = json.loads(path.read_text(encoding='utf-8'))
          release['ace_step_hardening_reconciliation'] = {
              'decision_id': 'FA3-DEC-ACE-STEP-HARDENING-2026-09-10',
              'provider_id': 'FA3-PROVIDER-ACE-STEP-001',
              'profile_id': 'FA3-MUSIC-001',
              'gate_id': 'FA3-ACE-STEP-GATESET-001',
              'reference_evidence': 'evidence/reference/ace-step-upstream-2026-09-10.json',
              'reconciliation_status': 'GLOBAL_PROJECTION_RECONCILED_UPSTREAM_RISKS_TRACKED_CURRENT_HOST_PENDING',
              'latest_formal_upstream_release': 'v0.1.8',
              'open_upstream_prs_are_promotion_evidence': False,
              'numeric_integrity_fail_closed': True,
              'cpu_offload_device_dtype_coherence_required': True,
              'current_host_runtime_evidence': 'PENDING_REAL_CURRENT_HOST_EXECUTION',
              'new_capabilities': 0,
              'new_architectural_authorities': 0,
              'capability_count_after': 143,
          }
          verification = release.setdefault('manifest_verification', {})
          verification['ace_step_hardening_reconciliation_generator'] = 'one-shot/common.regenerate_release'
          verification['ace_step_hardening_deterministic_regeneration_pass'] = True
          verification['ace_step_hardening_snapshot_head'] = snapshot
          path.write_text(json.dumps(release, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git commit -m 'FA3: reconcile ACE-Step hardening release projection'
      - name: Verify projection before push
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest tests.test_release_projection -v
          PYTHONPATH=src python -m unittest tests.test_acestep_gate -v
      - name: Push reconciled branch
        run: git push origin HEAD:fa3/acestep-hardening-2026-09-10
