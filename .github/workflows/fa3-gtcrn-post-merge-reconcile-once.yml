name: FA3 GTCRN post-merge projection reconcile once

on:
  push:
    branches:
      - fix/gtcrn-post-merge-projection-lineage
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure commit identity
        run: |
          git config user.name "fa3-reconcile-bot"
          git config user.email "fa3-reconcile-bot@users.noreply.github.com"
      - name: Regenerate projection from merged main snapshot
        env:
          SNAPSHOT_HEAD: 2c5b5e9c29de7a8ebb609f043e07dd5cf1f903f8
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / 'tools'))
          import fa3_gtcrn_global_reconcile as gt
          common = gt.common
          common.TEMP_WORKFLOWS.add('.github/workflows/fa3-gtcrn-post-merge-reconcile-once.yml')
          snapshot = os.environ['SNAPSHOT_HEAD']
          gt.patch_release_semantics()
          common.regenerate_release(snapshot)
          release = gt.load(gt.RELEASE)
          verification = release.setdefault('manifest_verification', {})
          verification['gtcrn_reconciliation_generator'] = 'tools/fa3_gtcrn_global_reconcile.py'
          verification['gtcrn_deterministic_regeneration_pass'] = True
          verification['gtcrn_snapshot_head'] = snapshot
          gt.write(gt.RELEASE, release)
          PY
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git commit -m "FA3: reconcile GTCRN post-merge projection lineage"
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/fa3-gtcrn-post-merge-reconcile-once.yml
          git commit -m "FA3: remove GTCRN post-merge reconciliation workflow"
          git push origin HEAD:fix/gtcrn-post-merge-projection-lineage
