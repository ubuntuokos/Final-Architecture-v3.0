name: FA3 Controlled Release Projection Reconciliation

on:
  push:
    branches:
      - 'fa3/ffmpeg-current-host-audit-fix-2026-09-03'
    paths:
      - 'tools/fa3_reconcile_ffmpeg_current_host_audit.py'
      - '.github/workflows/fa3-release-reconcile-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip reconcile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile global FFmpeg audit bindings
        run: |
          set -euo pipefail
          python tools/fa3_reconcile_ffmpeg_current_host_audit.py bindings
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canonical/enforcement-policy.json evidence/evidence-registry.json
          if ! git diff --cached --quiet; then
            git commit -m 'FA3: reconcile audited FFmpeg global evidence bindings'
          fi
      - name: Reanchor unified release projection
        run: |
          set -euo pipefail
          SNAPSHOT="$(git rev-parse HEAD)"
          python tools/fa3_reconcile_ffmpeg_current_host_audit.py projection --snapshot "$SNAPSHOT"
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          if ! git diff --cached --quiet; then
            git commit -m 'FA3: reanchor audited FFmpeg release projection [skip reconcile]'
          fi
      - name: Verify reconciled gates before push
        run: |
          set -euo pipefail
          chmod +x bin/fa3-enforce
          PYTHONPATH=src python -m unittest tests.test_ffmpeg_ai_gate tests.test_ffmpeg_ai_current_host_gate tests.test_current_host_projection tests.test_release_projection -v
          ./bin/fa3-enforce ffmpeg-ai
          ./bin/fa3-enforce hardware-portability
          ./bin/fa3-enforce release-projection
      - name: Push reconciled branch
        run: git push origin HEAD:${{ github.ref_name }}
