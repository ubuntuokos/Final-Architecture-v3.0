name: FA3 temporary RTD Providers GUI materialization

on:
  push:
    branches:
      - fa3-gui-rtd-providers-v1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa3-gui-rtd-providers-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize RTD Providers GUI
        shell: bash
        run: |
          set -euo pipefail
          python tools/fa3_rtd_gui_materialize_temp.py
          git rm .github/workflows/fa3-rtd-gui-materialize-temp.yml tools/fa3_rtd_gui_materialize_temp.py
          python -m unittest tests.test_fa3_gui_gate
          git config user.name "fa3-gui-materializer"
          git config user.email "fa3-gui-materializer@users.noreply.github.com"
          git add -A
          git commit -m "feat(gui): add governed RTD Providers workspace"
          SNAPSHOT_HEAD="$(git rev-parse HEAD)"
          PYTHONPATH=src python src/fa3_release_projection_regenerate.py --snapshot-head "$SNAPSHOT_HEAD"
          if ! git diff --quiet -- canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json; then
            git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
            git commit -m "FA3 release projection: reconcile RTD Providers GUI"
          fi
          git push origin HEAD:fa3-gui-rtd-providers-v1
