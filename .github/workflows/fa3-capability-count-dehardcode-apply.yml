name: FA3 Capability Count De-hardcode Apply

on:
  push:
    branches:
      - "fa3/capability-count-dehardcode"

permissions:
  contents: write

concurrency:
  group: fa3-capability-count-dehardcode-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[dehardcode-applied]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply executable baseline migration
        run: python scripts/fa3_apply_capability_count_dehardcode.py --root .
      - name: Remove one-shot apply workflow
        run: rm .github/workflows/fa3-capability-count-dehardcode-apply.yml
      - name: Validate migrated source
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile src/fa3_release_baseline.py src/fa3_capability_count_dehardcode_gate.py src/fa3_enforce.py src/fa3_governance_tiering_gate.py src/fa3_release_projection_gate.py src/fa3_release_evidence_scope_gate.py scripts/fa3_reconcile_release_projection.py
          python -m unittest tests.test_capability_count_dehardcode tests.test_governance_tiering_gate tests.test_release_evidence_scope_gate -v
          python src/fa3_capability_count_dehardcode_gate.py --root .
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git commit -m "FA3-CAPABILITY-COUNT-DEHARDCODE-001: migrate executable count lookups [dehardcode-applied]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
