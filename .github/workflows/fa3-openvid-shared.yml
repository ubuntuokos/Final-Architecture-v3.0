name: CFA3 OpenVid Shared FAST COMPOSE
on:
  pull_request:
    paths:
      - 'canonical/FA3-GATE-OPENVID-001.json'
      - 'canonical/contracts/FA3-BROWSER-LOCAL-VIDEO-COMPOSITING-CONTRACTS-001.json'
      - 'canonical/decisions/FA3-DEC-OPENVID-BROWSER-LOCAL-COMPOSITING-2026-09-04.json'
      - 'canonical/providers/FA3-PROVIDER-OPENVID-001.json'
      - 'canonical/openvid-*.json'
      - 'canonical/releases/FA3-RELEASE-PROJECTION-OPENVID-2026-09-04.json'
      - 'canonical/FA3-APPLICATION-DONOR-LINKS-001.json'
      - 'canonical/assessments/CFA3-OPENVID-SHARED-REUSE-ASSESSMENT-2026-10-08.json'
      - 'src/fa3_openvid_gate.py'
      - 'tests/test_openvid_gate.py'
      - '.github/workflows/fa3-openvid-shared.yml'
  push:
    branches: [main]
    paths: ['src/fa3_openvid_gate.py','tests/test_openvid_gate.py']
permissions:
  contents: read
jobs:
  openvid-shared-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -p test_openvid_gate.py -v
      - run: python3 src/fa3_openvid_gate.py --root . --output /tmp/openvid-shared-e2e-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: openvid-shared-static-evidence
          path: /tmp/openvid-shared-e2e-report.json
