name: FA3 Permanent Canonical + Promotion Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fa3-permanent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-regression:
    name: canonical-regression / P0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare gate
        run: chmod +x bin/fa3-enforce
      - name: Syntax check
        run: python -m py_compile src/fa3_enforce.py src/fa3_terax_gate.py src/fa3_kaneo_gate.py src/fa3_kanboard_gate.py src/fa3_buzz_gate.py src/fa3_xcmd_gate.py src/fa3_ai_engineering_gate.py src/fa3_external_api_discovery_gate.py src/fa3_autogpt_gate.py src/fa3_ai_infra_guard_gate.py src/fa3_ai_infra_guard_adapter.py src/fa3_munder_difflin_gate.py src/fa3_developer_agent_coordination.py src/fa3_developer_agent_coordination_gate.py src/fa3_codex_adapter.py src/fa3_codex_gate.py src/fa3_modular_gate.py src/fa3_inference_portability_gate.py src/fa3_model_manager_gate.py src/fa3_modular_runtime.py src/fa3_modular_current_host_gate.py src/fa3_demucs_gate.py src/fa3_demucs_provider.py src/fa3_demucs_current_host_gate.py src/fa3_acestep_gate.py src/fa3_blackhole_kdenlive.py src/fa3_blackhole_kdenlive_gate.py src/fa3_kdenlive_editorial_gate.py src/fa3_whisper_stt_provider.py src/fa3_whisper_stt_gate.py src/fa3_release_projection_gate.py src/fa3_mentor_gate.py src/fa3_presenton_gate.py evidence/collect-terax-current-host.py evidence/collect-modular-current-host.py evidence/collect-demucs-current-host.py evidence/collect-blackhole-kdenlive-current-host.py evidence/collect-whisper-stt-current-host.py evidence/collect-presenton-current-host.py evidence/collect-developer-agent-coordination-e2e.py evidence/collect-codex-current-host.py evidence/collect-ai-infra-guard-current-host.py
      - name: Executable invariant tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Unified post-v3.0.11 release projection gate
        run: ./bin/fa3-enforce release-projection
      - name: Terax immutable reference gate
        run: ./bin/fa3-enforce --ci-only terax
      - name: Kaneo mandatory canonical invariant gate
        run: ./bin/fa3-enforce kaneo
      - name: Kanboard authorization-event-plugin regression gate
        run: ./bin/fa3-enforce kanboard
      - name: Buzz authority-separation regression gate
        run: ./bin/fa3-enforce buzz
      - name: X-CMD mandatory security/boundary regression gate
        run: ./bin/fa3-enforce xcmd
      - name: AI engineering source cross-cutting regression gate
        run: ./bin/fa3-enforce ai-engineering
      - name: External API/MCP controlled discovery regression gate
        run: ./bin/fa3-enforce external-api-discovery
      - name: AutoGPT agentic workflow/boundary regression gate
        run: ./bin/fa3-enforce autogpt
      - name: AI-Infra-Guard security validation regression gate
        run: ./bin/fa3-enforce ai-infra-guard
      - name: Munder Difflin multi-agent coordination regression gate
        run: ./bin/fa3-enforce munder-difflin
      - name: Collect developer-agent coordination reference-runtime E2E evidence
        run: PYTHONPATH=src python evidence/collect-developer-agent-coordination-e2e.py --root .
      - name: Developer-agent coordination contract/runtime E2E gate
        run: ./bin/fa3-enforce developer-agent-coordination
      - name: Codex adapter/admission regression gate
        run: ./bin/fa3-enforce codex
      - name: Modular MAX/Mojo boundary-lineage-cache regression gate
        run: ./bin/fa3-enforce modular
      - name: Inference portability compatibility/provider regression gate
        run: ./bin/fa3-enforce inference-portability
      - name: Model Manager / StabilityMatrix canonical regression gate
        run: ./bin/fa3-enforce model-manager
      - name: Modular MAX/Mojo executable runtime conformance
        run: ./bin/fa3-enforce modular-provider
      - name: Demucs mandatory canonical invariant gate
        run: ./bin/fa3-enforce demucs
      - name: Demucs executable provider conformance
        run: ./bin/fa3-enforce demucs-provider
      - name: ACE-Step mandatory provider invariant gate
        run: ./bin/fa3-enforce acestep
      - name: Kdenlive editorial canonical gate
        run: ./bin/fa3-enforce kdenlive-editorial
      - name: Blackhole Kdenlive integration gate
        run: ./bin/fa3-enforce blackhole-kdenlive
      - name: Whisper STT mandatory provider gate
        run: ./bin/fa3-enforce whisper-stt
      - name: Whisper STT executable provider conformance
        run: ./bin/fa3-enforce whisper-stt-provider
      - name: FA3 Mentor mandatory canonical/regression gate
        run: ./bin/fa3-enforce mentor
      - name: Presenton provider/deployment/artifact regression gate
        run: ./bin/fa3-enforce presenton
      - name: Canonical static enforcement
        run: ./bin/fa3-enforce static
      - name: Upload static report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-static-gate-report
          path: |
            reports/static-gate-report.json
            reports/release-projection-gate-report.json
            reports/terax-gate-report.json
            reports/kaneo-gate-report.json
            reports/kanboard-gate-report.json
            reports/buzz-gate-report.json
            reports/xcmd-gate-report.json
            reports/ai-engineering-gate-report.json
            reports/external-api-discovery-gate-report.json
            reports/autogpt-gate-report.json
            reports/ai-infra-guard-gate-report.json
            reports/munder-difflin-gate-report.json
            reports/developer-agent-coordination-gate-report.json
            reports/developer-agent-coordination-e2e-report.json
            evidence/receipts/developer-agent-coordination-ci-e2e.json
            reports/codex-gate-report.json
            reports/modular-gate-report.json
            reports/inference-portability-gate-report.json
            reports/model-manager-gate-report.json
            reports/modular-runtime-conformance-report.json
            reports/demucs-gate-report.json
            reports/demucs-provider-conformance-report.json
            reports/ace-step-gate-report.json
            reports/kdenlive-editorial-gate-report.json
            reports/blackhole-kdenlive-gate-report.json
            reports/blackhole-kdenlive-conformance-report.json
            reports/whisper-stt-gate-report.json
            reports/whisper-stt-conformance-report.json
            reports/mentor-gate-report.json
            reports/presenton-gate-report.json

  promotion-safety:
    name: promotion-safety / fail-closed
    needs: canonical-regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare gate
        run: chmod +x bin/fa3-enforce
      - name: Prove runtime promotion cannot bypass evidence
        shell: bash
        run: |
          set +e
          ./bin/fa3-enforce promote
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Promotion is valid: all runtime evidence and all 19 acceptance criteria are PASS."
          elif [ "$rc" -eq 2 ]; then
            echo "Promotion correctly blocked by fail-closed runtime evidence/acceptance gate."
          else
            exit "$rc"
          fi
      - name: Upload promotion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-promotion-reports
          path: |
            reports/runtime-gate-report.json
            reports/terax-gate-report.json
            reports/kaneo-gate-report.json
            reports/kanboard-gate-report.json
            reports/xcmd-gate-report.json
            reports/ai-engineering-gate-report.json
            reports/autogpt-gate-report.json
            reports/ai-infra-guard-gate-report.json
            reports/munder-difflin-gate-report.json
            reports/developer-agent-coordination-gate-report.json
            reports/developer-agent-coordination-e2e-report.json
            reports/codex-gate-report.json
            reports/inference-portability-gate-report.json
            reports/model-manager-gate-report.json
            reports/presenton-gate-report.json
            acceptance/acceptance-report.json
            promotion/runtime-status.json
