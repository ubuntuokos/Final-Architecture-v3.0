name: FA3 Communications & Contacts Shared

on:
  pull_request:
    paths:
      - "apps/fa3-communications-hub/**"
      - "canonical/FA3-COMMUNICATIONS-CONTACTS-*.json"
      - "canonical/FA3-GATE-COMMUNICATIONS-CONTACTS-SHARED-001.json"
      - "canonical/contracts/FA3-COMMUNICATIONS-CONTACTS-CONTRACTS-001.json"
      - "canonical/assessments/FA3-COMMUNICATIONS-CONTACTS-SHARED-REUSE-ASSESSMENT-001.json"
      - "canonical/intents/FA3-COMMUNICATIONS-CONTACTS-SHARED-APPLICATION-INTENT-001.json"
      - "canonical/decisions/FA3-DEC-COMMUNICATIONS-CONTACTS-SHARED-2026-09-30.json"
      - "canonical/FA3-SHARED-CAPABILITY-FABRIC-001.json"
      - "canonical/contracts/FA3-SHARED-CAPABILITY-CONTRACTS-001.json"
      - "src/fa3_communications_contacts.py"
      - "src/fa3_communications_contacts_gate.py"
      - "src/fa3_shared_capability_gate.py"
      - "src/fa3_enforce.py"
      - "tests/test_communications_contacts.py"
      - "tests/test_communications_hub_ui.py"
      - "tests/test_shared_capability_fabric.py"
      - ".github/workflows/fa3-communications-contacts-shared.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  communications-contacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax
        run: python -m py_compile src/fa3_communications_contacts.py src/fa3_communications_contacts_gate.py src/fa3_shared_capability_gate.py
      - name: Targeted tests
        run: PYTHONPATH=src python -m unittest tests.test_communications_contacts tests.test_communications_hub_ui tests.test_shared_capability_fabric -v
      - name: Shared capability gate
        run: ./bin/fa3-enforce shared-capability-fabric
      - name: Communications gate
        run: ./bin/fa3-enforce communications-contacts
      - name: Mandatory gate registry
        run: ./bin/fa3-enforce gate-registry
