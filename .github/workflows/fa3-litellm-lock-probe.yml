name: FA3 LiteLLM OSS Runtime Probe

on:
  push:
    paths:
      - ".github/workflows/fa3-litellm-lock-probe.yml"

permissions:
  contents: read

jobs:
  resolve-and-probe:
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve hashed OSS runtime and execute loopback E2E
        shell: bash
        run: |
          set -euo pipefail
          PY="$(command -v python3.13 || true)"
          test -n "$PY" || { echo "python3.13 required for current-host lock target" >&2; exit 2; }
          TMP="$(mktemp -d)"
          trap 'jobs -pr | xargs -r kill >/dev/null 2>&1 || true; rm -rf "$TMP"' EXIT
          "$PY" -m venv "$TMP/resolver"
          "$TMP/resolver/bin/python" -m pip install --disable-pip-version-check --upgrade 'pip==26.0.1'
          cat >"$TMP/roots.txt" <<'REQ'
          litellm==1.102.0
          fastapi>=0.136.3,<1.0
          uvicorn>=0.33.0,<1.0
          pyyaml>=6.0.3,<7.0
          orjson>=3.11.6,<4.0
          backoff>=2.2.1,<3.0
          apscheduler>=3.11.2,<4.0
          PyJWT>=2.13.0,<3.0
          python-multipart>=0.0.27,<1.0
          cryptography>=49.0.0,<51.0
          pynacl>=1.6.2,<2.0
          websockets>=15.0.1,<16.0
          rich>=13.9.4,<14.0
          REQ
          "$TMP/resolver/bin/python" -m pip install \
            --dry-run --ignore-installed --only-binary=:all: \
            --index-url https://pypi.org/simple \
            --report "$TMP/report.json" -r "$TMP/roots.txt"
          "$TMP/resolver/bin/python" - "$TMP/report.json" "$TMP/runtime.lock" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          rows=[]
          for item in sorted(p["install"],key=lambda x:x["metadata"]["name"].lower()):
              meta=item["metadata"]
              sha=item.get("download_info",{}).get("archive_info",{}).get("hashes",{}).get("sha256")
              if not sha:
                  raise SystemExit(f"missing sha256 for {meta['name']}=={meta['version']}")
              rows.append(f"{meta['name']}=={meta['version']} --hash=sha256:{sha}")
          open(sys.argv[2],"w",encoding="utf-8").write("\n".join(rows)+"\n")
          PY
          "$PY" -m venv "$TMP/runtime"
          "$TMP/runtime/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --index-url https://pypi.org/simple \
            -r "$TMP/runtime.lock"
          if "$TMP/runtime/bin/python" - <<'PY'
          import importlib.metadata as m
          assert m.version("litellm")=="1.102.0"
          try:
              m.version("litellm-enterprise")
          except m.PackageNotFoundError:
              pass
          else:
              raise SystemExit("proprietary litellm-enterprise unexpectedly installed")
          PY
          then :; fi
          cat >"$TMP/stub.py" <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
          class H(BaseHTTPRequestHandler):
              def log_message(self,*a): pass
              def out(self,obj):
                  raw=json.dumps(obj).encode()
                  self.send_response(200); self.send_header("Content-Type","application/json")
                  self.send_header("Content-Length",str(len(raw))); self.end_headers(); self.wfile.write(raw)
              def do_GET(self):
                  if self.path=="/v1/models": self.out({"object":"list","data":[{"id":"stub-model","object":"model"}]})
                  else: self.send_error(404)
              def do_POST(self):
                  n=int(self.headers.get("Content-Length","0")); self.rfile.read(n)
                  if self.path=="/v1/chat/completions":
                      self.out({"id":"stub","object":"chat.completion","model":"stub-model","choices":[{"index":0,"message":{"role":"assistant","content":"FA3_OSS_PROXY_PASS"},"finish_reason":"stop"}],"usage":{"prompt_tokens":1,"completion_tokens":1,"total_tokens":2}})
                  else: self.send_error(404)
          ThreadingHTTPServer(("127.0.0.1",18081),H).serve_forever()
          PY
          "$TMP/runtime/bin/python" "$TMP/stub.py" &
          cat >"$TMP/config.yaml" <<'YAML'
          model_list:
            - model_name: fa3-probe
              litellm_params:
                model: openai/stub-model
                api_base: http://127.0.0.1:18081/v1
                api_key: fa3-local-nonsecret
          general_settings:
            master_key: os.environ/FA3_PROBE_MASTER_KEY
          YAML
          export FA3_PROBE_MASTER_KEY="fa3-probe-master-key-not-production"
          "$TMP/runtime/bin/litellm" --config "$TMP/config.yaml" --host 127.0.0.1 --port 18080 --telemetry False >"$TMP/litellm.log" 2>&1 &
          PROXY_PID=$!
          (
            sleep 3
            if ! kill -0 "$PROXY_PID" 2>/dev/null; then
              echo "FA3_LITELLM_STARTUP_LOG_BEGIN"
              cat "$TMP/litellm.log" || true
              echo "FA3_LITELLM_STARTUP_LOG_END"
            fi
          ) &
          "$TMP/runtime/bin/python" - <<'PY'
          import json,time,urllib.request
          base="http://127.0.0.1:18080"
          headers={"Authorization":"Bearer fa3-probe-master-key-not-production","Content-Type":"application/json"}
          last=None
          for _ in range(120):
              try:
                  req=urllib.request.Request(base+"/v1/models",headers=headers)
                  with urllib.request.urlopen(req,timeout=2) as r:
                      data=json.load(r)
                  assert any(x.get("id")=="fa3-probe" for x in data.get("data",[]))
                  break
              except Exception as e:
                  last=e; time.sleep(.25)
          else:
              raise SystemExit(f"proxy did not become ready: {last!r}")
          body=json.dumps({"model":"fa3-probe","messages":[{"role":"user","content":"probe"}],"max_tokens":8}).encode()
          req=urllib.request.Request(base+"/v1/chat/completions",data=body,headers=headers,method="POST")
          with urllib.request.urlopen(req,timeout=15) as r:
              data=json.load(r)
          text=data["choices"][0]["message"]["content"]
          assert text=="FA3_OSS_PROXY_PASS",data
          print("FA3_OSS_PROXY_E2E_PASS")
          PY
          if ! kill -0 "$PROXY_PID" 2>/dev/null; then
            echo "FA3_LITELLM_STARTUP_LOG_BEGIN"
            cat "$TMP/litellm.log" || true
            echo "FA3_LITELLM_STARTUP_LOG_END"
            exit 3
          fi
          kill "$PROXY_PID"
          wait "$PROXY_PID" || true
          echo "FA3_LITELLM_OSS_LOCK_BEGIN"
          cat "$TMP/runtime.lock"
          echo "FA3_LITELLM_OSS_LOCK_END"
          echo "FA3_LITELLM_OSS_LOCK_SHA256=$(sha256sum "$TMP/runtime.lock" | awk '{print $1}')"
          echo "FA3_LITELLM_OSS_LOCK_COUNT=$(wc -l < "$TMP/runtime.lock")"
