name: FA3 temporary Language Control restore

on:
  push:
    branches:
      - fa3-gui-restore-language-control

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa3-gui-restore-language-control
          fetch-depth: 0
          persist-credentials: true
      - name: Restore Language Control launcher, drawer and regression gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('apps/fa3-control-center/qml/Main.qml')
          main = main_path.read_text(encoding='utf-8')

          shortcut_anchor = '    Shortcut { sequence: window.shortcutDashboard; context: Qt.ApplicationShortcut; onActivated: { window.closeTransientWorkspaces(); window.selectedIndex = 0 } }\n'
          language_shortcut = '    Shortcut { sequence: "Ctrl+Shift+L"; context: Qt.ApplicationShortcut; onActivated: languageDrawer.open() }\n'
          if language_shortcut not in main:
              if shortcut_anchor not in main:
                  raise SystemExit('shortcut anchor missing')
              main = main.replace(shortcut_anchor, language_shortcut + shortcut_anchor, 1)

          toolbar_anchor = '''                    Item { Layout.fillWidth: true }\n                    Label { text: "CANONICAL"; color: window.accent; font.pixelSize: 9; font.bold: true }\n'''
          language_button = '''                    ToolButton {\n                        id: languageButton\n                        text: "文/A"\n                        onClicked: languageDrawer.open()\n                        ToolTip.visible: hovered\n                        ToolTip.text: "Tolmács / Nyelvi híd · Ctrl+Shift+L"\n                        Accessible.name: "Tolmács / Nyelvi híd"\n                        contentItem: Label {\n                            text: parent.text\n                            color: window.textPrimary\n                            font.pixelSize: 9\n                            font.bold: true\n                            horizontalAlignment: Text.AlignHCenter\n                            verticalAlignment: Text.AlignVCenter\n                        }\n                        background: Rectangle {\n                            radius: 6\n                            color: parent.hovered ? "#132a42" : "#0d1c2f"\n                            border.color: window.border\n                        }\n                    }\n\n'''
          if 'id: languageButton' not in main:
              if toolbar_anchor not in main:
                  raise SystemExit('toolbar anchor missing')
              main = main.replace(toolbar_anchor, language_button + toolbar_anchor, 1)

          row_anchor = '''    RowLayout {\n        anchors.fill: parent\n        spacing: 0\n'''
          drawer = '''    Drawer {\n        id: languageDrawer\n        parent: Overlay.overlay\n        edge: Qt.RightEdge\n        modal: true\n        interactive: true\n        width: Math.min(window.width * 0.68, 980)\n        height: window.height\n        closePolicy: Popup.CloseOnEscape | Popup.CloseOnPressOutside\n\n        background: Rectangle {\n            color: window.canvas\n            border.color: window.border\n        }\n\n        contentItem: ColumnLayout {\n            anchors.fill: parent\n            spacing: 0\n\n            Rectangle {\n                Layout.fillWidth: true\n                Layout.preferredHeight: 58\n                color: "#081421"\n                border.color: window.borderSoft\n                RowLayout {\n                    anchors.fill: parent\n                    anchors.leftMargin: 16\n                    anchors.rightMargin: 12\n                    spacing: 10\n                    Label {\n                        text: "文/A  Tolmács / Nyelvi híd"\n                        color: window.textPrimary\n                        font.pixelSize: 14\n                        font.bold: true\n                        Layout.fillWidth: true\n                    }\n                    Label {\n                        text: "FA3-GUI-LANGUAGE-CONTROL-001"\n                        color: window.textMuted\n                        font.pixelSize: 8\n                    }\n                    ToolButton {\n                        text: "×"\n                        onClicked: languageDrawer.close()\n                    }\n                }\n            }\n\n            LanguageControlPage {\n                Layout.fillWidth: true\n                Layout.fillHeight: true\n                preferences: fa3Preferences\n                panel: window.panel\n                panelRaised: window.panelRaised\n                border: window.border\n                textPrimary: window.textPrimary\n                textMuted: window.textMuted\n                accent: window.accent\n                green: window.green\n                orange: window.orange\n            }\n        }\n    }\n\n'''
          if 'id: languageDrawer' not in main:
              if row_anchor not in main:
                  raise SystemExit('root row anchor missing')
              main = main.replace(row_anchor, drawer + row_anchor, 1)

          main_path.write_text(main, encoding='utf-8')

          gate_path = Path('src/fa3_gui_gate.py')
          gate = gate_path.read_text(encoding='utf-8')
          req_anchor = '    "token_control_qml": ROOT / "apps/fa3-control-center/qml/TokenControlCenterPage.qml",\n'
          req_line = '    "language_control_qml": ROOT / "apps/fa3-control-center/qml/LanguageControlPage.qml",\n'
          if req_line not in gate:
              if req_anchor not in gate:
                  raise SystemExit('gate REQUIRED anchor missing')
              gate = gate.replace(req_anchor, req_anchor + req_line, 1)

          check_anchor = '''    token_qml = REQUIRED["token_control_qml"].read_text(encoding="utf-8")\n'''
          language_check = '''    language_qml = REQUIRED["language_control_qml"].read_text(encoding="utf-8")\n    for token in ["Tolmács / Nyelvi híd", "FA3-GUI-LANGUAGE-CONTROL-001", "FA3-LANGUAGE-BRIDGE-001", "Natív modellnyelv előnyben", "Közvetített nyelv engedélyezése", "ADAPTER-GATED", "PENDING_BACKEND", "SECRET", "derived projection"]:\n        if token not in language_qml: failures.append(f"qml-language-control-surface-missing:{token}")\n    for token in ["id: languageDrawer", "id: languageButton", "Ctrl+Shift+L", "LanguageControlPage"]:\n        if token not in qml: failures.append(f"qml-language-control-wiring-missing:{token}")\n\n'''
          if 'qml-language-control-surface-missing' not in gate:
              if check_anchor not in gate:
                  raise SystemExit('gate language check anchor missing')
              gate = gate.replace(check_anchor, language_check + check_anchor, 1)
          gate_path.write_text(gate, encoding='utf-8')

          test_path = Path('tests/test_fa3_gui_gate.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '\n\nif __name__ == "__main__":\n'
          method = '''\n    def test_language_control_is_restored_as_global_drawer(self):\n        main = (ROOT / "apps/fa3-control-center/qml/Main.qml").read_text(encoding="utf-8")\n        page = (ROOT / "apps/fa3-control-center/qml/LanguageControlPage.qml").read_text(encoding="utf-8")\n        cmake = (ROOT / "apps/fa3-control-center/CMakeLists.txt").read_text(encoding="utf-8")\n\n        for token in ["id: languageDrawer", "id: languageButton", "Ctrl+Shift+L", "Tolmács / Nyelvi híd", "LanguageControlPage"]:\n            self.assertIn(token, main)\n        for token in ["FA3-GUI-LANGUAGE-CONTROL-001", "FA3-LANGUAGE-BRIDGE-001", "ADAPTER-GATED", "PENDING_BACKEND", "SECRET", "derived projection"]:\n            self.assertIn(token, page)\n        self.assertIn("qml/LanguageControlPage.qml", cmake)\n'''
          if 'test_language_control_is_restored_as_global_drawer' not in tests:
              if anchor not in tests:
                  raise SystemExit('test anchor missing')
              tests = tests.replace(anchor, method + anchor, 1)
              test_path.write_text(tests, encoding='utf-8')
          PY

          temp_workflow=".github/workflows/fa3-language-control-restore-temp.yml"
          saved="/tmp/fa3-language-control-restore-temp.yml"
          mv "$temp_workflow" "$saved"
          python src/fa3_release_projection_regenerate.py
          mv "$saved" "$temp_workflow"

          git config user.name "fa3-language-control-restore"
          git config user.email "fa3-language-control-restore@users.noreply.github.com"
          git add apps/fa3-control-center/qml/Main.qml src/fa3_gui_gate.py tests/test_fa3_gui_gate.py canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "FA3 GUI: restore global Language Control drawer"
          git push origin HEAD:fa3-gui-restore-language-control
