name: FA3 GUI Mission Control Model Hub Materialize

on:
  push:
    branches:
      - "fa3/gui-mission-control-model-hub-2026-09-13"
    paths:
      - 'tools/fa3_gui_mission_control_materialize.py'
      - 'tools/fa3_gui_mission_control_qt64_finalize.py'
      - 'tools/fa3_gui_mission_control_gate_patch.py'
      - '.github/workflows/fa3-gui-mission-control-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fa3-mission-control-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-validate:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[mission-materialized]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize mission-control model hub
        run: |
          python tools/fa3_gui_mission_control_materialize.py
          python tools/fa3_gui_mission_control_gate_patch.py
      - name: Finalize Qt 6.4 mission-control QML
        run: PYTHONPATH=. python tools/fa3_gui_mission_control_qt64_finalize.py
      - name: Run GUI static regression gates
        run: |
          PYTHONPATH=. python src/fa3_gui_gate.py
          PYTHONPATH=. python src/fa3_gui_usability_gate.py
          PYTHONPATH=. python src/fa3_gui_catalog_search_starter_gate.py
          PYTHONPATH=. python src/fa3_gui_mission_control_gate.py
          PYTHONPATH=. python src/fa3_gui_animation_integration_gate.py
          PYTHONPATH=. python -m unittest tests.test_fa3_gui_gate tests.test_fa3_gui_catalog_search_starter_gate tests.test_fa3_gui_mission_control_gate tests.test_fa3_gui_animation_integration_gate -v
      - name: Install Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libsystemd-dev qt6-base-dev qt6-declarative-dev qt6-webengine-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtwebengine
      - name: Configure Qt reference build
        run: cmake -S apps/fa3-control-center -B build/fa3-control-center -GNinja -DCMAKE_BUILD_TYPE=Release
      - name: Build Qt reference application
        run: cmake --build build/fa3-control-center --parallel
      - name: Commit materialized source state locally
        shell: bash
        run: |
          rm -rf build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical apps src tests tools
          if git diff --cached --quiet; then
            echo "Mission-control source state already committed."
          else
            git commit -m "FA3 GUI: materialize mission-control model hub [mission-materialized]"
          fi
      - name: Reconcile and validate unified release projection
        run: |
          python scripts/fa3_reconcile_release_projection.py --root .
          chmod +x bin/fa3-enforce
          ./bin/fa3-enforce release-projection
      - name: Commit reconciled projection and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json; then
            git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
            git commit -m "FA3: reconcile mission-control GUI projection [projection]"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Create exact-head source archive
        shell: bash
        run: |
          ARCHIVE="FA3-Mission-Control-Model-Hub-$(git rev-parse --short=12 HEAD).zip"
          git archive --format=zip --output="$ARCHIVE" HEAD
          echo "FA3_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "FA3_ARCHIVE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Upload downloadable source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FA3-Mission-Control-Model-Hub
          path: ${{ env.FA3_ARCHIVE }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
