name: FA3 Ops Cancel Superseded Khronos Run
on:
  push:
    branches:
      - fa3/khronos-physical-trigger-scope-20260928
    paths:
      - '.github/workflows/fa3-ops-cancel-superseded-khronos.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded non-Khronos-triggered physical run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: "36376206838"
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}"
          status="$(curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "${api}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          case "${status}" in
            queued|in_progress|pending|waiting|requested)
              curl -fsSL -X POST                 -H "Authorization: Bearer ${GH_TOKEN}"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "${api}/cancel" >/dev/null
              ;;
            completed)
              ;;
            *)
              echo "Unexpected workflow status: ${status}" >&2
              exit 2
              ;;
          esac
