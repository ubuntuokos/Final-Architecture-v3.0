name: FA3 Model Router Provider Execution Current Host
on:
  workflow_dispatch:
  push:
    branches:
      - fa3/antigravity-derived-provider-execution-20260924
    paths:
      - '.github/fa3-model-router-provider-execution-current-host.trigger'
jobs:
  real-provider-e2e:
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and receipt-contract tests
        run: |
          python -m py_compile src/fa3_model_router_provider_execution_current_host_gate.py evidence/collect-model-router-provider-execution-current-host.py bin/fa3-model-router-provider-execution-current-host.py
          PYTHONPATH=src python -m unittest tests.test_model_router_provider_execution_current_host
      - name: Cleanup prior diagnostic preserved Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, signal, time
          from pathlib import Path
          target="OLLAMA_HOST=127.0.0.1:28777"
          killed=[]
          for p in Path("/proc").iterdir():
              if not p.name.isdigit():
                  continue
              try:
                  env=(p/"environ").read_bytes().split(b"\0")
                  cmd=(p/"cmdline").read_bytes().replace(b"\0",b" ").decode("utf-8","replace")
              except Exception:
                  continue
              envs={x.decode("utf-8","replace") for x in env if x}
              if target in envs and "CUDA_VISIBLE_DEVICES=-1" in envs and "ollama" in cmd and "serve" in cmd:
                  pid=int(p.name)
                  try:
                      os.killpg(pid,signal.SIGTERM)
                  except ProcessLookupError:
                      continue
                  killed.append(pid)
          for _ in range(50):
              if all(not Path(f"/proc/{pid}").exists() for pid in killed):
                  break
              time.sleep(0.1)
          for pid in killed:
              if Path(f"/proc/{pid}").exists():
                  try: os.killpg(pid,signal.SIGKILL)
                  except ProcessLookupError: pass
          print("PRECHECK_STALE_PROVIDER_RUNTIME_CLEANED="+str(len(killed)))
          PY
      - name: Refresh Secret Broker current-host PASS receipt through exact root helper
        shell: bash
        run: |
          set -euo pipefail
          helper=/usr/local/libexec/fa3-secret-broker-current-host-root
          test -x "$helper"
          sudo -n -l "$helper" >/dev/null
          sudo -n "$helper"
          receipt=/run/fa3/current-host-secret-broker/secret-broker-current-host.json
          test -s "$receipt"
          python - "$receipt" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r.get("schema")=="fa3.secret-broker-current-host-receipt.v1"
          assert r.get("status")=="PASS"
          assert r.get("secret_values_collected") is False
          print("PRECHECK_SECRET_BROKER_CURRENT_HOST=PASS")
          print("PRECHECK_SECRET_BROKER_SOURCE="+str(r.get("bridge_source_commit","")))
          PY
      - name: Refresh admitted local provider evidence
        shell: bash
        run: |
          set -euo pipefail
          python evidence/collect-model-manager-current-host.py --root . --preserve-serving-runtime > "$RUNNER_TEMP/model-manager-provider-preflight.json"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/receipts/model-manager-current-host.json").read_text())
          item=(r.get("providers") or {}).get("FA3-PROVIDER-OLLAMA-MODEL-001") or {}
          h=item.get("runtime_handoff") or {}
          assert item.get("status")=="PASS"
          assert item.get("evidence_level")=="CURRENT_HOST_RUNTIME_E2E_PASS"
          assert h.get("preserved") is True
          assert h.get("server_cpu_only") is True
          print("PRECHECK_PROVIDER=PASS")
          print("PRECHECK_PROVIDER_ID=FA3-PROVIDER-OLLAMA-MODEL-001")
          print("PRECHECK_PROVIDER_API_BASE="+str(h.get("api_base","")))
          PY
      - name: Report remaining externally provisioned closure inputs
        shell: bash
        run: |
          set -euo pipefail
          config="${FA3_PROVIDER_EXECUTION_CURRENT_HOST_CONFIG:-/etc/fa3/model-router/provider-execution-current-host.json}"
          if [[ -f "$config" && ! -L "$config" ]]; then
            echo "PRECHECK_PROVIDER_EXECUTION_CONFIG=PASS"
          else
            echo "PRECHECK_PROVIDER_EXECUTION_CONFIG=MISSING"
            exit 2
          fi
      - name: Produce or accept real-provider probe
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${FA3_PROVIDER_EXECUTION_CURRENT_HOST_INPUT:-/run/fa3/model-router-provider-execution/current-host-source.json}"
          CONFIG="${FA3_PROVIDER_EXECUTION_CURRENT_HOST_CONFIG:-/etc/fa3/model-router/provider-execution-current-host.json}"
          if [[ -f "$INPUT" && ! -L "$INPUT" ]]; then
            :
          else
            INPUT="$RUNNER_TEMP/model-router-provider-execution-live-probe.json"
            PYTHONPATH=src python bin/fa3-model-router-provider-execution-current-host.py --root . --config "$CONFIG" --output "$INPUT"
          fi
          echo "FA3_PROVIDER_EXECUTION_INPUT=$INPUT" >> "$GITHUB_ENV"
      - name: Sanitize and bind current-host evidence
        run: |
          python evidence/collect-model-router-provider-execution-current-host.py --root . --input "$FA3_PROVIDER_EXECUTION_INPUT" --output "$RUNNER_TEMP/model-router-provider-execution-current-host.json"
      - name: Fail-closed current-host gate
        run: |
          PYTHONPATH=src python src/fa3_model_router_provider_execution_current_host_gate.py --root . --receipt "$RUNNER_TEMP/model-router-provider-execution-current-host.json"
      - name: Cleanup preserved provider runtime
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, signal, time
          from pathlib import Path
          receipt=Path("evidence/receipts/model-manager-current-host.json")
          if not receipt.is_file():
              raise SystemExit(0)
          data=json.loads(receipt.read_text())
          for item in (data.get("providers") or {}).values():
              if not isinstance(item,dict): continue
              h=item.get("runtime_handoff")
              if not isinstance(h,dict) or h.get("preserved") is not True: continue
              pid=h.get("process_id"); expected=h.get("process_start_ticks")
              if not isinstance(pid,int) or not isinstance(expected,int): continue
              stat=Path(f"/proc/{pid}/stat")
              try:
                  raw=stat.read_text(); tail=raw[raw.rfind(")")+2:].split(); actual=int(tail[19])
              except Exception:
                  continue
              if actual != expected: continue
              try: os.killpg(pid,signal.SIGTERM)
              except ProcessLookupError: continue
              for _ in range(50):
                  if not stat.exists(): break
                  time.sleep(0.1)
              if stat.exists():
                  try: os.killpg(pid,signal.SIGKILL)
                  except ProcessLookupError: pass
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fa3-model-router-provider-execution-current-host
          path: ${{ runner.temp }}/model-router-provider-execution-current-host.json
          if-no-files-found: error
