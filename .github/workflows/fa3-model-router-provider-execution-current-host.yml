name: FA3 Model Router Provider Execution Current Host
on:
  workflow_dispatch:
  push:
    branches:
      - fa3/antigravity-derived-provider-execution-20260924
    paths:
      - '.github/fa3-model-router-provider-execution-current-host.trigger'
jobs:
  real-provider-e2e:
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and receipt-contract tests
        run: |
          python -m py_compile src/fa3_model_router_provider_execution_current_host_gate.py evidence/collect-model-router-provider-execution-current-host.py bin/fa3-model-router-provider-execution-current-host.py
          PYTHONPATH=src python -m unittest tests.test_model_router_provider_execution_current_host
      - name: Produce or accept real-provider probe
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${FA3_PROVIDER_EXECUTION_CURRENT_HOST_INPUT:-/run/fa3/model-router-provider-execution/current-host-source.json}"
          CONFIG="${FA3_PROVIDER_EXECUTION_CURRENT_HOST_CONFIG:-/etc/fa3/model-router/provider-execution-current-host.json}"
          if [[ -f "$INPUT" && ! -L "$INPUT" ]]; then
            :
          else
            test -f "$CONFIG"
            test ! -L "$CONFIG"
            INPUT="$RUNNER_TEMP/model-router-provider-execution-live-probe.json"
            PYTHONPATH=src python bin/fa3-model-router-provider-execution-current-host.py \
              --root . \
              --config "$CONFIG" \
              --output "$INPUT"
          fi
          echo "FA3_PROVIDER_EXECUTION_INPUT=$INPUT" >> "$GITHUB_ENV"
      - name: Sanitize and bind current-host evidence
        run: |
          python evidence/collect-model-router-provider-execution-current-host.py \
            --root . \
            --input "$FA3_PROVIDER_EXECUTION_INPUT" \
            --output "$RUNNER_TEMP/model-router-provider-execution-current-host.json"
      - name: Fail-closed current-host gate
        run: |
          PYTHONPATH=src python src/fa3_model_router_provider_execution_current_host_gate.py \
            --root . \
            --receipt "$RUNNER_TEMP/model-router-provider-execution-current-host.json"
      - uses: actions/upload-artifact@v4
        with:
          name: fa3-model-router-provider-execution-current-host
          path: ${{ runner.temp }}/model-router-provider-execution-current-host.json
          if-no-files-found: error
