name: FA3 Donor Serialization
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pull-requests: read
jobs:
  donor-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and donor integrity regressions
        run: |
          python3 -m py_compile src/fa3_donor_readiness.py
          PYTHONPATH=src python3 -m unittest tests.test_donor_readiness -v
      - name: Classify metadata-only donor maintenance versus normal PR
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os,subprocess,sys
          sys.path.insert(0,'src')
          from fa3_donor_readiness import is_donor_pr
          base=os.environ.get('BASE_SHA','')
          names=(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines() if base else [])
          metadata=('canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json',
                    'canonical/decisions/FA3-DEC-DONOR-REFERENCE-REGISTRY-2026-09-28.json',
                    'canonical/enforcement-policy.json','AGENTS.md',
                    'src/fa3_donor_readiness.py','bin/fa3-donor-readiness',
                    'tests/test_donor_readiness.py','src/fa3_goal_preflight.py',
                    'tests/test_goal_preflight.py','src/fa3_enforce.py',
                    'src/fa3_reuse_assessment.py',
                    '.github/workflows/fa3-donor-serialization.yml',
                    '.github/workflows/fa3-permanent-enforcement.yml')
          curated_docs = ["docs/donors-office-3d-animation-2026-09-29.md","docs/donor-oracle-ubuntu-kubuntu-2026-09-29.md","docs/donor-opensuse-novel-writing-2026-09-29.md","docs/donor-hpc-mcp-microsoft-2026-09-29.md","docs/donor-multimedia-video-render-mcp-2026-09-29.md","docs/donor-openal-openmax-heif-2026-09-29.md","docs/donor-nnstreamer-onnx-aom-a11y-2026-09-29.md","docs/FA3-ORCHESTRATOR-FUNCTIONAL-DONOR-EXPANSION-2026-09-29.md","docs/donor-ai-orchestrator-topic-2026-09-29.md","docs/godotengine-github-donor-curation-2026-09-29.md","docs/beadboard-agent-coordination-donor-review-2026-09-28.md","docs/beat-tracking-donor-curation-2026-09-28.md","docs/storygen-atelier-donor-review-2026-09-28.md","docs/three-storyboard-donor-curation-2026-09-28.md","docs/creative-writing-donor-curation-2026-09-28.md","docs/storyboard-donor-curation-2026-09-28.md","docs/daw-music-generation-donor-curation-2026-09-28.md","docs/github-video-editor-and-clip-donor-curation-2026-09-28.md","docs/ai-video-editor-video-generation-donor-curation-2026-09-28.md","docs/video-generator-donor-curation-2026-09-28.md","docs/3dcoat-donor-curation-2026-09-28.md","docs/vision-complementary-donor-curation-2026-09-28.md","docs/github-actions-runner-images-donor-curation-2026-09-28.md","docs/chip-huyen-ml-systems-donor-curation-2026-09-28.md","docs/adaptive-representation-donor-curation-2026-09-28.md"]
          curated_docs += ["docs/script-breakdown-github-donor-curation-2026-09-28.md","docs/scriptwriting-github-donor-curation-2026-09-28.md","docs/production-import-additional-github-donors-2026-09-29.md","docs/production-import-selective-donor-research-2026-09-29.md"]
          allowed_tests = ["tests/test_donors_office_3d_animation.py","tests/test_donor_oracle_ubuntu_kubuntu.py","tests/test_orchestrator_functional_donor_registry.py","tests/test_video_clip_topic_donor_curation.py","tests/test_3dcoat_donor_registry.py","tests/test_binary_analysis_donor_candidates.py"]
          def allowed(p):
              return (p in metadata or p in curated_docs or p in allowed_tests
                      or p in ('docs/donor-reference-registry.md',
                               'canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json')
                      or p.startswith('docs/donor-repair/')
                      or p.startswith('docs/donor-') or p.startswith('docs/donors-')
                      or p.startswith('canonical/deltas/FA3-DONOR-')
                      or (p.startswith('canonical/references/') and 'DONOR' in p.upper())
                      or p.startswith('tests/test_donor_') or p.startswith('tests/test_donors_'))
          donor=is_donor_pr({'title':os.environ.get('PR_TITLE','')},
                            [{'filename':name} for name in names])
          phase='maintenance' if base and donor and all(allowed(n) for n in names) else 'status'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('phase='+phase+'\n')
          print('Donor mode:',phase,'changed files:',len(names))
          PY
      - name: Mandatory fail-closed donor readiness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DONOR_PHASE: ${{ steps.classify.outputs.phase }}
        run: |
          mkdir -p reports
          set -o pipefail
          PYTHONPATH=src python3 src/fa3_donor_readiness.py --phase "$DONOR_PHASE" | tee reports/donor-readiness-gate-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fa3-donor-readiness
          path: reports/donor-readiness-gate-report.json
          if-no-files-found: ignore
