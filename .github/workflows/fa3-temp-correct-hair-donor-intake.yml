name: TEMP Correct Hair Donor Intake

on:
  push:
    branches:
      - fa3/donor-hair-groom-sources-20261003
    paths:
      - .github/workflows/fa3-temp-correct-hair-donor-intake.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify parent and pending registry
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "0a5641204c6f8caaf65e2e4bfc4af928b5579d54"
          PYTHONPATH=src python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert len(d["entries"]) == 1421
          assert d["backfill"]["entry_count"] == 1421
          assert sum(1 for x in d["entries"] if x.get("donor_id")=="FA3-DONOR-VANESSIK-001") == 1
          PY
      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fa3-temp-correct-hair-donor-intake.yml
          git commit -m "chore: remove temporary hair donor correction workflow"
      - name: Remove unapproved corrected locator from pending registry
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 - <<'PY'
          from pathlib import Path
          from fa3_donor_registry import REGISTRY_REL, _load, _atomic_write
          path=Path(REGISTRY_REL)
          data=_load(path)
          before=len(data["entries"])
          data["entries"]=[x for x in data["entries"] if x.get("donor_id")!="FA3-DONOR-VANESSIK-001"]
          assert len(data["entries"]) == before-1 == 1420
          _atomic_write(path,data)
          assert data["backfill"]["entry_count"] == 1420
          PY
          git add canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json
          git diff --cached --check
          git commit -m "fix(donor): remove unapproved corrected hair locator"
      - name: Regenerate release projection
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 src/fa3_release_projection_regenerate.py --snapshot-head "$(git rev-parse HEAD)"
      - name: Verify corrected donor and projection regressions
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -c 'from tests.test_donor_deep_learning_memory_vision_hair_20261003 import test_deep_learning_memory_vision_hair_donor_intake as t; t()'
          PYTHONPATH=src python3 -m unittest \
            tests.test_donor_hair_groom_sources_20261003 \
            tests.test_release_projection -v
      - name: Commit reconciled projection
        run: |
          set -euo pipefail
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git diff --cached --check
          git commit -m "fix(release): reconcile corrected hair donor intake"
          git push origin HEAD:fa3/donor-hair-groom-sources-20261003
