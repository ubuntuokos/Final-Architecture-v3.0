name: FA3 Release Projection Reconcile

on:
  push:
    branches:
      - "main"
      - "fa3/**"
      - "feature/**"
      - "feat/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fa3-release-projection-reconcile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[projection]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate unified release projection
        run: python scripts/fa3_reconcile_release_projection.py --root .
      - name: Validate reconciled canonical projection
        run: |
          chmod +x bin/fa3-enforce
          PYTHONPATH=src python -m unittest discover -s tests -v
          ./bin/fa3-enforce release-projection
      - name: Commit reconciled projection when changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          projection="canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json"
          remote_ref="refs/remotes/origin/${GITHUB_REF_NAME}"

          validate_projection() {
            python scripts/fa3_reconcile_release_projection.py --root .
            chmod +x bin/fa3-enforce
            PYTHONPATH=src python -m unittest discover -s tests -v
            ./bin/fa3-enforce release-projection
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            if git diff --quiet -- "${projection}"; then
              echo "Release projection already reconciled."
              exit 0
            fi

            git add "${projection}"
            git commit -m "FA3: reconcile unified release projection [projection]"

            projection_branch="automation/release-projection-${GITHUB_SHA:0:12}"
            git push origin "HEAD:refs/heads/${projection_branch}"

            pr_url="$(gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${projection_branch}" \
              --title "FA3: reconcile unified release projection [projection]" \
              --body "Automated post-merge release-projection reconciliation for main commit \`${GITHUB_SHA}\`. This PR contains only the generated canonical release projection and must pass the normal protected-branch checks before merge.")"
            echo "Created protected-main projection PR: ${pr_url}"

            pr_number="$(gh pr view "${pr_url}" --repo "${GITHUB_REPOSITORY}" --json number --jq .number)"
            if gh pr merge "${pr_number}" --repo "${GITHUB_REPOSITORY}" --auto --squash --delete-branch; then
              echo "Auto-merge enabled for projection PR #${pr_number}."
            else
              echo "::notice::Auto-merge is unavailable; projection PR #${pr_number} remains open for normal protected-branch merge."
            fi
            exit 0
          fi

          for attempt in 1 2 3; do
            git fetch origin "+refs/heads/${GITHUB_REF_NAME}:${remote_ref}"
            remote_sha="$(git rev-parse "${remote_ref}")"
            local_sha="$(git rev-parse HEAD)"

            if [ "${local_sha}" != "${remote_sha}" ]; then
              echo "Branch advanced during reconciliation; refreshing from ${remote_sha} (attempt ${attempt}/3)."
              git reset --hard "${remote_ref}"
              validate_projection
            fi

            if git diff --quiet -- "${projection}"; then
              echo "Release projection already reconciled."
              exit 0
            fi

            git add "${projection}"
            git commit -m "FA3: reconcile unified release projection [projection]"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo "Projection push raced with another branch update; retrying from the new remote head."
          done

          echo "Release projection could not be committed after 3 race-safe reconciliation attempts." >&2
          exit 1
