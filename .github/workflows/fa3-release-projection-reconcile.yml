name: FA3 Release Projection Reconcile

on:
  push:
    branches:
      - "main"
      - "fa3/**"
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "cfa3/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fa3-release-projection-reconcile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[projection]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate existing protected-main projection
        id: main_projection
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/fa3-enforce
          if ./bin/fa3-enforce release-projection; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Protected main projection is already valid; no post-merge projection commit is required."
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Protected main projection is stale or invalid; generating a fail-closed recovery branch."
          fi
      - name: Validate existing branch projection
        id: branch_projection
        if: github.ref_name != 'main'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/fa3-enforce
          if ./bin/fa3-enforce release-projection; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Branch projection is already valid; no bot-authored projection commit is permitted."
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Branch projection is stale or invalid; validating a regenerated workspace copy."
          fi
      - name: Regenerate unified release projection
        if: (github.ref_name == 'main' && steps.main_projection.outputs.valid != 'true') || (github.ref_name != 'main' && steps.branch_projection.outputs.valid != 'true')
        run: python scripts/fa3_reconcile_release_projection.py --root .
      - name: Validate reconciled canonical projection
        if: (github.ref_name == 'main' && steps.main_projection.outputs.valid != 'true') || (github.ref_name != 'main' && steps.branch_projection.outputs.valid != 'true')
        run: |
          chmod +x bin/fa3-enforce
          bash bin/fa3-prepare-repository
          bash bin/fa3-test -v
          ./bin/fa3-enforce release-projection
      - name: Upload reconciled projection
        if: (github.ref_name == 'main' && steps.main_projection.outputs.valid != 'true') || (github.ref_name != 'main' && steps.branch_projection.outputs.valid != 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fa3-reconciled-release-projection
          path: canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          if-no-files-found: error

      - name: Preserve reconciled projection safely
        if: (github.ref_name == 'main' && steps.main_projection.outputs.valid != 'true') || (github.ref_name != 'main' && steps.branch_projection.outputs.valid != 'true')
        shell: bash
        run: |
          set -euo pipefail

          projection="canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json"

          if git diff --quiet -- "${projection}"; then
            echo "Release projection already reconciled."
            exit 0
          fi

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${projection}"
            git commit -m "FA3: reconcile unified release projection [projection]"

            recovery_branch="automation/release-projection-recovery-${GITHUB_SHA:0:12}"
            git push origin "HEAD:refs/heads/${recovery_branch}"
            echo "::error::Protected main projection failed validation. Reconciled projection was preserved on ${recovery_branch}; merge it only through the normal protected PR path."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${projection}"
          git commit -m "FA3: reconcile unified release projection [projection]"

          recovery_branch="automation/release-projection-pr-${GITHUB_SHA:0:12}"
          git push --force-with-lease origin "HEAD:refs/heads/${recovery_branch}"

          case "${GITHUB_REF_NAME}" in
            fa3/current-host-*)
              source_sha="${GITHUB_SHA}"
              test "$(git rev-parse HEAD^)" = "$source_sha"
              mapfile -t changed < <(git diff --name-only "$source_sha..HEAD")
              test "${#changed[@]}" -eq 1
              test "${changed[0]}" = "$projection"
              git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
              echo "::notice::Validated projection recovery ${recovery_branch} was automatically adopted onto the exact Current Host closure generation."
              exit 0
              ;;
          esac

          echo "::error::PR branch projection is stale. The validated projection commit was preserved on ${recovery_branch}; an authorized author/agent must adopt that commit onto the PR head so protected checks run on the resulting head."
          exit 2
