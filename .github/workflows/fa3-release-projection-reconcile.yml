name: FA3 Release Projection Reconcile

on:
  push:
    branches:
      - "fa3/**"
      - "feature/**"
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fa3-release-projection-reconcile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[projection]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate unified release projection
        run: python scripts/fa3_reconcile_release_projection.py --root .
      - name: Validate reconciled canonical projection
        run: |
          chmod +x bin/fa3-enforce
          PYTHONPATH=src python -m unittest discover -s tests -v
          ./bin/fa3-enforce release-projection
      - name: Commit reconciled projection when changed
        id: commit_projection
        shell: bash
        run: |
          if git diff --quiet -- canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json; then
            echo "Release projection already reconciled."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git commit -m "FA3: reconcile unified release projection [projection]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "reconciled_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dispatch required gates on reconciled head
        if: steps.commit_projection.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Dispatching required gates for ${GITHUB_REF_NAME} at ${{ steps.commit_projection.outputs.reconciled_sha }}"
          gh workflow run fa3-permanent-enforcement.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run fa3-gui-gate.yml --ref "${GITHUB_REF_NAME}"
