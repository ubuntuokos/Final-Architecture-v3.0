name: FA3 Release Projection Reconcile

on:
  push:
    branches:
      - "fa3/**"
      - "feature/**"
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fa3-release-projection-reconcile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[projection]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate release semantics to free-only decommission state
        shell: bash
        run: |
          python scripts/fa3_free_only_release_migration.py
          if git diff --quiet; then
            echo "Free-only release semantics already migrated."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add canonical/enforcement-policy.json evidence/evidence-registry.json src/fa3_enforce.py src/fa3_release_projection_gate.py src/fa3_release_projection_regenerate.py scripts/fa3_reconcile_release_projection.py
            git commit -m "FA3: reconcile free-only decommission semantics"
          fi
      - name: Regenerate unified release projection
        run: python scripts/fa3_reconcile_release_projection.py --root .
      - name: Validate reconciled canonical projection
        run: |
          chmod +x bin/fa3-enforce
          PYTHONPATH=src python -m unittest discover -s tests -v
          ./bin/fa3-enforce free-only
          ./bin/fa3-enforce release-projection
      - name: Commit reconciled projection when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json; then
            git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
            git commit -m "FA3: reconcile unified release projection [projection]"
          fi
          if [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ]; then
            echo "Release projection and decommission semantics already reconciled."
            exit 0
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
