name: FA3 Capability Count De-hardcode

on:
  push:
    branches:
      - main
      - "fa3/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dehardcode-gate:
    name: capability-count-dehardcode / fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          python -m py_compile \
            src/fa3_release_baseline.py \
            src/fa3_capability_count_dehardcode_gate.py \
            src/fa3_enforce.py \
            src/fa3_governance_tiering_gate.py \
            src/fa3_release_projection_gate.py \
            src/fa3_release_evidence_scope_gate.py \
            scripts/fa3_reconcile_release_projection.py
      - name: Baseline loader and migration regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_capability_count_dehardcode -v
      - name: Validate de-hardcode migration
        env:
          PYTHONPATH: src
        run: python src/fa3_capability_count_dehardcode_gate.py --root .
      - name: Upload gate report
        uses: actions/upload-artifact@v4
        with:
          name: capability-count-dehardcode-report
          path: reports/capability-count-dehardcode-gate-report.json
