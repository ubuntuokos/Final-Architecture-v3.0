name: FA3 Objective Coordination Intelligence
on:
  pull_request:
    paths:
      - 'canonical/**OBJECTIVE-COORDINATION-INTELLIGENCE**'
      - 'src/fa3_objective_coordination_intelligence.py'
      - 'src/fa3_objective_coordination_intelligence_gate.py'
      - 'tests/test_objective_coordination_intelligence.py'
      - '.github/workflows/fa3-objective-coordination-intelligence.yml'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python src/fa3_objective_coordination_intelligence_gate.py
      - run: python -m unittest tests.test_objective_coordination_intelligence -v
