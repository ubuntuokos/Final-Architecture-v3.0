name: FA3 Model Manager llmfit GUI Gate

on:
  pull_request:
    paths:
      - 'canonical/profiles/FA3-MODEL-MANAGER-001.json'
      - 'canonical/providers/FA3-PROVIDER-LLMFIT-001.json'
      - 'canonical/decisions/FA3-DEC-MODEL-MANAGER-LLMFIT-GUI-2026-09-13.json'
      - 'canonical/model-manager-llmfit-gui-enforcement.json'
      - 'apps/fa3-control-center/**'
      - 'deployment/model-manager/llmfit/**'
      - 'evidence/reference/model-manager-llmfit-gui-2026-09-13.json'
      - 'src/fa3_model_manager_llmfit_gui_gate.py'
      - 'tests/test_model_manager_llmfit_gui_gate.py'
      - '.github/workflows/fa3-model-manager-llmfit-gui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-manager-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve Model Manager v2 baseline gate
        run: PYTHONPATH=. python src/fa3_model_manager_v2_gate.py
      - name: Preserve Model Manager v2 regressions
        run: PYTHONPATH=. python -m unittest tests.test_model_manager_v2_gate -v

  llmfit-static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run llmfit Model Manager GUI gate
        run: PYTHONPATH=. python src/fa3_model_manager_llmfit_gui_gate.py
      - name: Run llmfit negative regressions
        run: PYTHONPATH=. python -m unittest tests.test_model_manager_llmfit_gui_gate -v
      - name: Validate deployment shell syntax
        run: bash -n deployment/model-manager/llmfit/install.sh
