name: FA3 Kdenlive Audio Conditioning Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/contracts/FA3-KDENLIVE-AUDIO-CONDITIONING-CONTRACTS-001.json'
      - 'canonical/providers/FA3-PROVIDER-SILERO-VAD-001.json'
      - 'canonical/decisions/FA3-DEC-KDENLIVE-AUDIO-CONDITIONING-2026-09-11.json'
      - 'canonical/kdenlive-audio-conditioning-enforcement.json'
      - 'canonical/FA3-GATE-KDENLIVE-AUDIO-CONDITIONING-001.json'
      - 'src/fa3_silero_vad_provider.py'
      - 'src/fa3_kdenlive_audio_pipeline.py'
      - 'src/fa3_kdenlive_audio_gate.py'
      - 'tests/test_kdenlive_audio_conditioning.py'
      - '.github/workflows/fa3-kdenlive-audio-conditioning.yml'
  push:
    branches: [main]
    paths:
      - 'canonical/**kdenlive-audio-conditioning**'
      - 'canonical/providers/FA3-PROVIDER-SILERO-VAD-001.json'
      - 'src/fa3_silero_vad_provider.py'
      - 'src/fa3_kdenlive_audio_pipeline.py'
      - 'src/fa3_kdenlive_audio_gate.py'
      - 'tests/test_kdenlive_audio_conditioning.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile src/fa3_silero_vad_provider.py src/fa3_kdenlive_audio_pipeline.py src/fa3_kdenlive_audio_gate.py evidence/collect-kdenlive-audio-conditioning-current-host.py
      - name: Unit regressions
        run: python -m unittest tests.test_kdenlive_audio_conditioning -v
      - name: Canonical executable gate
        run: python src/fa3_kdenlive_audio_gate.py
