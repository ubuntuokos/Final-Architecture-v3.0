name: FA3 Skill Fabric Agent Skills Ecosystem

on:
  pull_request:
    paths:
      - 'canonical/profiles/FA3-SKILL-FABRIC-001.json'
      - 'canonical/contracts/FA3-SKILL-PACKAGE-ADMISSION-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-AGENT-SKILLS-COMPAT-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-SKILL-SECURITY-INSPECTION-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-SKILL-EVALUATION-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-SKILL-IMPROVEMENT-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-SKILL-ENGINEERING-HARDENING-CONTRACTS-001.json'
      - 'canonical/decisions/FA3-DEC-SKILL-FABRIC-V14-ENGINEERING-HARDENING-2026-09-27.json'
      - 'canonical/skill-rejected-change-ledger.json'
      - 'canonical/skill-artifact-bindings.json'
      - 'canonical/FA3-EXTERNAL-SKILL-RADAR-001.json'
      - 'canonical/skill-fabric-enforcement.json'
      - 'canonical/FA3-GATE-SKILL-FABRIC-001.json'
      - 'src/fa3_skill_ecosystem.py'
      - 'src/fa3_skill_ecosystem_gate.py'
      - 'src/fa3_skill_fabric_gate.py'
      - 'canonical/skill-registry.json'
      - 'skills/**/SKILL.md'
      - 'tests/test_skill_fabric_gate.py'
      - 'src/fa3_skill_materialization.py'
      - 'src/fa3_cap080_verified_skill_supply_chain_current_host.py'
      - 'tests/test_cap080_verified_skill_supply_chain_current_host.py'
      - 'src/fa3_skill_task_binding.py'
      - 'src/fa3_skill_task_projection.py'
      - 'tests/test_codex_adapter.py'
      - 'tests/test_codex_skill_reference.py'
      - 'src/fa3_codex_skill_reference.py'
      - 'src/fa3_codex_adapter.py'
      - 'src/fa3_skill_worker_context.py'
      - 'tests/test_skill_signed_authority.py'
      - 'canonical/contracts/FA3-AUTHENTICATED-APPROVAL-RECEIPT-001.schema.json'
      - 'canonical/contracts/FA3-AUTHORIZATION-ROLE-GRANT-001.schema.json'
      - 'canonical/contracts/FA3-SKILL-SIGNED-AUTHORITY-BINDING-001.json'
      - 'tools/fa3_approval_tool.py'
      - 'src/fa3_authenticated_approval.py'
      - 'src/fa3_skill_signed_authority.py'
      - 'src/fa3_developer_agent_coordination.py'
      - 'src/fa3_language_gateway_gate.py'
      - 'tests/test_skill_task_binding.py'
      - 'tests/test_skill_materialization.py'
      - 'src/fa3_skill_fabric_v13.py'
      - 'src/fa3_skill_fabric_v14.py'
      - 'tests/test_skill_ecosystem.py'
      - 'tests/test_skill_fabric_v13.py'
      - 'tests/test_skill_fabric_v14.py'
      - '.github/workflows/fa3-skill-ecosystem.yml'
  push:
    branches: [main]
    paths:
      - 'canonical/profiles/FA3-SKILL-FABRIC-001.json'
      - 'canonical/contracts/FA3-SKILL-PACKAGE-ADMISSION-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-SKILL-ENGINEERING-HARDENING-CONTRACTS-001.json'
      - 'canonical/decisions/FA3-DEC-SKILL-FABRIC-V14-ENGINEERING-HARDENING-2026-09-27.json'
      - 'canonical/skill-rejected-change-ledger.json'
      - 'canonical/skill-artifact-bindings.json'
      - 'canonical/FA3-EXTERNAL-SKILL-RADAR-001.json'
      - 'canonical/skill-fabric-enforcement.json'
      - 'canonical/FA3-GATE-SKILL-FABRIC-001.json'
      - 'src/fa3_skill_ecosystem.py'
      - 'src/fa3_skill_ecosystem_gate.py'
      - 'src/fa3_skill_fabric_gate.py'
      - 'canonical/skill-registry.json'
      - 'skills/**/SKILL.md'
      - 'tests/test_skill_fabric_gate.py'
      - 'src/fa3_skill_materialization.py'
      - 'src/fa3_skill_task_binding.py'
      - 'src/fa3_skill_task_projection.py'
      - 'tests/test_codex_adapter.py'
      - 'tests/test_codex_skill_reference.py'
      - 'src/fa3_codex_skill_reference.py'
      - 'src/fa3_codex_adapter.py'
      - 'src/fa3_skill_worker_context.py'
      - 'tests/test_skill_signed_authority.py'
      - 'canonical/contracts/FA3-AUTHENTICATED-APPROVAL-RECEIPT-001.schema.json'
      - 'canonical/contracts/FA3-AUTHORIZATION-ROLE-GRANT-001.schema.json'
      - 'canonical/contracts/FA3-SKILL-SIGNED-AUTHORITY-BINDING-001.json'
      - 'tools/fa3_approval_tool.py'
      - 'src/fa3_authenticated_approval.py'
      - 'src/fa3_skill_signed_authority.py'
      - 'src/fa3_developer_agent_coordination.py'
      - 'src/fa3_language_gateway_gate.py'
      - 'tests/test_skill_task_binding.py'
      - 'tests/test_skill_materialization.py'
      - 'src/fa3_skill_fabric_v13.py'
      - 'src/fa3_skill_fabric_v14.py'
      - 'tests/test_skill_ecosystem.py'
      - 'tests/test_skill_fabric_v13.py'
      - 'tests/test_skill_fabric_v14.py'
      - '.github/workflows/fa3-skill-ecosystem.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile src/fa3_skill_ecosystem.py src/fa3_skill_ecosystem_gate.py src/fa3_skill_fabric_v13.py src/fa3_skill_fabric_v14.py src/fa3_skill_fabric_gate.py src/fa3_skill_materialization.py src/fa3_skill_task_binding.py src/fa3_skill_task_projection.py src/fa3_skill_signed_authority.py src/fa3_authenticated_approval.py src/fa3_skill_worker_context.py src/fa3_codex_adapter.py src/fa3_codex_skill_reference.py src/fa3_developer_agent_coordination.py
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest tests.test_skill_ecosystem tests.test_skill_fabric_gate tests.test_skill_discovery tests.test_skill_materialization tests.test_skill_task_binding tests.test_skill_signed_authority tests.test_codex_adapter tests.test_codex_skill_reference tests.test_developer_agent_coordination tests.test_cap080_verified_skill_supply_chain_current_host tests.test_skill_fabric_v13 tests.test_skill_fabric_v14 -v
      - name: Agent Skills ecosystem gate
        run: PYTHONPATH=src python src/fa3_skill_ecosystem_gate.py --root .
      - name: Parent Skill Fabric gate
        run: PYTHONPATH=src python src/fa3_skill_fabric_gate.py --root .
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-skill-ecosystem-gate
          path: |
            reports/skill-ecosystem-gate-report.json
            reports/skill-fabric-v13-gate-report.json
            reports/skill-fabric-v14-gate-report.json
            reports/skill-fabric-gate-report.json
