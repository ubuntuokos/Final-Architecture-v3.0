name: FA3 Work Management Materialization

on:
  push:
    branches:
      - fa3-work-management-gui-20260917
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message || '', '[projection]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic Work Management materialization
        run: python tools/fa3_work_management_global_reconcile.py --prepare-only
      - name: Validate materialized GUI and canonical boundaries
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile src/fa3_work_management_gate.py tests/test_work_management_gate.py tools/fa3_work_management_global_reconcile.py src/fa3_enforce.py
          python -m unittest tests.test_work_management_gate -v
          python src/fa3_work_management_gate.py
      - name: Commit materialized surfaces
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            canonical/enforcement-policy.json \
            canonical/providers/FA3-PROVIDER-KANEO-001.json \
            canonical/providers/FA3-PROVIDER-KANBOARD-001.json \
            apps/fa3-control-center/CMakeLists.txt \
            apps/fa3-control-center/qml/Main.qml \
            src/fa3_enforce.py \
            .github/workflows/fa3-permanent-enforcement.yml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "FA3: bind Work Management GUI, providers and resource semantics"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Reconcile unified release projection
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(git rev-parse HEAD)"
          python tools/fa3_work_management_global_reconcile.py --projection-only --snapshot-head "$snapshot"
          PYTHONPATH=src python src/fa3_release_projection_gate.py --root .
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          if ! git diff --cached --quiet; then
            git commit -m "FA3: reconcile Work Management release projection [projection]"
          fi
      - name: Push reconciled branch
        run: git push origin HEAD:fa3-work-management-gui-20260917
