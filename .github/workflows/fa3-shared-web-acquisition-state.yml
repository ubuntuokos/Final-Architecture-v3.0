name: FA3 Shared Web Acquisition State

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fa3-shared-web-acquisition-state-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile src/fa3_shared_web_acquisition_state.py src/fa3_shared_web_acquisition_state_gate.py
      - name: State and recovery regressions
        run: python -m unittest tests.test_shared_web_acquisition_state -v
      - name: P0 shared acquisition state gate
        run: python src/fa3_shared_web_acquisition_state_gate.py --root .
      - name: Donor readiness regression suite
        run: python -m unittest tests.test_donor_readiness -v
