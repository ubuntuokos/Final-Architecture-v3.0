name: FA3 Model Manager Current-Host Provider E2E
on:
  workflow_dispatch:
  push:
    branches:
      - fa3/model-manager-current-host-2026-09-01
    paths:
      - .github/workflows/fa3-model-manager-current-host.yml
      - canonical/FA3-MODEL-MANAGER-RUNTIME-CONFORMANCE-001.json
      - canonical/model-manager-current-host-enforcement.json
      - canonical/decisions/FA3-DEC-MODEL-MANAGER-CURRENT-HOST-2026-09-01.json
      - src/fa3_model_manager_provider_adapter.py
      - src/fa3_model_manager_current_host_gate.py
      - evidence/collect-model-manager-current-host.py
      - bin/fa3-model-manager-current-host.sh
      - tests/test_model_manager_provider_adapter.py
permissions:
  contents: read
jobs:
  current-host:
    name: model-manager-current-host / real-provider-e2e
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify safe local-only prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v python3
          test -d /ai-cache || test -d "$HOME/.cache/huggingface"
      - name: Adapter regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m unittest tests.test_model_manager_provider_adapter -v
      - name: Run real local-only provider E2E
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          bash bin/fa3-model-manager-current-host.sh
      - name: Upload current-host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-model-manager-current-host-evidence
          path: |
            evidence/receipts/model-manager-current-host.json
            evidence/runtime/model-manager-current-host/
            reports/model-manager-current-host-gate-report.json
