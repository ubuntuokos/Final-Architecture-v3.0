name: FA3 Agent Workload Runtime Current Host

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/profiles/FA3-AGENT-WORKLOAD-RUNTIME-001.json'
      - 'canonical/FA3-AGENT-WORKLOAD-RUNTIME-CURRENT-HOST-CONFORMANCE-001.json'
      - 'canonical/FA3-GATE-AGENT-WORKLOAD-RUNTIME-CURRENT-HOST-001.json'
      - 'canonical/providers/FA3-PROVIDER-AGENT-RUNNER-NATIVE-001.json'
      - 'canonical/providers/FA3-PROVIDER-AGENT-RUNNER-PODMAN-001.json'
      - 'evidence/collect-agent-workload-runtime-current-host.py'
      - 'src/fa3_agent_workload_current_host_gate.py'
      - 'tests/test_agent_workload_current_host_gate.py'
      - 'fa3-current-host/manifest.json'
      - '.github/workflows/fa3-agent-workload-runtime-current-host.yml'
  workflow_dispatch:
    inputs:
      execute_current_host:
        description: 'Run real native Agent Workload current-host E2E'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  reference-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and unit regressions
        run: |
          python -m py_compile evidence/collect-agent-workload-runtime-current-host.py src/fa3_agent_workload_current_host_gate.py
          PYTHONPATH=src python -m unittest tests.test_agent_workload_current_host_gate -v
      - name: Parent workload runtime gate
        run: ./bin/fa3-enforce agent-workload-runtime
      - name: Current-host contract only, no fabricated receipt
        run: PYTHONPATH=src python src/fa3_agent_workload_current_host_gate.py --root . --static-only

  production-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_current_host }}
    needs: reference-regression
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 15
    env:
      FA3_CURRENT_HOST_EXECUTION_CONTEXT: REAL_SELF_HOSTED_FA3_CURRENT_HOST
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mint and validate fresh CPU-only HRB admission for this workload
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/bin/fa3-host-resource-broker-admission
          /usr/local/bin/fa3-host-resource-broker-admission --doctor
          mkdir -p .fa3-current-host/input
          cat > .fa3-current-host/input/agent-workload-resource-envelope.json <<'JSON'
          {
            "schema": "fa3.workload-resource-envelope.v1",
            "workload_id": "fa3-agent-workload-native-current-host",
            "requirements": [
              {"metric": "cpu.physical_cores", "operator": ">=", "value": 1},
              {"metric": "memory.total_gib", "operator": ">=", "value": 1}
            ],
            "global_promotion_claim": false
          }
          JSON
          chmod 600 .fa3-current-host/input/agent-workload-resource-envelope.json
          /usr/local/bin/fa3-host-resource-broker-admission authorize             --workload .fa3-current-host/input/agent-workload-resource-envelope.json             --output .fa3-current-host/input/agent-workload-hrb-authorization.json
          PYTHONPATH=src python evidence/collect-resource-admission-current-host.py             --root .             --workload-envelope .fa3-current-host/input/agent-workload-resource-envelope.json             --hrb-authorization .fa3-current-host/input/agent-workload-hrb-authorization.json
          ./bin/fa3-enforce resource-admission-current-host
      - name: Collect real native runner evidence
        run: |
          PYTHONPATH=src python evidence/collect-agent-workload-runtime-current-host.py             --root .             --resource-admission-receipt evidence/receipts/resource-admission-current-host.json
      - name: Fail-closed current-host gate
        run: ./bin/fa3-enforce agent-workload-runtime-current-host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fa3-agent-workload-runtime-current-host
          if-no-files-found: warn
          path: |
            evidence/receipts/agent-workload-runtime-current-host.json
            evidence/receipts/resource-admission-current-host.json
            reports/agent-workload-runtime-current-host-gate-report.json
            reports/agent-workload-runtime-gate-report.json
            reports/resource-admission-current-host-gate-report.json
