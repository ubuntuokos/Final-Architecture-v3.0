name: FA3 temporary MCP Control Chat materialization

on:
  push:
    branches:
      - fa3-mcp-control-chat-v1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa3-mcp-control-chat-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize MCP Control Chat
        run: python .github/scripts/materialize_mcp_control_chat.py
      - name: Reconcile release projection and commit
        shell: bash
        run: |
          set -euo pipefail
          temp_workflow=".github/workflows/fa3-mcp-control-chat-materialize-temp.yml"
          saved="/tmp/fa3-mcp-control-chat-materialize-temp.yml"
          mv "$temp_workflow" "$saved"
          python src/fa3_release_projection_regenerate.py
          mv "$saved" "$temp_workflow"
          git config user.name "fa3-mcp-control-chat-materializer"
          git config user.email "fa3-mcp-control-chat-materializer@users.noreply.github.com"
          git add apps/fa3-control-center canonical/FA3-MCP-CONTROL-CHAT-001.json src/fa3_gui_gate.py tests/test_fa3_gui_gate.py canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          if git diff --cached --quiet; then
            echo "No materialization changes"
            exit 0
          fi
          git commit -m "FA3 MCP Control Chat: materialize GUI and authority boundary"
          git push origin HEAD:fa3-mcp-control-chat-v1
