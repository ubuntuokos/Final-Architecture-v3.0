name: FA3 Shared Execution Security
on:
  pull_request:
    paths:
      - 'canonical/profiles/FA3-SHARED-EXECUTION-SECURITY-001.json'
      - 'canonical/contracts/FA3-SHARED-EXECUTION-SECURITY-CONTRACTS-001.json'
      - 'canonical/decisions/FA3-DEC-SHARED-EXECUTION-SECURITY-2026-10-02.json'
      - 'canonical/assessments/FA3-SHARED-EXECUTION-SECURITY-REUSE-ASSESSMENT-2026-10-02.json'
      - 'canonical/FA3-SHARED-EXECUTION-SECURITY-CURRENT-HOST-IMPACT-001.json'
      - 'canonical/FA3-APPLICATION-DONOR-LINKS-001.json'
      - 'src/fa3_shared_execution_security.py'
      - 'src/fa3_shared_execution_security_gate.py'
      - 'tests/test_shared_execution_security.py'
      - '.github/workflows/fa3-shared-execution-security.yml'
  workflow_dispatch:
jobs:
  shared-execution-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Unit regressions
        run: python -m unittest tests.test_shared_execution_security
      - name: P0 gate
        run: PYTHONPATH=src python src/fa3_shared_execution_security_gate.py --root .
      - name: Diff whitespace
        run: git diff --check origin/main...HEAD
