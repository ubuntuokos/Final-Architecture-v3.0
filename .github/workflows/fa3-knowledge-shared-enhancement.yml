name: FA3 Knowledge Shared Multi-source Enhancement

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/profiles/FA3-KNOWLEDGE-001.json'
      - 'canonical/profiles/FA3-SHARED-KNOWLEDGE-RETRIEVAL-001.json'
      - 'canonical/profiles/FA3-HIERARCHICAL-HYBRID-RETRIEVAL-001.json'
      - 'canonical/contracts/FA3-KNOWLEDGE-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-SHARED-KNOWLEDGE-RETRIEVAL-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-HIERARCHICAL-HYBRID-RETRIEVAL-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-KNOWLEDGE-RUNBOOK-INTERFACE-001.json'
      - 'canonical/providers/FA3-PROVIDER-RAGFLOW-001.json'
      - 'canonical/providers/FA3-PROVIDER-HAYSTACK-001.json'
      - 'canonical/providers/FA3-PROVIDER-PAGEINDEX-LOCAL-001.json'
      - 'canonical/assessments/FA3-KNOWLEDGE-SHARED-MULTISOURCE-REUSE-ASSESSMENT-001.json'
      - 'canonical/references/FA3-KNOWLEDGE-MULTISOURCE-PATTERN-REFERENCE-2026-10-01.json'
      - 'canonical/references/FA3-RAGFLOW-UPSTREAM-REFERENCE-2026-10-01.json'
      - 'canonical/reconciliations/FA3-KNOWLEDGE-SHARED-CONSUMER-IMPACT-2026-10-01.json'
      - 'canonical/decisions/FA3-DEC-KNOWLEDGE-SHARED-MULTISOURCE-2026-10-01.json'
      - 'canonical/knowledge-shared-enhancement-enforcement.json'
      - 'canonical/knowledge-hybrid-retrieval-enforcement.json'
      - 'src/fa3_hybrid_retrieval.py'
      - 'src/fa3_knowledge_hybrid_retrieval_gate.py'
      - 'src/fa3_knowledge_shared_enhancement_gate.py'
      - 'tests/test_knowledge_hybrid_retrieval.py'
      - 'tests/test_knowledge_shared_enhancement.py'
      - '.github/workflows/fa3-knowledge-shared-enhancement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knowledge-shared-enhancement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FA3_CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      FA3_CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FA3_PUBLISHED_MAIN_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve live published main
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          LIVE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$LIVE_MAIN"
          echo "FA3_PUBLISHED_MAIN_SHA=$LIVE_MAIN" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile src/fa3_hybrid_retrieval.py src/fa3_knowledge_hybrid_retrieval_gate.py src/fa3_knowledge_shared_enhancement_gate.py
      - name: Knowledge regressions
        run: PYTHONPATH=src python -m unittest tests.test_knowledge_hybrid_retrieval tests.test_knowledge_shared_enhancement -v
      - name: Shared enhancement gate
        run: ./bin/fa3-enforce knowledge-shared-enhancement
      - name: Existing hybrid retrieval gate
        run: ./bin/fa3-enforce knowledge-hybrid-retrieval
      - name: Donor snapshot and shared placement gate
        run: ./bin/fa3-enforce reuse-discovery
      - name: Hardware portability
        run: ./bin/fa3-enforce hardware-portability
      - name: Distribution compliance
        run: ./bin/fa3-enforce distribution-compliance
      - name: Diff whitespace
        run: git diff --check origin/main...HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fa3-knowledge-shared-enhancement
          path: |
            reports/knowledge-shared-enhancement-gate-report.json
            reports/knowledge-hybrid-retrieval-gate-report.json
          if-no-files-found: error
