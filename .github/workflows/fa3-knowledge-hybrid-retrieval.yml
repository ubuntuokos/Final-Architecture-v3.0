name: FA3 Knowledge Hierarchical + Hybrid Retrieval

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/profiles/FA3-KNOWLEDGE-001.json'
      - 'canonical/profiles/FA3-HIERARCHICAL-HYBRID-RETRIEVAL-001.json'
      - 'canonical/contracts/FA3-KNOWLEDGE-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-HIERARCHICAL-HYBRID-RETRIEVAL-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-KNOWLEDGE-RUNBOOK-INTERFACE-001.json'
      - 'canonical/decisions/FA3-DEC-KNOWLEDGE-RUNBOOK-BOUNDARY-2026-09-20.json'
      - 'canonical/knowledge-hybrid-retrieval-enforcement.json'
      - 'canonical/providers/FA3-PROVIDER-PAGEINDEX-LOCAL-001.json'
      - 'canonical/references/FA3-PAGEINDEX-LOCAL-UPSTREAM-REFERENCE-2026-09-18.json'
      - 'canonical/references/FA3-OPENKB-UPSTREAM-REFERENCE-2026-09-18.json'
      - 'canonical/references/FA3-CONDB-UPSTREAM-REFERENCE-2026-09-18.json'
      - 'canonical/mcp-capability-registry.json'
      - 'src/fa3_hybrid_retrieval.py'
      - 'src/fa3_pageindex_local_provider.py'
      - 'src/fa3_knowledge_hybrid_retrieval_gate.py'
      - 'tests/test_knowledge_hybrid_retrieval.py'
      - 'apps/fa3-control-center/qml/KnowledgePage.qml'
      - 'apps/fa3-control-center/qml/Main.qml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knowledge-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile src/fa3_hybrid_retrieval.py src/fa3_pageindex_local_provider.py src/fa3_knowledge_hybrid_retrieval_gate.py
      - name: Retrieval regressions
        run: PYTHONPATH=src python -m unittest tests.test_knowledge_hybrid_retrieval -v
      - name: Canonical knowledge gate
        run: PYTHONPATH=src python src/fa3_knowledge_hybrid_retrieval_gate.py --root .
      - name: GUI non-regression
        run: PYTHONPATH=src python src/fa3_gui_gate.py
