name: FA3 Goal Foundation Projection Reconcile

# Owner-scope only, one-shot canonical projection regeneration. This workflow
# never overrides any gate and cannot execute on fork PRs or arbitrary commits.
on:
  pull_request:
    paths:
      - ".github/workflows/fa3-goal-foundation-projection-reconcile.yml"

permissions:
  contents: write

jobs:
  projection-reconcile:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == 'ubuntuokos/Final-Architecture-v3.0' &&
      github.event.pull_request.head.ref == 'fa3/goal-driven-execution-foundation-20260928'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact immutable PR head with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Enforce explicit one-shot finalization
        id: one_shot
        run: |
          if [ "$(git log -1 --format=%s)" = "ci(release): finalize goal foundation one-shot projection" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Clean committed source snapshot
        if: steps.one_shot.outputs.run == 'true'
        run: test -z "$(git status --porcelain)"
      - name: Regenerate using existing governed release tool
        if: steps.one_shot.outputs.run == 'true'
        run: PYTHONPATH=src python3 scripts/fa3_reconcile_release_projection.py
      - name: Fail closed on unexpected file changes
        if: steps.one_shot.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import subprocess
          expected='canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json'
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          if changed != [expected]:
              raise SystemExit('unexpected projection diff: '+repr(changed))
          PY
      - name: Commit generated projection without force
        if: steps.one_shot.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git commit -m "build(release): reconcile exact goal-foundation snapshot"
          git push origin HEAD:refs/heads/fa3/goal-driven-execution-foundation-20260928
      - name: Log exact generated commit and tree
        if: steps.one_shot.outputs.run == 'true'
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
