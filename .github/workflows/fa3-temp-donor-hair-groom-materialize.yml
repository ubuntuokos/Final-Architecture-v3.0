name: TEMP Hair Donor Materializer

on:
  push:
    branches:
      - fa3/donor-hair-groom-sources-20261003
    paths:
      - .github/workflows/fa3-temp-donor-hair-groom-materialize.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact parent
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "0a5641204c6f8caaf65e2e4bfc4af928b5579d54"
          test "$(git rev-parse origin/main:canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json)" = "ee3a274e842471a3362c343f1ffa2eee935f85f0"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("canonical/FA3-DONOR-REFERENCE-REGISTRY-001.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert len(d["entries"]) == 1405
          assert d["backfill"]["entry_count"] == 1405
          print("parent-ok")
          PY
