name: FA3 Voice Studio Full Application

on:
  pull_request:
    paths:
      - 'canonical/profiles/FA3-VOICE-STUDIO-001.json'
      - 'canonical/contracts/FA3-VOICE-STUDIO-CONTRACTS-001.json'
      - 'canonical/FA3-VOICE-PLUGIN-MANIFEST-001.json'
      - 'canonical/actions/voice.*.json'
      - 'src/fa3_voice_workspace.py'
      - 'src/fa3_voice_studio_gate.py'
      - 'bin/fa3-voice-studio'
      - 'apps/fa3-control-center/src/VoiceWorkspaceService.*'
      - 'apps/fa3-control-center/qml/VoiceStudioPage.qml'
      - 'apps/fa3-control-center/qml/QuickVoicePluginPage.qml'
      - 'apps/fa3-control-center/qml/VoiceActivityOverlay.qml'
      - 'apps/fa3-control-center/qml/Main.qml'
      - 'apps/fa3-control-center/src/main.cpp'
      - 'apps/fa3-control-center/CMakeLists.txt'
      - 'tests/test_voice_workspace_*.py'
  push:
    branches:
      - 'fa3/**'
    paths:
      - 'canonical/profiles/FA3-VOICE-STUDIO-001.json'
      - 'canonical/contracts/FA3-VOICE-STUDIO-CONTRACTS-001.json'
      - 'canonical/FA3-VOICE-PLUGIN-MANIFEST-001.json'
      - 'canonical/actions/voice.*.json'
      - 'src/fa3_voice_workspace.py'
      - 'src/fa3_voice_studio_gate.py'
      - 'bin/fa3-voice-studio'
      - 'apps/fa3-control-center/src/VoiceWorkspaceService.*'
      - 'apps/fa3-control-center/qml/VoiceStudioPage.qml'
      - 'apps/fa3-control-center/qml/QuickVoicePluginPage.qml'
      - 'apps/fa3-control-center/qml/VoiceActivityOverlay.qml'
      - 'apps/fa3-control-center/qml/Main.qml'
      - 'apps/fa3-control-center/src/main.cpp'
      - 'apps/fa3-control-center/CMakeLists.txt'
      - 'tests/test_voice_workspace_*.py'

jobs:
  voice-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: |
          python -m py_compile src/fa3_voice_workspace.py src/fa3_voice_studio_gate.py
          bash -n bin/fa3-voice-studio
      - name: Workspace policy tests
        run: python -m unittest -v tests.test_voice_workspace_policy
      - name: Workspace flow tests
        run: python -m unittest -v tests.test_voice_workspace_flow
      - name: Full application gate
        run: python src/fa3_voice_studio_gate.py --root .
