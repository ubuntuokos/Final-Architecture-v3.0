name: FA3 Buzz Global Reconciliation Materializer Fix

on:
  push:
    branches: [buzz-global-reconciliation-2026-09-06]

permissions:
  contents: write

concurrency:
  group: fa3-buzz-global-reconcile-fix-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate with canonical snapshot semantics
        run: |
          python tools/fa3_buzz_global_reconcile.py
          first=$(sha256sum canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json | awk '{print $1}')
          python tools/fa3_buzz_global_reconcile.py
          second=$(sha256sum canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json | awk '{print $1}')
          test "$first" = "$second"
          echo "Deterministic regeneration SHA256: $second"
      - name: Remove one-shot workflow before release-surface validation
        run: git rm .github/workflows/fa3-buzz-reconcile-fix-once.yml
      - name: Validate corrected release surface and Buzz reconciliation
        run: |
          python -m py_compile src/fa3_buzz_gate.py src/fa3_buzz_global_reconciliation.py tools/fa3_buzz_global_reconcile.py
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_buzz*.py' -v
          PYTHONPATH=src python -m unittest tests.test_release_projection.ReleaseProjectionGateTests.test_current_projection_passes -v
          PYTHONPATH=src python -m unittest tests.test_release_projection.ReleaseProjectionGateTests.test_squash_lineage_accepts_content_equivalent_snapshot -v
          PYTHONPATH=src python src/fa3_release_projection_gate.py --root .
          PYTHONPATH=src python src/fa3_buzz_gate.py --root .
      - name: Commit corrected generated projection
        shell: bash
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: regenerate Buzz projection with canonical snapshot semantics"
          git push origin HEAD:buzz-global-reconciliation-2026-09-06
