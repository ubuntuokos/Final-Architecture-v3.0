name: FA3 Model Router Provider Execution Gate
on:
  pull_request:
    paths:
      - 'canonical/profiles/FA3-MODEL-ROUTER-PROVIDER-EXECUTION-001.json'
      - 'canonical/profiles/FA3-LLM-PROTOCOL-COMPAT-001.json'
      - 'canonical/contracts/FA3-MODEL-ROUTER-EXECUTION-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-LLM-PROTOCOL-COMPAT-CONTRACTS-001.json'
      - 'canonical/model-router-provider-execution-enforcement.json'
      - 'src/fa3_model_router_provider_execution.py'
      - 'src/fa3_model_router_provider_execution_gate.py'
      - 'bin/fa3-model-router-provider-execution-current-host.py'
      - 'bin/fa3-model-router-provider-execution-current-host-provision.sh'
      - 'bin/fa3-openai-loopback-bridge.py'
      - 'bin/fa3-openai-provider-execution-current-host-close.sh'
      - 'canonical/providers/FA3-PROVIDER-OPENAI-API-001.json'
      - 'canonical/FA3-OPENAI-API-EXTERNAL-POLICY-001.json'
      - 'tests/test_model_router_provider_execution.py'
      - 'tests/test_model_router_provider_execution_current_host.py'
      - '.github/workflows/fa3-model-router-provider-execution-gate.yml'
  push:
    paths:
      - 'canonical/profiles/FA3-MODEL-ROUTER-PROVIDER-EXECUTION-001.json'
      - 'canonical/profiles/FA3-LLM-PROTOCOL-COMPAT-001.json'
      - 'src/fa3_model_router_provider_execution.py'
      - 'src/fa3_model_router_provider_execution_gate.py'
      - 'bin/fa3-model-router-provider-execution-current-host.py'
      - 'bin/fa3-model-router-provider-execution-current-host-provision.sh'
      - 'bin/fa3-openai-loopback-bridge.py'
      - 'bin/fa3-openai-provider-execution-current-host-close.sh'
      - 'canonical/providers/FA3-PROVIDER-OPENAI-API-001.json'
      - 'canonical/FA3-OPENAI-API-EXTERNAL-POLICY-001.json'
      - 'tests/test_model_router_provider_execution.py'
      - 'tests/test_model_router_provider_execution_current_host.py'
  workflow_dispatch:
jobs:
  reference-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: python -m py_compile src/fa3_model_router_provider_execution.py src/fa3_model_router_provider_execution_gate.py bin/fa3-model-router-provider-execution-current-host.py bin/fa3-openai-loopback-bridge.py
      - name: Shell syntax
        run: bash -n bin/fa3-model-router-provider-execution-current-host-provision.sh bin/fa3-openai-provider-execution-current-host-close.sh
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest tests.test_model_router_provider_execution tests.test_model_router_provider_execution_current_host
      - name: Canonical gate
        run: PYTHONPATH=src python src/fa3_model_router_provider_execution_gate.py --root .
