name: FA3 GTCRN global reconcile once

on:
  push:
    branches:
      - feat/gtcrn-speech-enhancement
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure commit identity
        run: |
          git config user.name "fa3-reconcile-bot"
          git config user.email "fa3-reconcile-bot@users.noreply.github.com"
      - name: Reconcile GTCRN evidence registry
        run: |
          python tools/fa3_gtcrn_global_reconcile.py --prepare-only
          git add evidence/evidence-registry.json
          if ! git diff --cached --quiet; then
            git commit -m "FA3: reconcile GTCRN evidence registry"
            git push origin HEAD:feat/gtcrn-speech-enhancement
          fi
      - name: Regenerate unified canonical projection
        run: |
          SNAPSHOT_HEAD="$(git rev-parse HEAD)"
          python tools/fa3_gtcrn_global_reconcile.py --projection-only --snapshot-head "$SNAPSHOT_HEAD"
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git commit -m "FA3: regenerate unified projection for GTCRN"
          git push origin HEAD:feat/gtcrn-speech-enhancement
