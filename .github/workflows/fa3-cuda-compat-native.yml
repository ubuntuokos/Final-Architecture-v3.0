name: FA3 Native CUDA Compatibility Core

on:
  pull_request:
    paths:
      - 'canonical/providers/FA3-PROVIDER-CFA3-NATIVE-CUDA-COMPAT-001.json'
      - 'canonical/contracts/FA3-CUDA-COMPAT-NATIVE-CONTRACTS-001.json'
      - 'canonical/intents/FA3-CUDA-COMPAT-NATIVE-APPLICATION-INTENT-2026-10-04.json'
      - 'canonical/assessments/FA3-CUDA-COMPAT-NATIVE-REUSE-ASSESSMENT-2026-10-04.json'
      - 'canonical/assessments/FA3-CUDA-COMPAT-NATIVE-DECISION-ASSESSMENT-2026-10-04.json'
      - 'canonical/current-host-impact/FA3-CH-IMPACT-CUDA-COMPAT-NATIVE-20261004.json'
      - 'canonical/FA3-CUDA-COMPAT-NATIVE-CURRENT-HOST-CONFORMANCE-001.json'
      - 'canonical/FA3-GATE-CUDA-COMPAT-NATIVE-001.json'
      - 'canonical/FA3-GATE-REGISTRY-001.json'
      - 'canonical/enforcement-policy.json'
      - 'canonical/FA3-APPLICATION-DONOR-LINKS-001.json'
      - 'canonical/decisions/FA3-DEC-CUDA-COMPAT-NATIVE-PLAN-APPROVAL-2026-10-04.json'
      - 'canonical/decisions/FA3-DEC-CUDA-COMPAT-OROCHI-DONOR-USE-2026-10-04.json'
      - 'canonical/decisions/FA3-DEC-CUDA-COMPAT-ROCM-EXAMPLES-DONOR-USE-2026-10-04.json'
      - 'src/fa3_cuda_compat_ir.py'
      - 'src/fa3_cuda_compat_frontend.py'
      - 'src/fa3_cuda_compat_backends.py'
      - 'src/fa3_cuda_compat_runtime.py'
      - 'src/fa3_cuda_compat_build.py'
      - 'src/fa3_cuda_compat_native.py'
      - 'src/fa3_cuda_compat_shared.py'
      - 'src/fa3_accelerator_backend_probe.py'
      - 'src/fa3_cuda_compat_gate.py'
      - 'tests/test_cuda_compat_native.py'
      - 'tests/test_cuda_compat_shared.py'
      - 'tests/test_cuda_compat_integration.py'
      - 'tests/test_cuda_compat_gate.py'
      - 'docs/cfa3-native-cuda-compat-2026-10-04.md'
      - 'docs/cfa3-native-cuda-compat-final-plan-2026-10-04.md'
      - '.github/workflows/fa3-cuda-compat-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda-compat-native-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Python syntax
        run: |
          python -m py_compile \
            src/fa3_cuda_compat_ir.py \
            src/fa3_cuda_compat_frontend.py \
            src/fa3_cuda_compat_backends.py \
            src/fa3_cuda_compat_runtime.py \
            src/fa3_cuda_compat_build.py \
            src/fa3_cuda_compat_native.py \
            src/fa3_cuda_compat_shared.py \
            src/fa3_accelerator_backend_probe.py \
            src/fa3_cuda_compat_gate.py \
            tests/test_cuda_compat_native.py \
            tests/test_cuda_compat_shared.py \
            tests/test_cuda_compat_integration.py \
            tests/test_cuda_compat_gate.py
      - name: Native CUDA compatibility regressions
        env:
          PYTHONPATH: src
        run: |
          python -m unittest \
            tests.test_cuda_compat_native \
            tests.test_cuda_compat_shared \
            tests.test_cuda_compat_integration \
            tests.test_cuda_compat_gate
      - name: Canonical native CUDA compatibility gate
        env:
          PYTHONPATH: src
        run: python src/fa3_cuda_compat_gate.py --root "$GITHUB_WORKSPACE"
