name: FA3 Change History Current-Host

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  current-host:
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 10
    env:
      FA3_RUNNER_CLASS: fa3-current-host
      FA3_EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact non-root source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(git rev-parse HEAD)" = "$FA3_EXPECTED_SOURCE_SHA"
          test "$GITHUB_REPOSITORY" = "ubuntuokos/Final-Architecture-v3.0"
      - name: Collect physical positive negative rollback evidence
        run: PYTHONPATH=src python3 evidence/collect-change-history-current-host.py
      - name: Validate physical receipt
        run: PYTHONPATH=src python3 src/fa3_change_history_current_host_gate.py --root .
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-change-history-current-host
          path: |
            reports/change-history-current-host.json
            reports/change-history-current-host-gate-report.json
          if-no-files-found: error
