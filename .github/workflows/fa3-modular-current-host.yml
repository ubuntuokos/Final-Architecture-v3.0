name: FA3 Modular Current-Host Production E2E Fallback

on:
  push:
    branches:
      - fa3/modular-current-host-exec-generic

permissions:
  contents: read

jobs:
  modular-current-host:
    name: modular-current-host / production-e2e-fallback
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fail-closed current-host identity check
        shell: bash
        run: |
          set -euo pipefail
          lscpu | tee "$RUNNER_TEMP/fa3-lscpu.txt"
          grep -Fq "Intel(R) Xeon(R) CPU E5-2697 v4" "$RUNNER_TEMP/fa3-lscpu.txt"
          sockets="$(lscpu -p=socket | grep -v '^#' | sort -u | wc -l)"
          [[ "$sockets" -eq 2 ]]
          logical="$(nproc --all)"
          [[ "$logical" -ge 72 ]]
          mem_kib="$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          [[ "$mem_kib" -ge 500000000 ]]
          command -v nvidia-smi >/dev/null 2>&1
          nvidia-smi --query-gpu=name,driver_version --format=csv,noheader | tee "$RUNNER_TEMP/fa3-gpu.txt"
          grep -Fq "RTX A1000" "$RUNNER_TEMP/fa3-gpu.txt"
          echo "FA3_CURRENT_HOST_IDENTITY=PASS" >> "$GITHUB_ENV"

      - name: Materialize isolated stable MAX/Mojo runtime
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v uv >/dev/null 2>&1; then
            python3 -m pip install --user uv
          fi
          export FA3_MODULAR_VENV="${RUNNER_TEMP}/fa3-modular-venv"
          echo "FA3_MODULAR_VENV=$FA3_MODULAR_VENV" >> "$GITHUB_ENV"
          bash bin/fa3-modular-bootstrap.sh

      - name: Run real CPU MAX inference + Mojo compile/execute E2E
        shell: bash
        run: |
          set -euo pipefail
          [[ "${FA3_CURRENT_HOST_IDENTITY:-}" == "PASS" ]]
          export PATH="$FA3_MODULAR_VENV/bin:$HOME/.local/bin:$PATH"
          bash bin/fa3-modular-current-host.sh \
            --model-revision 9e6c6ccf47cd318696e137d381a7ded8fe4df09f \
            --devices cpu \
            --evidence-channel stable \
            --allow-network-model-fetch

      - name: Upload current-host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-modular-current-host-evidence
          path: |
            evidence/receipts/modular-current-host.json
            evidence/runtime/modular-current-host/
            reports/modular-current-host-gate-report.json
            ${{ runner.temp }}/fa3-lscpu.txt
            ${{ runner.temp }}/fa3-gpu.txt
