name: FA3 Modular Current-Host Production E2E

on:
  workflow_dispatch:
    inputs:
      devices:
        description: "cpu or explicit gpu:N"
        required: true
        default: "cpu"
        type: string
      hrb_lease:
        description: "Absolute HRB lease path on the self-hosted runner (required for gpu:N)"
        required: false
        default: ""
        type: string
      allow_network_model_fetch:
        description: "Explicitly permit Hugging Face model fetch when the pinned snapshot is not cached"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  modular-current-host:
    name: modular-current-host / production-e2e
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify pre-materialized runtime
        shell: bash
        run: |
          test -x "${FA3_MODULAR_VENV:-$GITHUB_WORKSPACE/.venv-modular}/bin/max"
          test -x "${FA3_MODULAR_VENV:-$GITHUB_WORKSPACE/.venv-modular}/bin/mojo"

      - name: Run production E2E collector and gate
        shell: bash
        env:
          FA3_MODULAR_VENV: ${{ vars.FA3_MODULAR_VENV }}
        run: |
          args=(
            --model-revision 9e6c6ccf47cd318696e137d381a7ded8fe4df09f
            --devices "${{ inputs.devices }}"
            --evidence-channel stable
          )
          if [[ -n "${{ inputs.hrb_lease }}" ]]; then
            args+=(--hrb-lease "${{ inputs.hrb_lease }}")
          fi
          if [[ "${{ inputs.allow_network_model_fetch }}" == "true" ]]; then
            args+=(--allow-network-model-fetch)
          fi
          bash bin/fa3-modular-current-host.sh "${args[@]}"

      - name: Upload current-host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-modular-current-host-evidence
          path: |
            evidence/receipts/modular-current-host.json
            evidence/runtime/modular-current-host/
            reports/modular-current-host-gate-report.json
