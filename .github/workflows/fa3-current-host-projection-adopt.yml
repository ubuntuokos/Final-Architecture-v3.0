name: FA3 Current Host Projection Recovery Adopter

on:
  workflow_run:
    workflows: ["FA3 Release Projection Reconcile"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: fa3-current-host-projection-adopt-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  adopt:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'fa3/current-host-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: true
      - id: adopt
        name: Validate exact recovery lineage and adopt
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_BRANCH" in fa3/current-host-*) ;; *) exit 2 ;; esac
          case "$SOURCE_BRANCH" in *".."*|*" "*|*$'\n'*) exit 2 ;; esac
          projection="canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json"
          recovery="automation/release-projection-pr-${SOURCE_SHA:0:12}"
          git fetch --no-tags origin             "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/source"             "+refs/heads/$recovery:refs/remotes/origin/recovery"
          current="$(git rev-parse refs/remotes/origin/source)"
          if [ "$current" != "$SOURCE_SHA" ]; then
            echo "Superseded projection recovery; no adoption."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rec="$(git rev-parse refs/remotes/origin/recovery)"
          test "$(git cat-file -p "$rec" | grep -c '^parent ')" -eq 1
          test "$(git rev-parse "$rec^")" = "$SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA..$rec")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$projection"
          git checkout --detach "$rec"
          chmod +x bin/fa3-enforce
          ./bin/fa3-enforce release-projection
          git push origin "$rec:refs/heads/$SOURCE_BRANCH"
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "recovery_sha=$rec" >> "$GITHUB_OUTPUT"
          echo "Validated projection recovery adopted: $rec"
      - name: Dispatch controller for exact recovered generation
        if: steps.adopt.outputs.dispatch == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RECOVERY_SHA: ${{ steps.adopt.outputs.recovery_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.SOURCE_BRANCH;
            const recovery = process.env.RECOVERY_SHA;
            const live = await github.rest.repos.getBranch({owner, repo, branch});
            if (live.data.commit.sha !== recovery) {
              core.info('Recovered generation was superseded; controller dispatch skipped.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: 'fa3-current-host-closure-controller.yml',
              ref: branch
            });

  retrigger-after-successful-projection:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'fa3/current-host-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch controller only for exact projection child
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.SOURCE_BRANCH;
            const source = process.env.SOURCE_SHA;
            const projection = 'canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json';
            const live = await github.rest.repos.getBranch({owner, repo, branch});
            const current = live.data.commit.sha;
            if (current === source) {
              core.info('Projection was already stable at the source head; push controller owns this generation.');
              return;
            }
            const row = await github.rest.repos.getCommit({owner, repo, ref: current});
            const commit = row.data;
            if (commit.parents.length !== 1 || commit.parents[0].sha !== source) {
              core.info('Branch advanced beyond the exact projection child; stale dispatch skipped.');
              return;
            }
            const files = commit.files || [];
            if (files.length !== 1 || files[0].filename !== projection) {
              core.setFailed('Successful projection reconcile advanced branch with a non-projection delta.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: 'fa3-current-host-closure-controller.yml',
              ref: branch
            });
