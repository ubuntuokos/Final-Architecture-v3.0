name: FA3 Hardware Fabric Reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - 'canonical/FA3-ACCEL-GUARD-001.json'
      - 'canonical/FA3-HARDWARE-FABRIC-RECONCILIATION-001.json'
      - 'canonical/FA3-HARDWARE-FABRIC-CONFORMANCE-001.json'
      - 'canonical/FA3-COMPUTE-PROFILE-001.json'
      - 'canonical/profiles/FA3-HW-001.json'
      - 'src/fa3_accelerator_guard.py'
      - 'src/fa3_hardware_fabric_gate.py'
      - 'src/fa3_hardware_fabric_current_host_gate.py'
      - 'evidence/collect-hardware-fabric-current-host.py'
      - 'evidence/reference/hardware-fabric-reconciliation-2026-09-16.json'
      - 'tests/test_accelerator_guard.py'
      - 'tests/test_hardware_fabric_gate.py'
      - 'bin/fa3-enforce'
      - 'bin/fa3-current-host'
      - '.github/workflows/fa3-hardware-fabric.yml'
  workflow_dispatch:
    inputs:
      execute_current_host:
        description: 'Execute the real hardware-fabric receipt collection on fa3-current-host'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  hardware-fabric-static:
    name: hardware-fabric / static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: |
          python -m py_compile \
            src/fa3_accelerator_guard.py \
            src/fa3_hardware_fabric_gate.py \
            src/fa3_hardware_fabric_current_host_gate.py \
            evidence/collect-hardware-fabric-current-host.py
      - name: Hardware fabric executable regressions
        run: PYTHONPATH=src python -m unittest tests.test_accelerator_guard tests.test_hardware_fabric_gate -v
      - name: Hardware fabric canonical gate
        run: ./bin/fa3-enforce hardware-fabric
      - name: Global static enforcement chain
        run: ./bin/fa3-enforce static
      - name: Missing current-host receipt must remain fail-closed
        run: |
          rm -f .fa3-current-host/hardware-fabric-receipt.json
          set +e
          ./bin/fa3-enforce hardware-fabric-current-host
          rc=$?
          set -e
          test "$rc" -eq 2

  hardware-fabric-current-host:
    name: hardware-fabric / current-host
    needs: hardware-fabric-static
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.execute_current_host) }}
    runs-on: [self-hosted, linux, x64, fa3-current-host]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Execute Accelerator Guard current-host evidence
        run: |
          chmod +x bin/fa3-current-host bin/fa3-enforce evidence/collect-hardware-fabric-current-host.py
          ./bin/fa3-current-host hardware-fabric --sample-interval 1.0
          ./bin/fa3-enforce hardware-fabric-current-host
      - name: Upload hardware fabric current-host receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa3-hardware-fabric-current-host
          if-no-files-found: warn
          path: |
            .fa3-current-host/hardware-fabric-receipt.json
