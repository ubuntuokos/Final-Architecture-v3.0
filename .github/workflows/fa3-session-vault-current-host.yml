name: FA3 Session Vault Current-Host Closure
on:
  pull_request:
  workflow_dispatch:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest tests.test_session_vault_current_host -v
      - name: Committed real current-host receipt passes
        run: PYTHONPATH=src python src/fa3_session_vault_current_host_gate.py --root .
      - name: Missing receipt remains fail-closed
        run: |
          set +e
          PYTHONPATH=src python src/fa3_session_vault_current_host_gate.py --root . --receipt evidence/receipts/session-vault-current-host-missing.json
          rc=$?
          set -e
          test "$rc" -eq 2
