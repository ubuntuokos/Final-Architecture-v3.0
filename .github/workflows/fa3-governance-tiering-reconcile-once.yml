name: FA3 Governance Tiering One-Shot Reconcile

on:
  push:
    branches:
      - codex/fa3-governance-tiering-derived-projection
    paths:
      - '.github/workflows/fa3-governance-tiering-reconcile-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    name: reconcile / self-removing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fa3-governance-tiering-derived-projection
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure reconciliation committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Remove this one-shot workflow before taking the release snapshot
        run: |
          git rm -- .github/workflows/fa3-governance-tiering-reconcile-once.yml
          git commit -m 'FA3 governance tiering: remove one-shot reconciler'
          git push origin HEAD:codex/fa3-governance-tiering-derived-projection
      - name: Reconcile unified release projection from final release surface
        run: python3 scripts/fa3_reconcile_release_projection.py --root .
      - name: Commit deterministic release projection reconciliation
        run: |
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          git diff --cached --exit-code && { echo 'Expected release projection reconciliation delta is missing' >&2; exit 1; }
          git commit -m 'FA3 governance tiering: reconcile unified release projection'
          git push origin HEAD:codex/fa3-governance-tiering-derived-projection
