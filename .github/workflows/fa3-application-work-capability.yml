name: CFA3 Application Work Capability

on:
  pull_request:
    paths:
      - 'canonical/FA3-APPLICATION-WORK-CAPABILITY-OWNER-MAP-001.json'
      - 'canonical/FA3-PLATFORM-BINDING-RECONCILIATION-001.json'
      - 'canonical/FA3-APPLICATION-WORK-CAPABILITY-CONSUMER-RECONCILIATION-001.json'
      - 'canonical/FA3-APPLICATION-DONOR-LINKS-001.json'
      - 'canonical/FA3-AI-STUDIO-APP-CATALOG-001.json'
      - 'canonical/FA3-APPLICATION-INSTALLATION-REGISTRY-001.json'
      - 'canonical/FA3-PRODUCT-FAMILY-REGISTRY-001.json'
      - 'canonical/contracts/FA3-WORK-MANAGEMENT-SEMANTIC-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-APPLICATION-RUNTIME-LIFECYCLE-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-CAPABILITY-GRANT-SCOPE-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-WORK-CONTEXT-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-AGENT-APPLICATION-BLUEPRINT-EXTENSION-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-TASK-CAPSULE-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-APPLICATION-OPERATION-HANDOFF-CONTRACTS-001.json'
      - 'src/fa3_work_management_semantics.py'
      - 'src/fa3_application_runtime_lifecycle.py'
      - 'src/fa3_capability_grant_scope.py'
      - 'src/fa3_work_context.py'
      - 'src/fa3_task_capsule.py'
      - 'src/fa3_application_handoff.py'
      - 'src/fa3_application_work_capability_gate.py'
      - 'tests/test_work_management_semantics.py'
      - 'tests/test_application_runtime_lifecycle.py'
      - 'tests/test_capability_grant_scope.py'
      - 'tests/test_work_context.py'
      - 'tests/test_task_capsule.py'
      - 'tests/test_application_handoff.py'
      - 'tests/test_application_work_capability_gate.py'
      - 'apps/**'
      - 'apps/fa3-control-center/qml/WorkManagementPage.qml'
      - 'apps/fa3-control-center/qml/AgentActionCenterPage.qml'
      - 'apps/fa3-control-center/qml/Fa3OsPage.qml'
      - 'apps/fa3-control-center/qml/AiStudioPage.qml'
      - '.github/workflows/fa3-application-work-capability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-materialization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile implementation
        run: |
          python -m py_compile             src/fa3_work_management_semantics.py             src/fa3_application_runtime_lifecycle.py             src/fa3_capability_grant_scope.py             src/fa3_work_context.py             src/fa3_task_capsule.py             src/fa3_application_handoff.py             src/fa3_application_work_capability_gate.py
      - name: Unit tests
        run: |
          python -m unittest -v             tests.test_work_management_semantics             tests.test_application_runtime_lifecycle             tests.test_capability_grant_scope             tests.test_work_context             tests.test_task_capsule             tests.test_application_handoff             tests.test_application_work_capability_gate
      - name: Composite gate
        run: python src/fa3_application_work_capability_gate.py
