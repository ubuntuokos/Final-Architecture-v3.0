name: FA3 OpenHero one-shot reconciliation

on:
  push:
    branches: [fa3/openhero-web-creative-asset]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize unified OpenHero release projection
        run: python tools/finalize_openhero_projection.py
