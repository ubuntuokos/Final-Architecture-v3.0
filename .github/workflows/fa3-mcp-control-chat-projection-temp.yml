name: FA3 temporary MCP Control Chat projection reconcile

on:
  push:
    branches:
      - fa3-mcp-control-chat-v1

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa3-mcp-control-chat-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile release projection
        shell: bash
        run: |
          set -euo pipefail
          temp_workflow=".github/workflows/fa3-mcp-control-chat-projection-temp.yml"
          saved="/tmp/fa3-mcp-control-chat-projection-temp.yml"
          mv "$temp_workflow" "$saved"
          python src/fa3_release_projection_regenerate.py
          mv "$saved" "$temp_workflow"
          git config user.name "fa3-mcp-control-chat-projection"
          git config user.email "fa3-mcp-control-chat-projection@users.noreply.github.com"
          git add canonical/releases/FA3-RELEASE-PROJECTION-POST-V3.0.11-2026-08-30.json
          if git diff --cached --quiet; then
            echo "Projection already coherent"
            exit 0
          fi
          git commit -m "FA3 MCP Control Chat: reconcile release projection"
          git push origin HEAD:fa3-mcp-control-chat-v1
