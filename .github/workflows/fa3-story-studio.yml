name: FA3 Story Studio Gate

on:
  pull_request:
    paths:
      - 'canonical/profiles/FA3-STORY-001.json'
      - 'canonical/profiles/FA3-STORY-STUDIO-001.json'
      - 'canonical/contracts/FA3-STORY-CONTRACTS-001.json'
      - 'canonical/contracts/FA3-STORY-STUDIO-CONTRACTS-001.json'
      - 'canonical/intents/FA3-STORY-STUDIO-APPLICATION-INTENT-001.json'
      - 'canonical/assessments/FA3-STORY-STUDIO-REUSE-ASSESSMENT-001.json'
      - 'canonical/decisions/FA3-DEC-STORY-STUDIO-UNIFIED-2026-09-27.json'
      - 'canonical/FA3-GATE-STORY-STUDIO-001.json'
      - 'canonical/story-studio-enforcement.json'
      - 'src/fa3_story_studio.py'
      - 'src/fa3_story_studio_gate.py'
      - 'tests/test_story_studio.py'
      - 'apps/fa3-control-center/qml/StoryStudioPage.qml'
      - 'apps/fa3-control-center/qml/AiStudioPage.qml'
      - 'apps/fa3-control-center/qml/Main.qml'
      - 'apps/fa3-control-center/CMakeLists.txt'
      - 'src/fa3_gui_gate.py'
      - '.github/workflows/fa3-story-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  story-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile src/fa3_story_studio.py src/fa3_story_studio_gate.py
      - name: Story Studio unit regressions
        run: PYTHONPATH=src python -m unittest tests.test_story_studio -v
      - name: Story Studio P0 gate
        run: PYTHONPATH=src python src/fa3_story_studio_gate.py --root .
      - name: GUI route/surface gate
        run: PYTHONPATH=src python src/fa3_gui_gate.py
